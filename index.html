          })
        ]));
      });
    }
    wrap.appendChild(card);
  }

  // ── סטטוס הבקשות שהגשתי ──
  const myReqs = S.swaps.filter(s=>s.giver_id===myEmpId||s.taker_id===myEmpId);
  if(myReqs.length>0){
    const sCard = div("card",[e("div",{style:"font-weight:700;font-size:13px;color:#64748B;margin-bottom:10px"},"⏳ הבקשות שלי")]);
    myReqs.slice(0,10).forEach(s=>{
      const sh=SHIFT_BY_ID[s.shift];
      
      let badgeClass = "pending";
      let badgeText = "ממתין";
      if (s.status === "approved") { badgeClass = "approved"; badgeText = "אושר"; }
      else if (s.status === "rejected") { badgeClass = "rejected"; badgeText = "נדחה"; }
      else if (s.status === "pending_peer") { badgeClass = "pending"; badgeText = "ממתין לעובד"; }
      else if (s.status === "pending_manager") { badgeClass = "pending"; badgeText = "ממתין למנהל"; }

      sCard.appendChild(e("div",{style:"display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #0F172A"},[

        e("span",{class:"status-badge status-"+badgeClass}, badgeText)
      ]));
    });
    wrap.appendChild(sCard);
  }

  return wrap;
}

// ── STATS ──
function viewStats() {
  const wd = getWeekDates(S.weekOffset);
  const totalAssigned = wd.reduce((t,d)=>t+SHIFTS.reduce((s,sh)=>s+(S.schedule[d]?.[sh.id]?.length||0),0),0);
  const maxPossible = wd.length * SHIFTS.length * 2;
  const fillRate = maxPossible > 0 ? Math.round((totalAssigned/maxPossible)*100) : 0;

  const wrap = e("div");
  wrap.appendChild(div("page-title",["📊 דשבורד נתונים"],{style:"margin-bottom:16px"}));

  // KPIs
  const kpis = [
    {icon:"📅",lbl:"שיבוצים",val:totalAssigned,sub:"השבוע",color:"#3B82F6"},
    {icon:"📈",lbl:"אחוז מילוי",val:fillRate+"%",sub:fillRate>70?"מצוין":"דורש שיפור",color:fillRate>70?"#10B981":"#F59E0B"},
    {icon:"🌴",lbl:"חופשות ממתינות",val:S.vacations.filter(v=>v.status==="pending").length,sub:"לאישור",color:"#6366F1"},
    {icon:"👥",lbl:"עובדים פעילים",val:S.employees.length,sub:"במערכת",color:"#10B981"},
  ];
  const kpiGrid = div("kpi-grid");
  kpis.forEach(k => kpiGrid.appendChild(div("kpi",[
    div("kpi-icon",[k.icon]),
    e("div",{class:"kpi-val",style:"color:"+k.color},String(k.val)),
    div("kpi-lbl",[k.lbl]),
    k.sub?e("div",{class:"kpi-sub"},[k.sub]):null
  ],{style:"border-color:"+k.color+"33"})));
  wrap.appendChild(kpiGrid);

  // Per shift
  const shiftCard = div("card",[e("div",{class:"card-title"},"מילוי לפי משמרת")]);
  SHIFTS.forEach(sh => {
    const total = wd.reduce((s,d)=>s+(S.schedule[d]?.[sh.id]?.length||0),0);
    const max = wd.length*2;
    const pct = Math.round((total/max)*100);
    shiftCard.appendChild(div("workload-row",[
      div("workload-info",[
        e("span",{style:"font-weight:700;color:"+sh.color},sh.label+" ("+sh.start+"–"+sh.end+")"),
        e("span",{style:"font-size:12px;color:#94A3B8"},`${total}/${max} · ${pct}%`)
      ]),
      div("workload-bar-bg",[e("div",{class:"workload-bar-fill",style:`width:${pct}%;background:${sh.color}`})])
    ]));
  });
  wrap.appendChild(shiftCard);

  // Per employee
  const empCard = div("card",[e("div",{class:"card-title"},"פירוט לפי עובד")]);
  schedulableEmployees().forEach((emp,idx) => {
    const col = ec(idx);
    const count = wd.reduce((t,d)=>t+SHIFTS.reduce((s,sh)=>s+((S.schedule[d]?.[sh.id]||[]).includes(emp.id)?1:0),0),0);
    const max = emp.max_shifts_per_week||5;
    const pct = Math.min(Math.round((count/max)*100),100);
    const over = count>max;
    empCard.appendChild(div("workload-row",[
      div("workload-info",[
        e("div",{style:"display:flex;align-items:center;gap:7px"},[
          e("span",{style:`width:8px;height:8px;border-radius:50%;background:${col}`},""),
          e("span",{style:"font-weight:600;font-size:13px"},emp.name),
          over?e("span",{style:"font-size:10px;color:#EF4444"},"⚠️"):null
        ]),
        e("span",{style:"font-size:12px;font-weight:700;color:"+(over?"#EF4444":"#94A3B8")},`${count}/${max}`)
      ]),
      div("workload-bar-bg",[e("div",{class:"workload-bar-fill",style:`width:${pct}%;background:${over?"#EF4444":pct>80?"#F59E0B":"#10B981"}`})])
    ]));
  });
  wrap.appendChild(empCard);
  return wrap;
}

        card.appendChild(dayCard);
      });

      const selKeys = Object.entries(S.availDraft).filter(([,v])=>v).map(([k])=>k);

      // Single note field for all blocks
      card.appendChild(e("div",{style:"margin-top:14px;border-top:1px solid #334155;padding-top:12px"},[
        e("div",{style:"font-weight:700;font-size:13px;color:#F59E0B;margin-bottom:8px"},"💬 פירוט / הערה (אופציונלי)"),
        e("textarea",{
          class:"fi",
          placeholder:"למשל: מבחן ביום ראשון, אירוע משפחתי בשישי...",
          style:"min-height:70px;resize:vertical",
          id:"block-special-request"
        })
      ]));

      card.appendChild(div("form-actions",[
        btn("btn-sm btn-sm-blue","💾 שמור כברירת מחדל",()=>{
          const selKeys2 = Object.entries(S.availDraft).filter(([,v])=>v).map(([k])=>k);
          if (!selKeys2.length) { toast("בחר לפחות משמרת אחת","err"); return; }
          const defaults = selKeys2.map(k => {
            const [di, shId] = k.split("|");
            const dt = new Date(targetDates[parseInt(di)]+"T00:00:00");
            return { day: dt.getDay(), shift: shId };
          });
          localStorage.setItem("blockDefaults_" + emp.id, JSON.stringify(defaults));
          toast("ברירת מחדל נשמרה ✓");
        }),
        btn("btn-sm btn-sm-red","📤 שלח / עדכן חסימות",async()=>{
          if (!selKeys.length && !document.getElementById("block-special-request")?.value?.trim()) { toast("בחר משמרת או כתוב הודעה","err"); return; }
          const specialMsg = document.getElementById("block-special-request")?.value?.trim() || "";
          // Always save the submission to the DB — even if it's a note-only submission with no specific shifts.
          // (Previously a note-only submission only emailed the manager and was never stored, so it never
          //  appeared in the blocks panel.)
          const slots = selKeys.map(k=>{
            const [di,shId]=k.split("|");
            return {day:new Date(targetDates[parseInt(di)]+"T00:00:00").getDay(),shift:shId,date:targetDates[parseInt(di)],reason:""};
          });
          await submitAvailability(emp.id, targetStart, slots, specialMsg || "חסימות");
          // Send special message to manager if exists
          if (specialMsg) {
            S.employees.filter(e=>(e.role==="admin"||e.role==="manager") && e.email).forEach(adminEmp => {
              sendEmail("block_message", adminEmp.email, {
                requesterName: emp.name,
                targetDate: fmtDate(targetDates[0])+" — "+fmtDate(targetDates[6]),
                shiftLabel: "בקשה מיוחדת לחסימות",
                note: specialMsg
              });
            });
          }
          S.availDraft={}; S.blockReasons={};
          toast("נשלח בהצלחה ✓"); render();
        },{style:"flex:1"}),
        btn("btn-sm btn-sm-gray","נקה",()=>{S.availDraft={};S.blockReasons={};S._draftCleared=true;render();})
      ],{style:"margin-top:12px"}));
    }

    wrap.appendChild(card);

    } // end deadline else

    // History — all past submissions
    const myPastSubs = (S.availSubmissions||[]).filter(b=>b.employee_id===emp.id);
    const myPastBlocks = myPastSubs;
    if (myPastSubs.length > 0) {
      const histCard = div("card",[
        e("div",{style:"font-weight:800;font-size:14px;color:#94A3B8;margin-bottom:12px"},"📜 חסימות שהגשת בעבר")
      ]);

      myPastSubs.sort((a,b) => (b.week_start||"").localeCompare(a.week_start||"")).forEach(sub => {
        const wk = sub.week_start;
        histCard.appendChild(e("div",{style:"font-weight:700;font-size:12px;color:#60A5FA;margin-bottom:6px;margin-top:10px"},
          "שבוע " + (wk ? fmtDate(wk) : "לא ידוע")));

        const slotsGrid = e("div",{style:"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"});
        (sub.slots||[]).sort((a,b) => (a.date||"").localeCompare(b.date||"")).forEach(sl => {
          const sh = SHIFT_BY_ID[sl.shift];
          const dt = sl.date ? new Date(sl.date+"T00:00:00") : null;
          const dayLabel = dt ? (DAYS[dt.getDay()]+" "+dt.getDate()+"/"+(dt.getMonth()+1)) : ("יום "+(DAYS[sl.day]||sl.day));
          slotsGrid.appendChild(e("div",{style:"background:#1E293B;border:1px solid "+(sh?.color||"#64748B")+"44;border-radius:8px;padding:6px 10px"},[
            e("div",{style:"font-weight:700;font-size:11px;color:"+(sh?.color||"#94A3B8")},dayLabel),
            e("div",{style:"font-size:10px;color:"+(sh?.color||"#64748B")},sh?.label||sl.shift),
            sl.reason ? e("div",{style:"font-size:9px;color:#FCA5A5;margin-top:2px"},"💬 "+sl.reason) : null
          ]));
        });
        histCard.appendChild(slotsGrid);

        if (sub.note) {
          histCard.appendChild(e("div",{style:"font-size:11px;color:#F59E0B;font-style:italic;margin-bottom:8px"},"📩 "+sub.note));
        }
      });
      wrap.appendChild(histCard);
    }


  }

  else if (S.empViewTab==="vacation") {
    wrap.appendChild(viewEmpVacations());
  }
  else if (S.empViewTab==="swaps_emp") {
    wrap.appendChild(viewSwaps(true));
  }

  return wrap;
}

// ── CONSTRAINTS MODAL ──
function viewConstraintsModal() {
  const emp = S.constraintsEmp;
  if (!emp) return null;

  const WEEKDAYS = ["ראשון","שני","שלישי","רביעי","חמישי"];
  const WEEKEND = ["שישי","שבת"];

  let localDC = JSON.parse(JSON.stringify(emp.day_constraints||{}));
  let localMax = emp.max_shifts_per_week||5;
  let localPerShift = JSON.parse(JSON.stringify(emp.max_per_shift||{}));
  let localAvail = [...(emp.availability||DAYS)];
  let localPref = [...(emp.preferred_shifts||[])];
  let localActiveDays = [...(emp.active_days || [0,1,2,3,4,5,6])]; // 0=Sun..6=Sat
  let localWorkShifts = [...(emp.allowed_shifts || SHIFTS.map(s=>s.id))];
  let localFixedShifts = JSON.parse(JSON.stringify(emp.fixed_shifts || {}));
  let localExcludeFrom = emp.exclude_from || null;
  let localExcludeTo = emp.exclude_to || null;
  let localExcludeReason = emp.exclude_reason || "";
  let localMaxBlocks = emp.max_blocks_per_week ?? 99;
  let localBlockLimits = JSON.parse(JSON.stringify(emp.block_limits || {
    weekday: { morning: 3, afternoon: 3, night: 1 },
    weekend: { morning: 1, afternoon: 1, night: 1 }
  }));
  let localAllowedBlocks = JSON.parse(JSON.stringify(emp.allowed_block_slots||{}));

  const modal = div("modal");
  const mh = div("modal-header",[
    div("modal-title",[`הגבלות — ${emp.name}`]),
    btn("modal-close","✕",()=>{S.constraintsEmp=null;render();})
  ]);
  modal.appendChild(mh);

  function rebuildModal() {
    // Clear and rebuild
    while(modal.childNodes.length>1) modal.removeChild(modal.lastChild);

    // Max shifts
    const r1 = div("card",[
      e("div",{class:"form-label",style:"margin-bottom:6px"},"מקסימום משמרות בשבוע"),
      e("div",{style:"display:flex;align-items:center;gap:10px"},[
        e("input",{class:"fi",type:"number",min:1,max:21,value:localMax,style:"width:80px;text-align:center",
          oninput:ev=>{localMax=parseInt(ev.target.value)||1;}}),
        e("span",{style:"font-size:13px;color:#64748B"},"משמרות")
      ])
    ],{style:"margin-bottom:12px"});
    modal.appendChild(r1);

    // ── Active days ──
    const daysCard = div("card",[
      e("div",{class:"form-label",style:"margin-bottom:10px"},"📅 ימים פעילים"),
      e("div",{style:"font-size:11px;color:#475569;margin-bottom:10px"},"בחר באילו ימים העובד עובד — ימים לא פעילים לא יישובצו אוטומטית")
    ],{style:"margin-bottom:12px"});
    const daysGrid = e("div",{style:"display:flex;flex-wrap:wrap;gap:6px"});
    DAYS.forEach((dayName, dayIdx) => {
      const isActive = localActiveDays.includes(dayIdx);
      daysGrid.appendChild(e("button",{
        style:`padding:10px 14px;border-radius:10px;border:1px solid ${isActive?"#10B981":"#334155"};background:${isActive?"#10B98122":"#0F172A"};color:${isActive?"#10B981":"#475569"};font-family:inherit;font-weight:700;font-size:13px;cursor:pointer`,
        onclick:()=>{
          if(isActive) localActiveDays = localActiveDays.filter(d=>d!==dayIdx);
          else localActiveDays.push(dayIdx);
          rebuildModal();
        }
      },isActive ? "✓ "+dayName : dayName));
    });
    daysCard.appendChild(daysGrid);
    modal.appendChild(daysCard);

    // ── Allowed shifts ──
    const shiftsCard = div("card",[
      e("div",{class:"form-label",style:"margin-bottom:10px"},"🕐 משמרות מותרות"),
      e("div",{style:"font-size:11px;color:#475569;margin-bottom:10px"},"למשל: עובד שעובד רק בוקר — בטל את הסימון מצהריים ולילה")
    ],{style:"margin-bottom:12px"});
    const shiftsGrid = e("div",{style:"display:flex;gap:8px"});
    SHIFTS.forEach(sh => {
      const isAllowed = localWorkShifts.includes(sh.id);
      shiftsGrid.appendChild(e("button",{
        style:`flex:1;padding:14px 10px;border-radius:12px;border:2px solid ${isAllowed?sh.color:sh.color+"33"};background:${isAllowed?sh.color+"22":"#0F172A"};color:${isAllowed?sh.color:"#475569"};font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;text-align:center`,
        onclick:()=>{
          if(isAllowed) localWorkShifts = localWorkShifts.filter(s=>s!==sh.id);
          else localWorkShifts.push(sh.id);
          rebuildModal();
        }
      },[
        e("div",{style:"font-size:20px;margin-bottom:4px"},isAllowed?"✓":"✗"),
        e("div",{},sh.label)
      ]));
    });
    shiftsCard.appendChild(shiftsGrid);
    modal.appendChild(shiftsCard);

    // ── Fixed schedule ──
    const fixedCard = div("card",[
      e("div",{class:"form-label",style:"margin-bottom:10px"},"📌 שיבוץ קבוע"),
      e("div",{style:"font-size:11px;color:#475569;margin-bottom:10px"},"העובד ישובץ אוטומטית בימים ובמשמרות שתבחר — תמיד, בכל שבוע")
    ],{style:"margin-bottom:12px"});
    if (!localFixedShifts) localFixedShifts = {};
    // Day-by-day cards layout (mobile friendly)
    const FIXED_SHIFTS = [
      { id:"morning", label:"בוקר", color:"#F59E0B" },
      { id:"afternoon", label:"צהריים", color:"#10B981" },
      { id:"night", label:"לילה", color:"#6366F1" },
    ];
    DAYS.forEach((dayName, dayIdx) => {
      const isWE = dayIdx >= 5;
      const dayShifts = isWE ? FIXED_SHIFTS.filter(sh=>sh.id!=="afternoon") : FIXED_SHIFTS;
      const dayRow = e("div",{style:"background:#0F172A;border:1px solid #334155;border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between"});
      dayRow.appendChild(e("div",{style:"font-weight:700;font-size:13px;color:"+(isWE?"#A855F7":"#E2E8F0")+";min-width:50px"},dayName));
      const btnsWrap = e("div",{style:"display:flex;gap:6px;flex-wrap:wrap"});
      dayShifts.forEach(sh => {
        // "morning" button controls both morning and morning2
        const key = dayIdx + "_" + sh.id;
        const key2 = sh.id === "morning" ? dayIdx + "_morning2" : null;
        const isFixed = !!localFixedShifts[key] || (key2 && !!localFixedShifts[key2]);
        btnsWrap.appendChild(e("button",{
          style:"padding:8px 14px;border-radius:8px;border:1px solid "+(isFixed?sh.color:sh.color+"33")+";background:"+(isFixed?sh.color+"22":"#1E293B")+";color:"+(isFixed?sh.color:"#475569")+";font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap",
          onclick:()=>{
            if(isFixed) {
              delete localFixedShifts[key];
              if(key2) delete localFixedShifts[key2];
            } else {
              localFixedShifts[key] = true;
              if(key2) localFixedShifts[key2] = true;
            }
            rebuildModal();
          }
        },(isFixed?"✓ ":"")+sh.label));
      });
      dayRow.appendChild(btnsWrap);
      fixedCard.appendChild(dayRow);
    });
    const fixedCount = Object.values(localFixedShifts).filter(Boolean).length;
    if (fixedCount > 0) {
      fixedCard.appendChild(e("div",{style:"margin-top:8px;font-size:11px;color:#10B981;font-weight:700"},"📌 "+fixedCount+" משמרות קבועות הוגדרו"));
    }
    modal.appendChild(fixedCard);

    // ── Temporary exclusion ──
    const exCard = div("card",[
      e("div",{class:"form-label",style:"margin-bottom:10px"},"🚑 השעיה זמנית מהסידור"),
      e("div",{style:"font-size:11px;color:#475569;margin-bottom:10px"},"העובד לא יישובץ בתאריכים אלו (מחלה, חל״ת, וכו׳)")
    ],{style:"margin-bottom:12px"});
    exCard.appendChild(div("form-row",[
      div("form-col",[
        e("label",{class:"form-label"},"מתאריך"),
        e("input",{class:"fi",type:"date",value:localExcludeFrom||"",oninput:ev=>{localExcludeFrom=ev.target.value||null;}})
      ]),
      div("form-col",[
        e("label",{class:"form-label"},"עד תאריך"),
        e("input",{class:"fi",type:"date",value:localExcludeTo||"",oninput:ev=>{localExcludeTo=ev.target.value||null;}})
      ])
    ]));
    exCard.appendChild(e("input",{class:"fi",placeholder:"סיבה (מחלה, חל״ת...)",value:localExcludeReason,style:"margin-top:8px",
      oninput:ev=>{localExcludeReason=ev.target.value;}}));
    if (localExcludeFrom && localExcludeTo) {
      exCard.appendChild(e("div",{style:"margin-top:10px;background:#EF444418;border:1px solid #EF444433;border-radius:8px;padding:8px 12px;font-size:12px;color:#FCA5A5"},
        "🚑 מושעה: " + fmtDate(localExcludeFrom) + " — " + fmtDate(localExcludeTo) + (localExcludeReason ? " (" + localExcludeReason + ")" : "")));
    }
    exCard.appendChild(btn("btn-sm btn-sm-gray","נקה השעיה",()=>{localExcludeFrom=null;localExcludeTo=null;localExcludeReason="";rebuildModal();},{style:"margin-top:8px"}));
    modal.appendChild(exCard);

    // Per shift limits removed - handled by block_limits


    // ── Block limits per day group ──
    const limCard = div("card",[
      e("div",{class:"form-label",style:"margin-bottom:10px"},"🚫 כמות חסימות מותרת לעובד")
    ],{style:"margin-bottom:12px"});

    // Weekday limits (Sun-Thu)
    limCard.appendChild(e("div",{style:"font-weight:700;font-size:13px;color:#3B82F6;margin-bottom:8px"},"ראשון — חמישי"));
    limCard.appendChild(e("div",{style:"display:flex;gap:10px;margin-bottom:14px"},BLOCK_SHIFTS.map(sh => 
      div("form-col",[
        e("label",{style:"font-size:11px;font-weight:700;color:"+sh.color},sh.label),
        e("input",{class:"fi",type:"number",min:0,max:5,value:localBlockLimits.weekday?.[sh.id]??3,style:"text-align:center",
          oninput:ev=>{if(!localBlockLimits.weekday)localBlockLimits.weekday={};localBlockLimits.weekday[sh.id]=parseInt(ev.target.value)||0;}})
      ])
    )));

    // Weekend limits (Fri-Sat) — only morning + night (no afternoon)
    limCard.appendChild(e("div",{style:"font-weight:700;font-size:13px;color:#A855F7;margin-bottom:8px"},"שישי — שבת"));
    limCard.appendChild(e("div",{style:"display:flex;gap:10px;margin-bottom:8px"},BLOCK_SHIFTS.filter(sh=>sh.id!=="afternoon").map(sh => 
      div("form-col",[
        e("label",{style:"font-size:11px;font-weight:700;color:"+sh.color},sh.label),
        e("input",{class:"fi",type:"number",min:0,max:2,value:localBlockLimits.weekend?.[sh.id]??1,style:"text-align:center",
          oninput:ev=>{if(!localBlockLimits.weekend)localBlockLimits.weekend={};localBlockLimits.weekend[sh.id]=parseInt(ev.target.value)||0;}})
      ])
    )));
    limCard.appendChild(e("div",{style:"font-size:11px;color:#475569"},"0 = אסור לחסום כלל"));
    modal.appendChild(limCard);

    // Block slots are now controlled by block_limits above

    // Actions
    modal.appendChild(div("form-actions",[
      btn("btn-add","שמור הגבלות",async()=>{
        await saveConstraints(emp.id,{maxShifts:localMax,blockLimits:localBlockLimits,activeDays:localActiveDays,allowedShifts:localWorkShifts,excludeFrom:localExcludeFrom,excludeTo:localExcludeTo,excludeReason:localExcludeReason,fixedShifts:localFixedShifts});
      },{style:"flex:1"}),
      btn("btn-sm btn-sm-gray","ביטול",()=>{S.constraintsEmp=null;render();})
    ]));
  }

  rebuildModal();
  return div("modal-bg",[modal],{onclick:ev=>{if(ev.target.classList.contains("modal-bg")){S.constraintsEmp=null;render();}}});
}

          S.previewSelectedMgrs = new Set();

        },{style:"flex:1"})
      ]),
      
      // Manager list with checkboxes
      e("div",{style:"max-height:400px;overflow-y:auto;margin-bottom:14px"},
        managers.map((mgr, idx) => {
          const col = ec(empIdx(mgr.id));
          const isSelected = S.previewSelectedMgrs?.has(mgr.id);
          const isSelf = mgr.id === S.user.id;
          return e("label",{
            style:`display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0F172A;border:1px solid ${isSelected?col+"66":"#334155"};border-radius:10px;margin-bottom:6px;cursor:pointer;transition:all 0.15s`,
          },[
            e("input",{
              type:"checkbox",
              checked: isSelected ? "checked" : null,
              style:"width:18px;height:18px;cursor:pointer;accent-color:"+col,
              onchange: ev => {
                if (!S.previewSelectedMgrs) S.previewSelectedMgrs = new Set();
                if (ev.target.checked) S.previewSelectedMgrs.add(mgr.id);
                else S.previewSelectedMgrs.delete(mgr.id);
                render();
              }
            }),
            e("div",{style:`width:34px;height:34px;border-radius:10px;background:${col}22;border:1px solid ${col}44;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:${col};flex-shrink:0`},
              mgr.name.split(" ").map(n=>n[0]).join("").slice(0,2)),
            e("div",{style:"flex:1"},[
              e("div",{style:"font-weight:700;font-size:13px;color:#E2E8F0"},[
                mgr.name,
                isSelf ? e("span",{style:"font-size:10px;color:#60A5FA;margin-right:6px;background:#3B82F622;border-radius:5px;padding:1px 6px"},"אני") : null
              ]),
              e("div",{style:"font-size:11px;color:#64748B;margin-top:2px"},"📧 "+mgr.email)
            ]),
          ]);
        })
      ),
      
      // Footer with action buttons
      e("div",{style:"display:flex;justify-content:space-between;align-items:center;gap:10px"},[
        e("div",{style:"font-size:12px;color:#64748B"},
          `נבחרו: ${S.previewSelectedMgrs?.size || 0} / ${managers.length}`),
        e("div",{style:"display:flex;gap:6px"},[
          btn("btn-sm btn-sm-gray","ביטול",()=>{
            S.showPreviewSelectModal = false;
            S.previewSelectedMgrs = null;
            S.previewConfirmed = false;
            render();
          }),
          btn("btn-add","📤 שלח",()=>{
            if (!S.previewSelectedMgrs || S.previewSelectedMgrs.size === 0) {
              toast("בחר לפחות מנהל אחד","err");
              return;
            }
            // Mark that the user confirmed selection, then run the publish flow
            S.previewConfirmed = true;
            S.showPreviewSelectModal = false;
            publishWeek("preview");
          })
        ])
      ])
    ])
  ],{onclick:ev=>{if(ev.target.classList.contains("modal-bg")){
    S.showPreviewSelectModal = false;
    S.previewSelectedMgrs = null;
    render();
  }}});
}

// MEMOIZATION — cache expensive lookups
// ══════════════════════════════════════════════════════
const _memoCache = new Map();
const _memoVersion = { current: 0 };
// Invalidate memo cache when data changes
function invalidateMemo() { _memoVersion.current++; _memoCache.clear(); }

function memoize(key, fn) {
  const fullKey = key + "::" + _memoVersion.current;
  if (_memoCache.has(fullKey)) return _memoCache.get(fullKey);
  const result = fn();
  _memoCache.set(fullKey, result);
  // Prevent memory leak
  if (_memoCache.size > 200) {
    const firstKey = _memoCache.keys().next().value;
    _memoCache.delete(firstKey);
  }
  return result;
}

// Get employee by ID — heavily used, worth caching
const _empByIdCache = {};
function getEmp(id) {
  if (_empByIdCache.id !== _memoVersion.current) {
    _empByIdCache.id = _memoVersion.current;
    _empByIdCache.map = Object.fromEntries((S.employees||[]).map(e=>[e.id,e]));
  }
  return _empByIdCache.map[id];
}

// Parse a note into tags and free text
function _parseNote(rawNote) {
  if (!rawNote) return { tags: [], text: "" };
  if (rawNote.startsWith("🏷️ ")) {
    const parts = rawNote.split(" | ");
    const tags = parts[0].replace("🏷️ ","").split(", ").map(t=>t.trim()).filter(Boolean);
    const text = parts.slice(1).join(" | ");
    return { tags, text };
  }
  return { tags: [], text: rawNote };
}

// Load schedule data (current week's live state, or fetch from DB for any other week)
async function loadWeekDataForExport(offset, weekStart) {
  let scheduleData = S.schedule;
  let notesData = S.assignmentNotes;
  let hoursData = S.customHours;
  if (offset !== S.weekOffset) {
    const { data: sched } = await sb.from("schedules")
      .select("id").eq("business_id", S.profile.business_id).eq("week_start", weekStart).maybeSingle();
    if (sched) {
      const { data: assigns } = await sb.from("assignments").select("*").eq("schedule_id", sched.id);
      scheduleData = {};
      notesData = {};
      hoursData = {};
      (assigns || []).forEach(a => {
        if (!scheduleData[a.date]) scheduleData[a.date] = {};
        if (!scheduleData[a.date][a.shift]) scheduleData[a.date][a.shift] = [];
        scheduleData[a.date][a.shift].push(a.employee_id);
        const key = a.date+"|"+a.shift+"|"+a.employee_id;
        if (a.note) notesData[key] = a.note;
        if (a.custom_start && a.custom_end) hoursData[key] = {start:a.custom_start, end:a.custom_end};
      });
    } else {
      scheduleData = {}; notesData = {}; hoursData = {};
    }
  }
  return { scheduleData, notesData, hoursData };
}

// Escape user-controlled text before inserting into an HTML string (prevents XSS in exports).
function escHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Export the employee's own shifts for the current week as an .ics calendar file.
// Works with iPhone Calendar, Google Calendar, Outlook — any calendar app.
function exportMyShiftsToCalendar(empId, weekOffsetParam) {
  const offset = weekOffsetParam != null ? weekOffsetParam : S.weekOffset;
  const wd = getWeekDates(offset);
  const targetEmp = getEmp(empId) || getActiveProfile();

  // Gather this employee's shifts for the week
  const myShifts = [];
  wd.forEach(date => {
    SHIFTS.forEach(sh => {
      if ((S.schedule[date]?.[sh.id] || []).includes(empId)) {
        const ch = S.customHours[date+"|"+sh.id+"|"+empId];
        const noteInfo = _parseNote(S.assignmentNotes[date+"|"+sh.id+"|"+empId]);
        const others = (S.schedule[date]?.[sh.id]||[])
          .filter(id=>id!==empId).map(id=>getEmp(id)?.name).filter(Boolean);
        myShifts.push({ date, sh, ch, noteInfo, others });
      }
    });
  });

  if (myShifts.length === 0) {
    toast("אין משמרות להוספה ליומן השבוע", "err");
    return;
  }

  // Build ICS content
  function pad(n){ return String(n).padStart(2,"0"); }
  function toICSDate(dateStr, timeStr, addDay) {
    // dateStr "2026-06-21", timeStr "07:00" -> "20260621T070000" (local, floating time)
    const [y,m,d] = dateStr.split("-").map(Number);
    const [hh,mm] = timeStr.split(":").map(Number);
    const dt = new Date(y, m-1, d + (addDay||0), hh, mm, 0);
    return dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate())+"T"+pad(dt.getHours())+pad(dt.getMinutes())+"00";
  }
  function escICS(s){ return (s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }

  const nowStamp = (()=>{ const d=new Date(); return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+"Z"; })();

  let ics = "BEGIN:VCALENDAR\r\n";
  ics += "VERSION:2.0\r\n";
  ics += "PRODID:-//Meshmeret//Shift Schedule//HE\r\n";
  ics += "CALSCALE:GREGORIAN\r\n";
  ics += "METHOD:PUBLISH\r\n";

  myShifts.forEach((item, i) => {
    const start = item.ch ? item.ch.start : item.sh.start;
    const end = item.ch ? item.ch.end : item.sh.end;
    // Night shift (or any shift where end <= start) crosses midnight -> end is next day
    const crossesMidnight = (end <= start);
    const dtStart = toICSDate(item.date, start, 0);
    const dtEnd = toICSDate(item.date, end, crossesMidnight ? 1 : 0);

    // Build description with extras
    let descLines = [];
    if (item.noteInfo.tags.length > 0) descLines.push("מערכות/תפקיד: " + item.noteInfo.tags.join(", "));
    if (item.noteInfo.text) descLines.push("הערה: " + item.noteInfo.text);
    if (item.others.length > 0) descLines.push("יחד עם: " + item.others.join(", "));
    const desc = descLines.join("\\n");

    const uid = "meshmeret-" + item.date + "-" + item.sh.id + "-" + empId + "-" + i + "@shiftpmosoc.com";

    ics += "BEGIN:VEVENT\r\n";
    ics += "UID:" + uid + "\r\n";
    ics += "DTSTAMP:" + nowStamp + "\r\n";
    ics += "DTSTART:" + dtStart + "\r\n";
    ics += "DTEND:" + dtEnd + "\r\n";
    ics += "SUMMARY:" + escICS("משמרת " + item.sh.label) + "\r\n";
    if (desc) ics += "DESCRIPTION:" + escICS(desc) + "\r\n";
    ics += "BEGIN:VALARM\r\n";
    ics += "TRIGGER:-PT2H\r\n";
    ics += "ACTION:DISPLAY\r\n";
    ics += "DESCRIPTION:" + escICS("משמרת " + item.sh.label + " בעוד שעתיים") + "\r\n";
    ics += "END:VALARM\r\n";
    ics += "END:VEVENT\r\n";
  });

  ics += "END:VCALENDAR\r\n";

  // Trigger download / share of the .ics file
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const fileName = "mishmarot_" + wd[0] + ".ics";

  // Try native share first (lets iPhone open directly in Calendar)
  const file = new File([blob], fileName, { type: "text/calendar" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: "המשמרות שלי" })
      .then(()=>toast("✓ נפתח — בחר 'הוסף ליומן'"))
      .catch(err=>{
        if (err?.name === "AbortError") return;
        _downloadICS(blob, fileName);
      });
  } else {
    _downloadICS(blob, fileName);
  }
}

function _downloadICS(blob, fileName) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast("📅 קובץ היומן הורד — פתח אותו כדי להוסיף ליומן");
}

async function exportSchedulePDF(weekOffsetParam) {
  const offset = weekOffsetParam != null ? weekOffsetParam : S.weekOffset;
  const wd = getWeekDates(offset);
  const weekStart = wd[0];
  const weekLabel = fmtDate(wd[0]) + " — " + fmtDate(wd[6]);
  
  const { scheduleData, notesData, hoursData } = await loadWeekDataForExport(offset, weekStart);
  const innerHtml = buildScheduleTableInnerHTML(wd, scheduleData, notesData, hoursData, weekLabel);

  let html = `<!DOCTYPE html><html dir="rtl" lang="he">
<head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0}
  @page{size:landscape;margin:8mm}
  @media print{body{padding:0}}
</style></head><body>
${innerHtml}
</body></html>`;

  // Use hidden iframe instead of new window — so user stays in the app
  const existingIframe = document.getElementById("__print_iframe");
  if (existingIframe) existingIframe.remove();
  
  const iframe = document.createElement("iframe");
  iframe.id = "__print_iframe";
  iframe.style.position = "fixed";
  iframe.style.right = "0";
  iframe.style.bottom = "0";
  iframe.style.width = "0";
  iframe.style.height = "0";
  iframe.style.border = "0";
  iframe.style.opacity = "0";
  document.body.appendChild(iframe);
  
  // Write content to iframe
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(html);
  doc.close();
  
  // Wait for fonts/content to load, then print
  setTimeout(() => {
    try {
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    } catch (err) {
      console.error("Print failed:", err);
      // Fallback: offer HTML download
      const blob = new Blob([html], {type: "text/html;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `seder_avoda_${weekStart}.html`;
      a.click();
      URL.revokeObjectURL(url);
      toast("הורד כקובץ HTML — פתח אותו והדפס לקבלת PDF","ok");
    }
    // Remove iframe after a delay
    setTimeout(() => iframe.remove(), 2000);
  }, 800);
  
  toast("פתח להדפסה / שמירה כ-PDF ✓");
}

// Lazy-load html2canvas only when actually needed (keeps initial page load light)
function _ensureHtml2Canvas() {
  return new Promise((resolve, reject) => {
    if (window.html2canvas) { resolve(); return; }
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("html2canvas failed to load"));
    document.head.appendChild(s);
  });
}

async function exportScheduleWhatsApp(weekOffsetParam) {
  const offset = weekOffsetParam != null ? weekOffsetParam : S.weekOffset;
  const wd = getWeekDates(offset);
  const weekStart = wd[0];
  const weekLabel = fmtDate(wd[0]) + " — " + fmtDate(wd[6]);

  toast("📸 מכין תמונה...");

  try {
    await _ensureHtml2Canvas();
  } catch (err) {
    toast("שגיאה בטעינת מנוע התמונה. בדוק חיבור לאינטרנט.", "err");
    return;
  }

  const { scheduleData, notesData, hoursData } = await loadWeekDataForExport(offset, weekStart);
  const innerHtml = buildScheduleTableInnerHTML(wd, scheduleData, notesData, hoursData, weekLabel);

  // Render the table off-screen (not display:none — html2canvas needs real layout)
  const wrapper = document.createElement("div");
  wrapper.style.position = "fixed";
  wrapper.style.top = "0";
  wrapper.style.left = "-99999px";
  wrapper.style.zIndex = "-1";
  wrapper.innerHTML = innerHtml;
  document.body.appendChild(wrapper);

  // Give fonts/layout a moment to settle
  await new Promise(r => setTimeout(r, 150));

  let blob;
  try {
    const target = wrapper.querySelector("#wa-export-root") || wrapper;
    const canvas = await window.html2canvas(target, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
    blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
  } catch (err) {
    console.error("html2canvas failed:", err);
    toast("שגיאה ביצירת התמונה", "err");
    wrapper.remove();
    return;
  }
  wrapper.remove();

  if (!blob) { toast("שגיאה ביצירת התמונה", "err"); return; }

  const fileName = `seder_avoda_${weekStart}.png`;
  const file = new File([blob], fileName, { type: "image/png" });

  // Prefer the native share sheet (lets the user pick WhatsApp directly) when available
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "סידור עבודה", text: weekLabel });
      toast("✓ נשלח לשיתוף");
      return;
    } catch (err) {
      // User cancelled the share sheet — not an error, just stop quietly
      if (err?.name === "AbortError") return;
      console.warn("Share failed, falling back to download:", err);
    }
  }

  // Fallback (desktop / unsupported browsers): download the image and guide the user
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);
  toast("📥 התמונה הורדה — צרף אותה ידנית בוואטסאפ", "ok");
}

async function exportScheduleCSV(weekOffsetParam) {
  const offset = weekOffsetParam != null ? weekOffsetParam : S.weekOffset;
  const wd = getWeekDates(offset);
  const weekStart = wd[0];
  
  // Load schedule data + notes + customHours for the selected week
  let scheduleData = S.schedule;
  let notesData = S.assignmentNotes;
  let hoursData = S.customHours;
  if (offset !== S.weekOffset) {
    const { data: sched } = await sb.from("schedules")
      .select("id").eq("business_id", S.profile.business_id).eq("week_start", weekStart).maybeSingle();
    if (sched) {
      const { data: assigns } = await sb.from("assignments").select("*").eq("schedule_id", sched.id);
      scheduleData = {};
      notesData = {};
      hoursData = {};
      (assigns || []).forEach(a => {
        if (!scheduleData[a.date]) scheduleData[a.date] = {};
        if (!scheduleData[a.date][a.shift]) scheduleData[a.date][a.shift] = [];
        scheduleData[a.date][a.shift].push(a.employee_id);
        const key = a.date+"|"+a.shift+"|"+a.employee_id;
        if (a.note) notesData[key] = a.note;
        if (a.custom_start && a.custom_end) hoursData[key] = {start:a.custom_start, end:a.custom_end};
      });
    } else {
      scheduleData = {};
      notesData = {};
      hoursData = {};
    }
  }
  
  let csv = "\u05de\u05e9\u05de\u05e8\u05ea,\u05e9\u05e2\u05d5\u05ea,"+wd.map(d=>{const dt=new Date(d+"T00:00:00");return DAYS[dt.getDay()]+" "+dt.getDate();}).join(",")+String.fromCharCode(10);
  SHIFTS.forEach(sh => {
    const row = [sh.label, sh.start+"–"+sh.end];
    wd.forEach(date => {
      const empIds = scheduleData[date]?.[sh.id]||[];
      if (empIds.length === 0) {
        row.push("—");
      } else {
        // For each employee, format: "Name [07:00-15:00] {Cortex, EDR} (note)"
        const empStrs = empIds.map(id => {
          const emp = getEmp(id);
          const key = date+"|"+sh.id+"|"+id;
          const ch = hoursData[key];
          const noteInfo = _parseNote(notesData[key]);
          let str = emp?.name||"?";
          if (ch) str += " [" + ch.start + "-" + ch.end + "]";
          if (noteInfo.tags.length > 0) str += " {" + noteInfo.tags.join(", ") + "}";
          if (noteInfo.text) str += " (" + noteInfo.text + ")";
          return str;
        });
        row.push(empStrs.join(" + "));
      }
    });
    csv += row.map(v=>"\""+v.replace(/"/g, '""')+"\"").join(",") + String.fromCharCode(10);
  });
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=`seder_avoda_${weekStart}.csv`;
  a.click(); URL.revokeObjectURL(url);
  toast("קובץ CSV הורד ✓");
}

      }, [
        e("div", { style: "font-size:20px;margin-bottom:4px" }, typeIcons[type]),
        e("div", {}, typeNames[type])
      ]));
    });
    f.appendChild(typeSel);

    // Info banner based on type
    const infos = {
      vacation: { color: "#10B981", text: "📤 בקשת חופשה תישלח לאישור מנהל — לאחר אישור תחסום את המשמרות" },

      style: `background:${info.color}11;border:1px solid ${info.color}33;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600;color:${info.color};margin-bottom:14px`
    }, info.text));

      div("form-col", [
        e("label", { class: "form-label" }, "מתאריך *"),
        e("input", { type: "date", class: "fi", value: S.newVac.startDate||"", oninput: x => { S.newVac.startDate = x.target.value; render(); } })
      ]),
      div("form-col", [
        e("label", { class: "form-label" }, "עד תאריך *"),
        e("input", { type: "date", class: "fi", value: S.newVac.endDate||"", oninput: x => { S.newVac.endDate = x.target.value; render(); } })
      ])
    ]));

    // Partial-day option for the first & last days (vacation/reserve only — exam doesn't block)
    if ((S.newVac.type || "vacation") !== "exam" && S.newVac.startDate && S.newVac.endDate && S.newVac.endDate >= S.newVac.startDate) {
      if (!S.newVac.startDayShifts) S.newVac.startDayShifts = null; // null = whole day

      const buildPartialRow = (label, dateStr, key) => {

    f.appendChild(e("label", { class: "form-label", style: "margin-top:8px;display:block" }, "הערה (אופציונלי)"));
    f.appendChild(e("input", {
      class: "fi", placeholder: "למשל: מבחן בליניארית, מילואים בנגב...",
      style: "margin-bottom:14px",
      oninput: x => S.newVac.reason = x.target.value
    }));

    f.appendChild(btn("btn-primary", "שלח בקשה", async () => {
      if (!S.newVac.startDate || !S.newVac.endDate) return toast("נא למלא תאריכים", "err");
      await addVacation();
      S.showAddVac = false;
      render();
    }, { style: "width:100%; padding:12px;" }));
    wrap.appendChild(f);
  }

  // List of requests
  if (my.length === 0) {
    wrap.appendChild(div("card", [e("div", { style: "text-align:center;padding:24px;color:#64748B" }, "אין בקשות קודמות")]));
  } else {
    const card = div("card");
    const typeIcons2 = { vacation: "🌴", reserve: "🎖️", exam: "📝" };
    const typeNames2 = { vacation: "חופשה", reserve: "מילואים", exam: "מבחן" };
    const typeColors = { vacation: "#10B981", reserve: "#6366F1", exam: "#F59E0B" };

    my.sort((a, b) => String(b.start_date).localeCompare(String(a.start_date))).forEach(v => {
      const st = v.status === "approved" ? "approved" : v.status === "rejected" ? "rejected" : "pending";
      const label = v.status === "approved" ? "אושרה ✓" : v.status === "rejected" ? "נדחתה ✗" : "ממתין לאישור";
      const col = typeColors[v.type] || "#10B981";

      card.appendChild(e("div", { style: "display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #0F172A" }, [
        e("div", {}, [
          e("div", { style: `font-weight:800;font-size:14px;color:#F1F5F9` }, [
            e("span", { style: `color:${col};margin-left:6px` }, typeIcons2[v.type] || "🌴"),
            `${typeNames2[v.type] || "חופשה"}: ${fmtDate(v.start_date)}${v.start_date !== v.end_date ? " — " + fmtDate(v.end_date) : ""}`
          ]),
          v.reason ? e("div", { style: "font-size:11px;color:#64748B;margin-top:3px" }, v.reason) : null,
          (describePartialVac(v)) ? e("div", { style: "font-size:10px;color:#C084FC;margin-top:2px" }, "🕐 "+describePartialVac(v)) : null,
          e("div", { style: "margin-top:5px" }, [e("span", { class: "status-badge status-" + st }, label)]),
          (v.status === "rejected" && v.reject_reason) ? e("div", { style: "margin-top:6px;background:#EF444415;border-right:3px solid #EF4444;border-radius:6px;padding:6px 10px" }, [
            e("span", { style: "font-size:10px;color:#FCA5A5;font-weight:700" }, "סיבת הדחייה: "),
            e("span", { style: "font-size:12px;color:#E2E8F0" }, v.reject_reason)
          ]) : null
        ]),
        btn("btn-sm btn-sm-red", "🗑️", () => deleteVacRequest(v.id))
      ]));
    });
    wrap.appendChild(card);
  }
  return wrap;
}

// CALENDAR VIEW
// ══════════════════════════════════════════════════════
function viewCalendar() {
  const wrap = e("div");
  if (!S.monthOffset) S.monthOffset = 0;
  
  const now = new Date();
  const viewMonth = now.getMonth() + S.monthOffset;
  const viewYear = now.getFullYear() + Math.floor(viewMonth / 12);
  const actualMonth = ((viewMonth % 12) + 12) % 12;
  
  const monthName = new Date(viewYear, actualMonth, 1).toLocaleDateString("he-IL", {month:"long", year:"numeric"});

  wrap.appendChild(div("section-header",[
    div("page-title",["🗓️ "+monthName]),
    e("div",{style:"display:flex;gap:8px"},[
      btn("btn-sm btn-sm-gray","→",()=>{S.monthOffset--;render();}),
      btn("btn-sm btn-sm-blue","החודש",()=>{S.monthOffset=0;render();}),
      btn("btn-sm btn-sm-gray","←",()=>{S.monthOffset++;render();})
    ])
  ]));

  const firstDay = new Date(viewYear, actualMonth, 1);
  const lastDay = new Date(viewYear, actualMonth + 1, 0);
  const startDow = firstDay.getDay();
  const totalDays = lastDay.getDate();

  const calCard = div("card");
  calCard.style.padding = "12px";

  // Day headers
  const hdrRow = e("div",{style:"display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px"});
  DAYS.forEach(d=>hdrRow.appendChild(e("div",{style:"text-align:center;font-size:11px;font-weight:700;color:#64748B;padding:4px 0"},d)));
  calCard.appendChild(hdrRow);

  const grid = e("div",{style:"display:grid;grid-template-columns:repeat(7,1fr);gap:2px"});

  for (let i=0; i<startDow; i++) {
    grid.appendChild(e("div",{style:"min-height:70px"}));
  }

  for (let d=1; d<=totalDays; d++) {
    const dateStr = viewYear+"-"+String(actualMonth+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const dt = new Date(dateStr+"T00:00:00");
    const isToday = dateStr === today();

    const cell = e("div",{
      style:"min-height:70px;background:"+(isToday?"#1E3A5F":"#1E293B")+";border-radius:8px;padding:4px;border:1px solid "+(isToday?"#3B82F6":"#334155")+";cursor:pointer;overflow:hidden",
      onclick:()=>{
        const diffDays = Math.round((dt - new Date(today()+"T00:00:00"))/(1000*60*60*24));
        S.weekOffset = Math.floor(diffDays/7);
        S.view="schedule";
        loadSchedule().then(()=>render());
      }
    });

    cell.appendChild(e("div",{style:"font-size:12px;font-weight:"+(isToday?"900":"600")+";color:"+(isToday?"#60A5FA":"#E2E8F0")+";margin-bottom:2px"},String(d)));
    const holiday = getHoliday(dateStr);
    if (holiday) {
      cell.appendChild(e("div",{style:"font-size:7px;color:#FCD34D;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"},"✡️ "+holiday));
    }

    // Show schedule data if available
    const daySched = S.schedule[dateStr];
    if (daySched) {
      SHIFTS.forEach(sh => {
        const empIds = daySched[sh.id];
        if (Array.isArray(empIds) && empIds.length > 0) {
          cell.appendChild(e("div",{style:"font-size:8px;background:"+sh.color+"22;color:"+sh.color+";border-radius:3px;padding:1px 3px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"},sh.label+": "+empIds.length));
        }
      });
    }

    // Vacations
    const dayVacs = S.vacations.filter(v=>v.status==="approved"&&v.type!=="exam"&&dateStr>=v.start_date&&dateStr<=v.end_date);
    dayVacs.slice(0,2).forEach(v=>{
      const emp=getEmp(v.employee_id);
      if(emp) cell.appendChild(e("div",{style:"font-size:8px;color:#F59E0B;white-space:nowrap;overflow:hidden"},"🌴 "+emp.name.split(" ")[0]));
    });

    grid.appendChild(cell);
  }

  calCard.appendChild(grid);
  wrap.appendChild(calCard);
  return wrap;
}

  // ── MANAGER BLOCKS VIEW ──
function viewManagerBlocks() {
  const wrap = e("div");
  wrap.appendChild(div("page-title", ["🚫 חסימות"], {style:"margin-bottom:16px"}));

  // Tabs: my blocks vs team blocks
  if (!S.mgrBlocksTab) S.mgrBlocksTab = "team";
  const tabRow = e("div",{style:"display:flex;gap:6px;margin-bottom:14px"});
  [{id:"mine",label:"🚫 החסימות שלי"},{id:"team",label:"👥 חסימות עובדים"}].forEach(t=>{
    const isActive = S.mgrBlocksTab===t.id;
    tabRow.appendChild(e("button",{
      style:"flex:1;padding:10px;border-radius:10px;border:1px solid "+(isActive?"#3B82F6":"#334155")+";background:"+(isActive?"#3B82F622":"#1E293B")+";color:"+(isActive?"#60A5FA":"#64748B")+";font-family:inherit;font-weight:700;font-size:13px",
      onclick:()=>{S.mgrBlocksTab=t.id;render();}
    },t.label));
  });
  wrap.appendChild(tabRow);

  // "My blocks" tab - reuse employee block form
  if (S.mgrBlocksTab === "mine") {
    const emp = S.employees.find(e=>e.id===S.user.id);
    if (emp) {
      const targetOffset = S.availTargetOffset || 1;
      const targetDates = getWeekDates(targetOffset);
      const targetStart = targetDates[0];
      const blockLimits = emp.block_limits || { weekday:{morning:3,afternoon:3,night:1}, weekend:{morning:1,afternoon:1,night:1} };

      function getMgrBlockCount(shiftId, isWE) {
        let count = 0;
        Object.entries(S.availDraft).forEach(([key,val]) => {
          if (!val) return;
          const [di, sid] = key.split("|");
          if (sid !== shiftId) return;
          const dt = new Date(targetDates[parseInt(di)]+"T00:00:00");
          const dayIsWE = dt.getDay() === 5 || dt.getDay() === 6;
          if (dayIsWE === isWE) count++;
        });
        return count;
      }

      // Pre-populate with existing blocks for the week being viewed.
      // Track which week the current draft belongs to — if we navigated to a different
      // week, reload that week's saved blocks fresh (unless the user actively cleared THIS week).
    const existingSub = S.availSubmissions.find(s => s.employee_id === emp.id && s.week_start === targetStart);
    const draftIsForThisWeek = (S._draftWeek === targetStart);
    if (existingSub && !draftIsForThisWeek && !(S._draftCleared && draftIsForThisWeek)) {
      S.availDraft = {};
      (existingSub.slots || []).forEach(sl => {
        targetDates.forEach((date, di) => {
          if (sl.date === date || (!sl.date && new Date(date+"T00:00:00").getDay() === sl.day)) {
            S.availDraft[di+"|"+sl.shift] = true;
          }
        });
      });
      S._draftWeek = targetStart;
      S._draftCleared = false;
    } else if (!existingSub && !draftIsForThisWeek) {
      // No saved blocks for this week and we just navigated here — start empty
      S.availDraft = {};
      S._draftWeek = targetStart;
    }

    const card = div("card");

    if (existingSub) {
      card.appendChild(e("div",{style:"background:#3B82F618;border:1px solid #3B82F633;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center"},[
        e("div",{style:"font-size:12px;color:#60A5FA;font-weight:600"},"📝 יש חסימות קיימות לשבוע זה — ניתן לעדכן ולשלוח מחדש"),
      ]));
    }

      // Week selector
      card.appendChild(e("div",{style:"display:flex;gap:6px;margin-bottom:10px"},[
        e("button",{
          onclick:()=>{S.availTargetOffset=1;S.availDraft={};S._draftWeek=null;S._draftCleared=false;render();},
          style:"flex:1;padding:10px;border-radius:10px;border:1px solid "+(targetOffset===1?"#EF4444aa":"#334155")+";background:"+(targetOffset===1?"#EF444422":"#1E293B")+";color:"+(targetOffset===1?"#EF4444":"#94A3B8")+";font-family:inherit;cursor:pointer"
        },[
          e("div",{style:"font-size:13px;font-weight:700"},"שבוע הבא"),
          e("div",{style:"font-size:10px;opacity:0.8;margin-top:2px"},fmtDate(getWeekDates(1)[0])+" — "+fmtDate(getWeekDates(1)[6]))
        ]),
        e("button",{
          onclick:()=>{S.availTargetOffset=2;S.availDraft={};S._draftWeek=null;S._draftCleared=false;render();},
          style:"flex:1;padding:10px;border-radius:10px;border:1px solid "+(targetOffset===2?"#EF4444aa":"#334155")+";background:"+(targetOffset===2?"#EF444422":"#1E293B")+";color:"+(targetOffset===2?"#EF4444":"#94A3B8")+";font-family:inherit;cursor:pointer"
        },[
          e("div",{style:"font-size:13px;font-weight:700"},"עוד שבועיים"),
          e("div",{style:"font-size:10px;opacity:0.8;margin-top:2px"},fmtDate(getWeekDates(2)[0])+" — "+fmtDate(getWeekDates(2)[6]))
        ])
      ]));
      card.appendChild(e("div",{style:"display:flex;gap:6px;margin-bottom:14px;justify-content:center;align-items:center"},[
        btn("btn-sm btn-sm-gray","→",()=>{S.availTargetOffset=Math.max(S.availTargetOffset-1,-4);S.availDraft={};S._draftWeek=null;S._draftCleared=false;render();}),
        e("span",{style:"font-size:12px;color:#64748B;min-width:80px;text-align:center"},targetOffset<=0?"שבוע "+(targetOffset===0?"נוכחי":"קודם"):"שבוע הבא"+(targetOffset>1?" +"+targetOffset:"")),
        btn("btn-sm btn-sm-gray","←",()=>{S.availTargetOffset++;S.availDraft={};S._draftWeek=null;S._draftCleared=false;render();})
      ]));
      card.appendChild(e("div",{style:"font-size:12px;color:#64748B;margin-bottom:12px;text-align:center"},fmtDate(targetDates[0])+" — "+fmtDate(targetDates[6])));

      // Quota display
      const quotaCard2 = e("div",{style:"background:#1E293B;border:1px solid #334155;border-radius:10px;padding:12px;margin-bottom:14px"});
      quotaCard2.appendChild(e("div",{style:"font-weight:700;font-size:13px;color:#E2E8F0;margin-bottom:8px"},"🚫 מכסת חסימות"));
      quotaCard2.appendChild(e("div",{style:"display:grid;grid-template-columns:1fr 1fr;gap:8px"},[
        e("div",{style:"background:#0F172A;border-radius:8px;padding:8px"},[
          e("div",{style:"font-size:11px;color:#3B82F6;font-weight:700;margin-bottom:6px"},"ראשון — חמישי"),
          ...BLOCK_SHIFTS.map(sh=>{
            const lim = blockLimits.weekday?.[sh.id]??3;
            const used = getMgrBlockCount(sh.id, false);
            return e("div",{style:"display:flex;justify-content:space-between;font-size:11px;padding:2px 0"},[
              e("span",{style:"color:"+sh.color},sh.label),
              e("span",{style:"font-weight:700;color:"+(used>=lim?"#EF4444":"#94A3B8")},used+"/"+lim)
            ]);
          })
        ]),
        e("div",{style:"background:#0F172A;border-radius:8px;padding:8px"},[
          e("div",{style:"font-size:11px;color:#A855F7;font-weight:700;margin-bottom:6px"},"שישי — שבת"),
          ...SHIFTS.filter(sh=>sh.id!=="afternoon" && sh.id!=="morning2").map(sh=>{
            const lim = blockLimits.weekend?.[sh.id]??1;
            const used = getMgrBlockCount(sh.id, true);
            return e("div",{style:"display:flex;justify-content:space-between;font-size:11px;padding:2px 0"},[
              e("span",{style:"color:"+sh.color},sh.label),
              e("span",{style:"font-weight:700;color:"+(used>=lim?"#EF4444":"#94A3B8")},used+"/"+lim)
            ]);
          })
        ])
      ]));
      card.appendChild(quotaCard2);

      // Default buttons
      const defaultKey = "blockDefaults_" + emp.id;
      const savedDefaults = JSON.parse(localStorage.getItem(defaultKey) || "null");
      card.appendChild(e("div",{style:"display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap"},[
        savedDefaults ? btn("btn-sm btn-sm-blue","📥 טען ברירת מחדל",()=>{
          S.availDraft = {};
          savedDefaults.forEach(def => {
            targetDates.forEach((date, di) => {
              const dt = new Date(date+"T00:00:00");
              if (dt.getDay() === def.day) S.availDraft[di+"|"+def.shift] = true;
            });
          });
          toast("ברירת מחדל נטענה ✓"); render();
        }) : null,
        e("div",{style:"font-size:11px;color:#475569;display:flex;align-items:center"},
          savedDefaults ? "יש ברירת מחדל שמורה" : "אין ברירת מחדל")
      ]));

      card.appendChild(e("div",{style:"font-size:13px;color:#94A3B8;margin-bottom:12px"},"לחץ על משמרות שאתה לא יכול לעבוד:"));

      // Day cards
      targetDates.forEach((date, di) => {
        const dt = new Date(date+"T00:00:00");
        const dayName = DAYS[dt.getDay()];
        const isWeekend = dt.getDay() === 5 || dt.getDay() === 6;
        const dayCard = e("div",{style:"background:#0F172A;border:1px solid #334155;border-radius:12px;padding:12px;margin-bottom:10px"});
        dayCard.appendChild(e("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"},[
          e("div",{style:"font-weight:800;font-size:15px;color:#E2E8F0"},dayName),
          e("div",{style:"font-size:13px;color:#64748B"},dt.getDate()+"/"+(dt.getMonth()+1))
        ]));
        const shiftsRow = e("div",{style:"display:grid;grid-template-columns:"+(isWeekend?"1fr 1fr":"1fr 1fr 1fr")+";gap:6px"});
        (isWeekend ? WEEKEND_SHIFTS : BLOCK_SHIFTS).forEach(sh => {
          const key = di+"|"+sh.id;
          const picked = !!S.availDraft[key];
          const shiftLimit = isWeekend ? (blockLimits.weekend?.[sh.id]??1) : (blockLimits.weekday?.[sh.id]??3);
          const shiftUsed = getMgrBlockCount(sh.id, isWeekend);
          const atLimit = !picked && shiftUsed >= shiftLimit;

          shiftsRow.appendChild(e("button",{
            disabled: atLimit && !picked,
            style: picked ? "padding:14px 8px;border-radius:10px;background:#EF444433;border:2px solid #EF4444;color:#EF4444;font-weight:800;cursor:pointer;font-family:inherit" : atLimit ? "padding:14px 8px;border-radius:10px;background:#0F172A;border:1px solid #1E293B;color:#1E293B;cursor:not-allowed;font-family:inherit" : "padding:14px 8px;border-radius:10px;background:#1E293B;border:1px solid "+sh.color+"44;color:"+sh.color+";font-weight:700;cursor:pointer;font-family:inherit",
            onclick: () => { S.availDraft[key]=!S.availDraft[key]; render(); }

          S.availDraft={}; S._draftWeek=null; S._draftCleared=false;
          toast("חסימות נשלחו ✓"); render();

        btn("btn-sm btn-sm-gray","נקה",()=>{S.availDraft={};S._draftCleared=true;S._draftWeek=targetStart;render();})
      ],{style:"margin-top:12px"}));

      wrap.appendChild(card);

  // Team blocks tab

    }
    wrap.appendChild(empBox);
  });

  return wrap;
}

// QUALIFICATIONS VIEW — track employee qualifications per system/shift
// ══════════════════════════════════════════════════════
// Load all assignments from DB to compute qualifications based on full history
// Returns: { empId: { systems: {sysName: latestDate}, shifts: {shiftId: latestDate} } }
async function loadQualificationHistory() {
  if (!S.profile?.business_id) return {};
  const todayStr = today();
  
  // Get all schedules for this business
  const { data: scheds } = await sb.from("schedules")
    .select("id")
    .eq("business_id", S.profile.business_id);
  
  if (!scheds || scheds.length === 0) return {};
  const schedIds = scheds.map(s => s.id);
  
  // Get all assignments up to today (last 365 days for performance)
  const oneYearAgo = new Date();
  oneYearAgo.setDate(oneYearAgo.getDate() - 365);
  const cutoffStr = oneYearAgo.toISOString().slice(0,10);
  
  const { data: assigns } = await sb.from("assignments")
    .select("date, shift, employee_id, note")
    .in("schedule_id", schedIds)
    .gte("date", cutoffStr)
    .lte("date", todayStr);
  
  // Build empData: { empId: { systems: {}, shifts: {} } }
  const empData = {};
  schedulableEmployees().forEach(emp => {
    empData[emp.id] = { systems: {}, shifts: {} };
  });
  
  (assigns || []).forEach(a => {
    if (!empData[a.employee_id]) return;
    
    // Track shift assignments (latest date per shift)
    const existingShift = empData[a.employee_id].shifts[a.shift];
    if (!existingShift || a.date > existingShift) {
      empData[a.employee_id].shifts[a.shift] = a.date;
    }
    
    // Parse system tags from note: "🏷️ Sys1, Sys2 | text"
    if (a.note && a.note.startsWith("🏷️ ")) {
      const tagPart = a.note.split(" | ")[0].replace("🏷️ ","");
      const tags = tagPart.split(", ").map(t=>t.trim()).filter(Boolean);
      tags.forEach(tag => {
        const existing = empData[a.employee_id].systems[tag];
        if (!existing || a.date > existing) {
          empData[a.employee_id].systems[tag] = a.date;
        }
      });
    }
  });
  
  return empData;
}

function viewQualifications() {
  const wrap = e("div");
  wrap.appendChild(div("page-title",["🎯 כשירות עובדים"],{style:"margin-bottom:16px"}));
  
  const quals = S.qualifications || {systems:{},shifts:{}};
  const systems = S.systems || [];
  const trackedShifts = [
    {id:"morning",label:"בוקר",color:"#F59E0B"},
    {id:"morning2",label:"בוקר ב׳",color:"#F97316"}
  ];
  
  // Check if any qualifications are configured
  const hasSystemQuals = Object.keys(quals.systems||{}).length > 0;
  const hasShiftQuals = Object.keys(quals.shifts||{}).length > 0;
  
  if (!hasSystemQuals && !hasShiftQuals && systems.length === 0) {
    wrap.appendChild(div("card",[
      e("div",{style:"text-align:center;padding:40px"},[
        e("div",{style:"font-size:48px;margin-bottom:12px"},"🎯"),
        e("div",{style:"font-weight:800;font-size:18px;color:#94A3B8;margin-bottom:8px"},"לא מוגדרת כשירות"),
        e("div",{style:"font-size:13px;color:#64748B;margin-bottom:20px"},"קודם הוסף מערכות והגדר ימי כשירות בהגדרות"),
        btn("btn-add","עבור להגדרות →",()=>{S.view="settings";render();})
      ])
    ]));
    return wrap;
  }
  
  // Use cached historical data, or trigger load
  if (S.qualHistory === null) {
    // Show loading + trigger fetch
    loadQualificationHistory().then(data => {
      S.qualHistory = data;
      render();
    });
    wrap.appendChild(e("div",{style:"text-align:center;padding:40px;color:#64748B"},"⏳ טוען נתוני כשירות..."));
    return wrap;
  }
  const empData = S.qualHistory;
  
  const todayStr = today();
  const todayDate = new Date(todayStr+"T12:00:00");
  
  function daysSince(dateStr) {
    if (!dateStr) return Infinity;
    const d = new Date(dateStr+"T12:00:00");
    return Math.floor((todayDate - d) / (1000*60*60*24));
  }
  
  function getStatus(daysSinceLast, expiryDays) {
    if (daysSinceLast === Infinity) return {color:"#EF4444", icon:"❌", label:"מעולם לא"};
    if (daysSinceLast >= expiryDays) return {color:"#EF4444", icon:"❌", label:"פג!"};
    const remaining = expiryDays - daysSinceLast;
    if (remaining <= 3) return {color:"#F59E0B", icon:"⚠️", label:"עוד "+remaining+" ימים"};
    return {color:"#10B981", icon:"✅", label:"כשיר"};
  }
  
  // Summary banner
  let totalExpired = 0;
  let totalWarning = 0;
  S.employees.forEach(emp => {
    Object.entries(quals.systems||{}).forEach(([sys, days]) => {
      const last = empData[emp.id]?.systems[sys];
      const since = daysSince(last);
      if (since >= days) totalExpired++;
      else if (days - since <= 3) totalWarning++;
    });
    trackedShifts.forEach(sh => {
      if (!quals.shifts?.[sh.id]) return;
      const last = empData[emp.id]?.shifts[sh.id];
      const since = daysSince(last);
      if (since >= quals.shifts[sh.id]) totalExpired++;
      else if (quals.shifts[sh.id] - since <= 3) totalWarning++;
    });
  });
  
  wrap.appendChild(e("div",{style:"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px"},[
    e("div",{style:"background:#EF444418;border:1px solid #EF444444;border-radius:12px;padding:14px;text-align:center"},[
      e("div",{style:"font-size:24px;font-weight:900;color:#EF4444"},String(totalExpired)),
      e("div",{style:"font-size:11px;color:#FCA5A5;font-weight:700"},"❌ פג")
    ]),
    e("div",{style:"background:#F59E0B18;border:1px solid #F59E0B44;border-radius:12px;padding:14px;text-align:center"},[
      e("div",{style:"font-size:24px;font-weight:900;color:#F59E0B"},String(totalWarning)),
      e("div",{style:"font-size:11px;color:#FCD34D;font-weight:700"},"⚠️ עומד לפוג")
    ]),
    e("div",{style:"background:#10B98118;border:1px solid #10B98144;border-radius:12px;padding:14px;text-align:center"},[
      e("div",{style:"font-size:24px;font-weight:900;color:#10B981"},String(S.employees.length)),
      e("div",{style:"font-size:11px;color:#34D399;font-weight:700"},"👥 עובדים")
    ])
  ]));
  
  // Filter
  if (!S.qualFilter) S.qualFilter = "all";
  const filters = [
    {id:"all",label:"הכל"},
    {id:"expired",label:"❌ פג"},
    {id:"warning",label:"⚠️ עומד לפוג"},
    {id:"ok",label:"✅ כשירים"}
  ];
  // Refresh button
  wrap.appendChild(e("div",{style:"display:flex;justify-content:flex-end;margin-bottom:8px"},[
    btn("btn-sm btn-sm-blue","🔄 רענן נתונים",async()=>{
      S.qualHistory = null;
      render();
    },{title:"טען מחדש מהיסטוריית הסידורים"})
  ]));
  
  const filterRow = e("div",{style:"display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap"});
  filters.forEach(f => {
    const isActive = S.qualFilter === f.id;
    filterRow.appendChild(e("button",{
      style:"padding:8px 14px;border-radius:8px;border:1px solid "+(isActive?"#3B82F6":"#334155")+";background:"+(isActive?"#3B82F622":"#1E293B")+";color:"+(isActive?"#60A5FA":"#94A3B8")+";font-family:inherit;font-weight:700;font-size:12px;cursor:pointer",
      onclick:()=>{S.qualFilter=f.id;render();}
    },f.label));
  });
  wrap.appendChild(filterRow);
  
  // Employee cards
  schedulableEmployees().forEach((emp, idx) => {
    const col = ec(idx);
    const empQualSystems = Object.entries(quals.systems||{}).map(([sys, days]) => {
      const last = empData[emp.id]?.systems[sys];
      const since = daysSince(last);
      const status = getStatus(since, days);
      return {type:"system", name:sys, lastDate:last, since, expiryDays:days, status};
    });
    const empQualShifts = trackedShifts.filter(sh => quals.shifts?.[sh.id]).map(sh => {
      const last = empData[emp.id]?.shifts[sh.id];
      const since = daysSince(last);
      const status = getStatus(since, quals.shifts[sh.id]);
      return {type:"shift", name:sh.label, color:sh.color, lastDate:last, since, expiryDays:quals.shifts[sh.id], status};
    });
    
    const allQuals = [...empQualSystems, ...empQualShifts];
    
    // Apply filter
    let filtered = allQuals;
    if (S.qualFilter === "expired") filtered = allQuals.filter(q => q.status.icon === "❌");
    else if (S.qualFilter === "warning") filtered = allQuals.filter(q => q.status.icon === "⚠️");
    else if (S.qualFilter === "ok") filtered = allQuals.filter(q => q.status.icon === "✅");
    
    // Skip employee card if filter removes all
    if (S.qualFilter !== "all" && filtered.length === 0) return;
    
    const expiredCount = allQuals.filter(q => q.status.icon === "❌").length;
    const warnCount = allQuals.filter(q => q.status.icon === "⚠️").length;
    const cardBorder = expiredCount > 0 ? "#EF444444" : warnCount > 0 ? "#F59E0B44" : col+"44";
    
    const empCard = e("div",{style:"background:#1E293B;border:1px solid "+cardBorder+";border-radius:14px;padding:14px;margin-bottom:12px"});
    
    // Header
    empCard.appendChild(e("div",{style:"display:flex;align-items:center;gap:10px;margin-bottom:12px"},[
      e("div",{style:"width:36px;height:36px;border-radius:10px;background:"+col+"22;border:1px solid "+col+"44;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:"+col},
        emp.name.split(" ").map(n=>n[0]).join("").slice(0,2)),
      e("div",{style:"flex:1"},[
        e("div",{style:"font-weight:800;font-size:15px;color:#E2E8F0"},emp.name),
        e("div",{style:"font-size:11px;color:#64748B;margin-top:2px"},
          (expiredCount > 0 ? "❌ "+expiredCount+" פג · " : "") +
          (warnCount > 0 ? "⚠️ "+warnCount+" קרוב · " : "") +
          (allQuals.length - expiredCount - warnCount)+" כשירים")
      ])
    ]));
    
    if (filtered.length === 0) {
      empCard.appendChild(e("div",{style:"color:#64748B;font-size:12px;padding:8px;text-align:center"},"אין פריטים שמתאימים לסינון"));
    } else {
      const grid = e("div",{style:"display:flex;flex-wrap:wrap;gap:6px"});
      filtered.forEach(q => {
        grid.appendChild(e("div",{style:"background:#0F172A;border:1px solid "+q.status.color+"44;border-radius:10px;padding:8px 12px;min-width:140px"},[
          e("div",{style:"display:flex;align-items:center;gap:6px;margin-bottom:4px"},[
            e("span",{style:"font-size:13px"},q.status.icon),
            e("div",{style:"font-weight:700;font-size:12px;color:"+(q.color||q.status.color)},
              (q.type === "system" ? "🏷️ " : "🌅 ") + q.name)
          ]),
          e("div",{style:"font-size:10px;color:#64748B"},
            q.lastDate ? "אחרון: " + fmtDate(q.lastDate) + " ("+q.since+" ימים)" : "מעולם לא בוצע"),
          e("div",{style:"font-size:10px;color:"+q.status.color+";font-weight:700;margin-top:2px"},q.status.label)
        ]));
      });
      empCard.appendChild(grid);
    }
    
    wrap.appendChild(empCard);
  });
  
  return wrap;
}

// RENDER

let _touchStartX = null, _touchStartY = null;
function setupSwipeGestures() {
  document.removeEventListener("touchstart", _onTouchStart);
  document.removeEventListener("touchend", _onTouchEnd);
  document.addEventListener("touchstart", _onTouchStart, {passive:true});
  document.addEventListener("touchend", _onTouchEnd, {passive:true});
}
function _onTouchStart(e) {
  if (e.touches.length !== 1) return;
  _touchStartX = e.touches[0].clientX;
  _touchStartY = e.touches[0].clientY;
}
function _onTouchEnd(e) {
  if (_touchStartX == null) return;
  const dx = e.changedTouches[0].clientX - _touchStartX;
  const dy = e.changedTouches[0].clientY - _touchStartY;
  _touchStartX = null;
  // Must be a horizontal swipe (more X than Y, more than 80px)
  if (Math.abs(dx) < 80 || Math.abs(dy) > 50) return;
  // Don't trigger on inputs or buttons
  const t = e.target;
  if (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "BUTTON" || t.tagName === "SELECT") return;
  if (t.closest(".modal,.bottom-sheet,.emp-chip,.shift-cell")) return;
  
  // Only swipe in schedule views
  if (S.view === "schedule") {
    // If in mobile day mode, swipe between days
    if (S.schedMobileView === "day") {
      if (dx > 0) {
        // Next day
        if (S.schedDayIdx < 6) { S.schedDayIdx++; render(); }
        else { S.weekOffset++; S.schedDayIdx = 0; loadSchedule().then(()=>render()); }
      } else {
        // Prev day
        if (S.schedDayIdx > 0) { S.schedDayIdx--; render(); }
        else { S.weekOffset--; S.schedDayIdx = 6; loadSchedule().then(()=>render()); }
      }
    } else {
      // RTL: swipe right (positive dx) = next week, swipe left = prev week
      if (dx > 0) { S.weekOffset++; loadSchedule().then(()=>render()); }
      else { S.weekOffset--; loadSchedule().then(()=>render()); }
    }
  } else if (S.view === "calendar") {
    if (dx > 0) { S.monthOffset++; render(); }
    else { S.monthOffset--; render(); }
  } else if (S.view === "empview" && S.empViewTab === "schedule") {
    if (dx > 0) { S.weekOffset++; loadSchedule().then(()=>render()); }
    else { S.weekOffset--; loadSchedule().then(()=>render()); }
  }
}

function render() {
  const app = $("app");
  app.innerHTML = "";

  if (S.view==="loading") { app.appendChild(viewLoading()); return; }
  if (S.view==="login")   { app.appendChild(viewLogin()); }
  else {
    const appWrap = div("app");
    appWrap.appendChild(viewHeader());
    const main = div("main");

    if (S.view==="home")       main.appendChild(viewHome());
    else if(S.view==="schedule" && !isManager()) { S.empViewTab="schedule"; main.appendChild(viewEmpView()); } // employees get read-only view with export buttons
    else if(S.view==="schedule")  main.appendChild(viewSchedule());
    else if(S.view==="calendar")  main.appendChild(viewCalendar());
  else if(S.view==="employees" && isManager()) main.appendChild(viewEmployees());
    else if(S.view==="employees" && !isManager()) { S.view="empview"; main.appendChild(viewEmpView()); }
    else if(S.view==="manager_blocks" && isManager()) main.appendChild(viewManagerBlocks()); // <--- הוסף את השורה הזו כאן!
    else if(S.view==="vacations" && !isManager()) { S.empViewTab="vacation"; main.appendChild(viewEmpView()); }
    else if(S.view==="vacations") main.appendChild(viewVacations());
    else if(S.view==="swaps" && !isManager()) { S.empViewTab="swaps_emp"; main.appendChild(viewEmpView()); }
    else if(S.view==="swaps")     main.appendChild(viewSwaps());
    else if(S.view==="stats")     main.appendChild(viewStats());
    else if(S.view==="blocks")    { S.empViewTab="avail"; main.appendChild(viewEmpView()); }
    else if(S.view==="emp_settings") main.appendChild(viewEmpSettings());
    else if(S.view==="empview")   main.appendChild(viewEmpView());
    else if(S.view==="settings")  main.appendChild(viewSettings());
    else if(S.view==="qualifications" && isManager())  main.appendChild(viewQualifications());

    appWrap.appendChild(main);
    app.appendChild(appWrap);

    // Modals
    if(S.constraintsEmp) app.appendChild(viewConstraintsModal());
    if(S.showPublishModal) app.appendChild(viewPublishModal());
    if(S.showPreviewSelectModal) app.appendChild(viewPreviewSelectModal());
  if(S.showExportModal) app.appendChild(viewExportModal());
  if(S.chatThread) app.appendChild(viewShiftChatModal());
  }

  // Mobile bottom nav
  if (S.view !== "login" && S.view !== "loading") {
    const pendingVacs2 = S.vacations.filter(v=>v.status==="pending").length;
    const bottomNav = e("div",{class:"mobile-bottom-nav",style:"overflow-x:auto;-webkit-overflow-scrolling:touch"});
    const isEmpOnly = S.profile?.role === "employee";
    const bottomTabs = isEmpOnly ? [
      {id:"empview",icon:"📋",label:"שלי"},
      {id:"schedule",icon:"📅",label:"סידור"},
      {id:"blocks",icon:"🚫",label:"חסימות"},
      {id:"vacations",icon:"🌴",label:"העדרויות"},
      {id:"swaps_nav",icon:"🔄",label:"חילופים"},
      {id:"emp_settings",icon:"⚙️",label:"הגדרות"},
    ] : [
      {id:"home",icon:"🏠",label:"בית"},
      {id:"schedule",icon:"📅",label:"סידור"},
      {id:"employees",icon:"👥",label:"עובדים"},
      {id:"manager_blocks",icon:"🚫",label:"חסימות"},
      {id:"qualifications",icon:"🎯",label:"כשירות"},
      {id:"vacations",icon:"🌴",label:"העדרויות",badge:pendingVacs2},
      {id:"swaps",icon:"🔄",label:"חילופים"},
      {id:"settings",icon:"⚙️",label:"הגדרות"},
    ];
    bottomTabs.forEach(t => {
      const isActive = S.view===t.id;
      const btn2 = e("button",{
        style:`flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px 8px;border:none;border-top:2px solid ${isActive?"#3B82F6":"transparent"};background:transparent;color:${isActive?"#3B82F6":"#64748B"};font-family:inherit;cursor:pointer;position:relative;min-height:56px;transition:color 0.15s`,
        onclick:()=>{
          if(t.id==="swaps_nav"){S.view="empview";S.empViewTab="swaps_emp";S.selectedCell=null;render();}
          else if(t.id==="empview"){S.view="empview";S.empViewTab="shifts";S.selectedCell=null;render();}
          else{S.view=t.id;S.selectedCell=null;render();}
        }
      },[
        t.badge>0?e("span",{style:"position:absolute;top:6px;right:calc(50% - 16px);background:#EF4444;color:white;border-radius:50%;width:14px;height:14px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center"},String(t.badge)):null,
        e("span",{style:"font-size:22px;line-height:1"},t.icon),
        e("span",{style:`font-size:10px;font-weight:${isActive?"700":"500"};margin-top:1px`},t.label)
      ]);
      bottomNav.appendChild(btn2);
    });
    app.appendChild(bottomNav);
  }

  // Toast
  if(S.toast) {
    app.appendChild(e("div",{class:"toast"+(S.toast.type==="err"?" err":"")},S.toast.msg));
  }
}

// AUTO-REMINDER CHECK
async function checkAutoReminder() {
  if (!isManager()) return;
  const biz = S.business;
  if (!biz) return;
  const now = new Date();
  const currentTime = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  
  // ─── Auto-reminder for blocks submission ───
  if (biz.reminder_day == null) return;
  if (now.getDay() !== biz.reminder_day) return;
  if (currentTime < (biz.reminder_time||"09:00")) return;
  const sentKey = "reminder_sent_"+now.getDay()+"_"+getWeekDates(1)[0];
  if (localStorage.getItem(sentKey)) return;
  const nextWD = getWeekDates(1);
  const sub = S.availSubmissions.filter(s=>s.week_start===nextWD[0]).map(s=>s.employee_id);
  const notSub = S.employees.filter(emp=>!sub.includes(emp.id)&&emp.email&&emp.role!=="admin"&&emp.role!=="manager");
  if (notSub.length===0) return;
  for (const emp of notSub) {
    const adlDay = S.business?.deadline_day;
    const adlTime = S.business?.deadline_time || "20:00";
    const adlText = adlDay != null ? "יום " + DAYS[adlDay] + " בשעה " + adlTime : "";
    await sendEmail("reminder",emp.email,{weekLabel:fmtDate(nextWD[0])+" — "+fmtDate(nextWD[6]),deadline:adlText});
  }
  localStorage.setItem(sentKey,"1");
  console.log("🔔 Auto-reminder sent to "+notSub.length+" employees");
}

// SILENT REFRESH — reload data after actions + every 30 seconds
let _autoRefreshTimer = null;
let _refreshDebounce = null;

function isUserBusy() {
  if (S.selectedCell) return true;
  if (S.constraintsEmp) return true;
  if (S.showAddEmp) return true;
  if (S.showAddVac) return true;
  if (S.showPublishModal) return true;
  if (S.showPreviewSelectModal) return true;
  if (S.showExportModal) return true;
  if (S.showWeekNotes) return true;
  if (S.showSwapModal) return true;
  if (S.chatThread) return true;
  // Blocks form active (employee or manager)
  if (S.view === "blocks" || (S.view === "empview" && S.empViewTab === "avail")) return true;
  if (S.view === "manager_blocks" && S.mgrBlocksTab === "mine") return true;
  // Any draft blocks selected
  if (Object.values(S.availDraft||{}).some(Boolean)) return true;
  // Any input/textarea/select focused
  if (document.activeElement && (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA" || document.activeElement.tagName === "SELECT")) return true;
  return false;
}

function silentRefresh() {
  clearTimeout(_refreshDebounce);
  _refreshDebounce = setTimeout(async () => {
    if (!S.user || S.view === "login" || S.view === "loading") return;
    if (isUserBusy()) {
      console.log("🔄 Skipped refresh — user is busy");
      return;
    }
    try {
      await Promise.all([loadSchedule(), loadAvailSubmissions(), loadSwapRequests(), loadVacations(), loadEmployees(), loadJoinRequests()]);
      render();
    } catch(err) {
      console.warn("🔄 Refresh failed:", err);
    }
  }, 1500);
}

function startAutoRefresh() {
  if (_autoRefreshTimer) clearInterval(_autoRefreshTimer);
  _autoRefreshTimer = setInterval(() => {
    if (!isUserBusy()) silentRefresh();
  }, 30000);
}

// INIT
checkAuth();
