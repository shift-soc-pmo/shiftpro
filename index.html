// Cross-week schedule cache for conflict checks
const _crossWeekCache = {};  // { "YYYY-MM-DD": {shiftId: [empIds]} }

async function loadDateAssignments(dateStr) {
  if (_crossWeekCache[dateStr]) return _crossWeekCache[dateStr];
  if (S.schedule[dateStr]) {
    _crossWeekCache[dateStr] = S.schedule[dateStr];
    return S.schedule[dateStr];
  }
  // Load from DB
  try {
    // Find week_start for this date
    const dt = new Date(dateStr+"T12:00:00");
    const dow = dt.getDay();
    const weekStart = new Date(dt);
    weekStart.setDate(dt.getDate() - dow);
    const wsStr = weekStart.getFullYear()+"-"+String(weekStart.getMonth()+1).padStart(2,"0")+"-"+String(weekStart.getDate()).padStart(2,"0");
    const { data: sched } = await sb.from("schedules").select("id")
      .eq("business_id", S.profile.business_id).eq("week_start", wsStr).maybeSingle();
    const result = {};
    if (sched) {
      const { data: assigns } = await sb.from("assignments").select("*")
        .eq("schedule_id", sched.id).eq("date", dateStr);
      (assigns || []).forEach(a => {
        if (!result[a.shift]) result[a.shift] = [];
        result[a.shift].push(a.employee_id);
      });
    }
    _crossWeekCache[dateStr] = result;
    return result;
  } catch (err) {
    console.warn("Could not load cross-week:", err);
    return {};
  }
}

// Returns conflict reason, or null. Checks across weeks too.
async function checkShiftConflictAsync(date, shift, empId, ignoreDate = null, ignoreShift = null) {
  // First check in-memory (current week)
  const syncCheck = checkShiftConflict(date, shift, empId, ignoreDate, ignoreShift);
  if (syncCheck) return syncCheck;
  
  const emp = getEmp(empId);
  const name = emp?.name || "עובד";
  
  // Cross-week: morning/morning2 → check previous day if not in S.schedule
  if (shift === "morning" || shift === "morning2") {
    const yesterday = new Date(new Date(date+"T12:00:00").getTime() - 86400000);
    const yStr = yesterday.getFullYear()+"-"+String(yesterday.getMonth()+1).padStart(2,"0")+"-"+String(yesterday.getDate()).padStart(2,"0");
    // If yesterday is in current schedule, already checked. Otherwise load from DB.
    if (!S.schedule[yStr]) {
      const prevDay = await loadDateAssignments(yStr);
      if ((prevDay["night"]||[]).includes(empId)) {
        return name + " עבד לילה ב-" + fmtDate(yStr) + " — לא ניתן לשבץ לבוקר";
      }
    }
  }
  
  // Cross-week: night → check next day's morning
  if (shift === "night") {
    const tomorrow = new Date(new Date(date+"T12:00:00").getTime() + 86400000);
    const tStr = tomorrow.getFullYear()+"-"+String(tomorrow.getMonth()+1).padStart(2,"0")+"-"+String(tomorrow.getDate()).padStart(2,"0");
    if (!S.schedule[tStr]) {
      const nextDay = await loadDateAssignments(tStr);
      if ((nextDay["morning"]||[]).includes(empId) || (nextDay["morning2"]||[]).includes(empId)) {
        return name + " משובץ לבוקר ב-" + fmtDate(tStr) + " — לא ניתן לשבץ ללילה";
      }
    }
  }
  
  return null;
}

function checkShiftConflict(date, shift, empId, ignoreDate = null, ignoreShift = null) {
  const emp = getEmp(empId);
  const name = emp?.name || "עובד";

  // פונקציית עזר שבודקת אם עובד משובץ, תוך התעלמות ממשמרת ספציפית (למקרה של חילוף)
  const isAssigned = (d, s) => {
    if (d === ignoreDate && s === ignoreShift) return false;
    return (S.schedule[d]?.[s]||[]).includes(empId);
  };

  // 1. האם כבר משובץ למשמרת אחרת באותו יום?
  const todayShifts = SHIFTS.filter(sh =>
    sh.id !== shift && isAssigned(date, sh.id)
  );
  if (todayShifts.length > 0) return `${name} כבר משובץ ל${todayShifts[0].label} ביום זה`;

  // 2. עבד לילה אתמול - לא יכול בוקר (גם בוקר ב׳)
  if (shift === "morning" || shift === "morning2") {
    const yesterday = new Date(new Date(date+"T12:00:00").getTime() - 86400000);
    const yStr = yesterday.getFullYear()+"-"+String(yesterday.getMonth()+1).padStart(2,"0")+"-"+String(yesterday.getDate()).padStart(2,"0");
    if (isAssigned(yStr, "night")) return `${name} עבד לילה אתמול — לא ניתן לשבץ לבוקר`;
  }

  // 3. משמרת לילה - בדיקה שלא עובד בוקר מחר
  if (shift === "night") {
    const tomorrow = new Date(new Date(date+"T12:00:00").getTime() + 86400000);
    const tStr = tomorrow.getFullYear()+"-"+String(tomorrow.getMonth()+1).padStart(2,"0")+"-"+String(tomorrow.getDate()).padStart(2,"0");
    if (isAssigned(tStr, "morning")) return `${name} משובץ לבוקר מחר — לא ניתן לשבץ ללילה`;
  }

  return null; // הכל תקין, אין התנגשות
}

// Is this specific shift blocked by an approved absence (vacation/reserve/exam)?
// Handles PARTIAL days: on the first/last day of a vacation, only specific shifts may be blocked.
// Returns the blocking vacation object if blocked, or null if the employee is free for this shift.
// Human-readable description of partial-day shifts for a vacation (for display)
function describePartialVac(v) {
  const shiftLabel = (id) => (SHIFTS.find(s=>s.id===id)?.label || id);
  const parts = [];
  if (Array.isArray(v.start_day_shifts) && v.start_day_shifts.length > 0) {
    parts.push("יום ראשון: חסום רק " + v.start_day_shifts.map(shiftLabel).join(", "));
  }
  if (Array.isArray(v.end_day_shifts) && v.end_day_shifts.length > 0) {
    parts.push("יום אחרון: חסום רק " + v.end_day_shifts.map(shiftLabel).join(", "));
  }
  return parts.length > 0 ? parts.join(" · ") : "";
}

function getBlockingVacation(empId, date, shiftId) {
  const vacs = (S.vacations || []).filter(v =>
    v.employee_id === empId && v.status === "approved" &&
    date >= v.start_date && date <= v.end_date
  );
  for (const v of vacs) {
    const isFirstDay = (date === v.start_date);
    const isLastDay = (date === v.end_date);
    // Single-day vacation: both boundary rules could apply — block if EITHER blocks it
    if (isFirstDay && v.start_day_shifts != null) {
      // Only the listed shifts are blocked on the first day
      if (Array.isArray(v.start_day_shifts) && v.start_day_shifts.includes(shiftId)) return v;
      // If it's also the last day with its own rule, check that too
      if (isLastDay && v.end_day_shifts != null) {
        if (Array.isArray(v.end_day_shifts) && v.end_day_shifts.includes(shiftId)) return v;
      }
      continue; // first-day partial rule applied, this shift not in it -> not blocked by this vac
    }
    if (isLastDay && v.end_day_shifts != null) {
      if (Array.isArray(v.end_day_shifts) && v.end_day_shifts.includes(shiftId)) return v;
      continue;
    }
    // No partial rule for this boundary -> whole day blocked
    return v;
  }
  return null;
}

async function toggleCellEmp(date, shift, empId) {
  const weekStart = getWeekDates(S.weekOffset)[0];
  if (S.publishedWeeks.has(weekStart) && !confirm("השבוע פורסם. לשנות בכל זאת?")) return;
  if (!S.schedule[date]) S.schedule[date] = {};
  if (!S.schedule[date][shift]) S.schedule[date][shift] = [];
  const arr = S.schedule[date][shift];
  const idx = arr.indexOf(empId);
  
  // Snapshot for undo
  const empName = getEmp(empId)?.name?.split(" ")[0] || "עובד";
  const action = idx >= 0 ? "הסרת " + empName : "שיבוץ " + empName;
  pushScheduleHistory(action);

  if (idx >= 0) {
    // Removing — remove ALL occurrences
    S.schedule[date][shift] = arr.filter(id => id !== empId);
  } else {
    // Adding — check if employee is in ANOTHER shift the same day (this is a MOVE)
    const otherShiftSameDay = SHIFTS.find(sh =>
      sh.id !== shift && (S.schedule[date]?.[sh.id] || []).includes(empId)
    );
    
    if (otherShiftSameDay) {
      // Offer to move from the other shift
      const empName = getEmp(empId)?.name || "העובד";
      if (!confirm(empName + " משובץ ל" + otherShiftSameDay.label + " ביום זה.\n\nלהעביר אותו ל" + (SHIFT_BY_ID[shift]?.label || shift) + "?")) {
        return;
      }
      // Remove from the other shift
      S.schedule[date][otherShiftSameDay.id] = (S.schedule[date][otherShiftSameDay.id] || []).filter(id => id !== empId);
      
      // Also move custom hours and notes
      const oldKey = date+"|"+otherShiftSameDay.id+"|"+empId;
      const newKey = date+"|"+shift+"|"+empId;
      if (S.customHours[oldKey]) {
        S.customHours[newKey] = S.customHours[oldKey];
        delete S.customHours[oldKey];
      }
      if (S.assignmentNotes[oldKey]) {
        S.assignmentNotes[newKey] = S.assignmentNotes[oldKey];
        delete S.assignmentNotes[oldKey];
      }
      // Add to new shift and save
      if (!arr.includes(empId)) arr.push(empId);
      saveScheduleToDB();
      render();
      toast("הועבר ל" + (SHIFT_BY_ID[shift]?.label || shift) + " ✓");
      return;
    }
    
    // Adding — check constraints (sync, current week)
    const conflict = checkShiftConflict(date, shift, empId);
    if (conflict) { toast(conflict,"err"); return; }
    
    // Cross-week check (async, looks at prev/next week)
    const crossConflict = await checkShiftConflictAsync(date, shift, empId);
    if (crossConflict) {
      if (!confirm("⚠️ אזהרה: " + crossConflict + "\n\nלשבץ בכל זאת?")) return;
    }
    // Snapshot for rollback
    const beforeAdd = [...arr];

    // Check if employee blocked this shift
    const blockShiftId = (shift === "morning2") ? "morning" : shift;
    const dateLocal = date;
    const empBlocked = S.availSubmissions.some(s =>
      s.employee_id === empId &&
      (s.slots||[]).some(sl => {
        if (sl.date && sl.date === dateLocal) return sl.shift === blockShiftId || sl.shift === shift;
        return false;
      })
    );
    if (empBlocked) {
      if (!confirm("⚠️ " + (getEmp(empId)?.name||"העובד") + " חסם את המשמרת הזו!\nלשבץ בכל זאת?")) return;
    }

    if (!arr.includes(empId)) arr.push(empId);
  }
  saveScheduleToDB();
  render();
}

function toggleLock(date, shift, empId) {

  if (!S.lockedSlots[key]) S.lockedSlots[key] = new Set();
  if (S.lockedSlots[key].has(empId)) S.lockedSlots[key].delete(empId);

// Build the full week schedule data (all employees, all shifts) — used for manager preview
// AND for the "full schedule view" email sent to everyone on real publish.
function buildFullScheduleData(wd) {
  return wd.map(date => {
    const dt = new Date(date+"T00:00:00");
    const dayShifts = getShiftsForDate(date);
    return {
      day: DAYS[dt.getDay()] + " " + dt.getDate() + "/" + (dt.getMonth()+1),
      date: date,
      holiday: (typeof getHoliday === "function") ? getHoliday(date) : null,
      shifts: dayShifts.map(sh => {
        const empIds = S.schedule[date]?.[sh.id] || [];
        return {
          label: sh.label,
          hours: sh.start + "–" + sh.end,
          color: sh.color,
          employees: empIds.map(empId => {
            const emp = getEmp(empId);
            if (!emp) return null;
            const chKey = date+"|"+sh.id+"|"+empId;
            const ch = S.customHours[chKey];
            const note = S.assignmentNotes[chKey] || "";
            let tags = [];
            let freeText = "";
            if (note.startsWith("🏷️ ")) {
              const parts = note.split(" | ");
              tags = parts[0].replace("🏷️ ","").split(", ").map(t=>t.trim()).filter(Boolean);
              freeText = parts.slice(1).join(" | ");
            } else {
              freeText = note;
            }
            return {
              name: emp.name,
              customHours: ch ? (ch.start + "-" + ch.end) : null,
              tags: tags,
              note: freeText
            };
          }).filter(Boolean)
        };
      })
    };
  });
}

async function publishWeek(type) {
  const wd = getWeekDates(S.weekOffset);
  const weekStart = wd[0];
  const weekLabel = fmtDate(wd[0]) + " — " + fmtDate(wd[6]);
  const isFinal = type === "final";
  const isPreview = type === "preview";

  // Preview: show manager selection modal first, then send to selected only
  if (isPreview) {
    const managers = S.employees.filter(e => 
      (e.role === "admin" || e.role === "manager") && e.email
    );
    
    if (managers.length === 0) {
      toast("אין מנהלים נוספים לשליחה","err");
      S.showPublishModal = false;
      render();
      return;
    }
    
    // Show manager-selection modal unless the user has already confirmed their selection
    if (!S.previewConfirmed) {
      S.showPublishModal = false;
      if (!S.previewSelectedMgrs) {
        // Default: all managers selected
        S.previewSelectedMgrs = new Set(managers.map(m => m.id));
      }
      S.showPreviewSelectModal = true;
      render();
      return;
    }
    // User confirmed selection via the modal — proceed
    S.previewConfirmed = false;
    
    // Filter to only selected managers
    const selectedManagers = managers.filter(m => S.previewSelectedMgrs.has(m.id));
    if (selectedManagers.length === 0) {
      toast("לא נבחרו מנהלים לשליחה","err");
      return;
    }
    
    // Build the FULL schedule for the week — all employees, all shifts
    const fullSchedule = buildFullScheduleData(wd);
    
    // Send the SAME full schedule to selected managers
    for (const mgr of selectedManagers) {
      sendEmail("schedule_preview_full", mgr.email, { 
        empName: mgr.name, 
        weekLabel: "[בדיקה] — " + weekLabel, 
        fullSchedule: fullSchedule,
        businessName: S.business?.name || ""
      });
    }
    
    S.showPublishModal = false;
    S.showPreviewSelectModal = false;
    S.previewSelectedMgrs = null;  // Reset for next time
    toast(`📝 סידור לבדיקה נשלח ל-${selectedManagers.length} מנהלים`);
    render();
    if (typeof logAction === "function") {
      logAction("schedule_preview_sent", { week_start: weekStart, recipients: managers.length });
    }
    return;
  }

  // Use upsert so this works whether the schedules row already exists or not,
  // and ALWAYS verify the write actually succeeded before telling the manager it worked.
  // Note: created_by intentionally omitted from the upsert payload so that publishing
  // an already-existing week never overwrites the original creator's attribution.
  const { data: upserted, error: publishError } = await sb.from("schedules")
    .upsert(
      { business_id: S.profile.business_id, week_start: weekStart, published: true, publish_type: type },
      { onConflict: "business_id,week_start" }
    )
    .select("id, published, publish_type")
    .maybeSingle();

  if (publishError || !upserted || upserted.published !== true) {
    toast("❌ הפרסום נכשל: " + (publishError?.message || "לא ניתן לאמת שהשבוע פורסם"), "err");
    console.error("Publish failed", publishError, upserted);
    S.showPublishModal = false;
    render();
    return; // Do not proceed to update local flags or send emails on failure
  }

  if (isFinal) {
    S.publishedWeeks.add(weekStart);
  }
  S.publishedInitial = S.publishedInitial || new Set();
  if (!isFinal) S.publishedInitial.add(weekStart);

  const savedType = upserted.publish_type || type;
  if (typeof logAction === "function") {
    await logAction(savedType === "final" ? "schedule_published_final" : "schedule_published_initial", { week_start: weekStart, publish_type: savedType });
  }

  S.showPublishModal = false;
  toast(isFinal ? "סידור סופי פורסם 📢" : "סידור ראשוני פורסם 📋");
  render();
  silentRefresh();

  // Send email to each employee
  for (const emp of S.employees) {
    if (!emp.email || emp.id === S.user.id) continue;
    const myShifts = [];
    wd.forEach(date => {
      SHIFTS.forEach(sh => {
        if ((S.schedule[date]?.[sh.id]||[]).includes(emp.id)) {
          const dt = new Date(date+"T00:00:00");
          // Use custom hours if defined for this employee
          const chKey = date+"|"+sh.id+"|"+emp.id;
          const ch = S.customHours[chKey];
          const startTime = ch?.start || sh.start;
          const endTime = ch?.end || sh.end;
          // Get note with system tags
          const noteKey = date+"|"+sh.id+"|"+emp.id;
          const note = S.assignmentNotes[noteKey] || "";
          // Parse note for tags vs free text
          let tags = [];
          let freeText = "";
          if (note.startsWith("🏷️ ")) {
            const parts = note.split(" | ");
            tags = parts[0].replace("🏷️ ","").split(", ").map(t=>t.trim()).filter(Boolean);
            freeText = parts.slice(1).join(" | ");
          } else {
            freeText = note;
          }
          myShifts.push({
            day: DAYS[dt.getDay()]+" "+dt.getDate(),
            label: sh.label,
            hours: startTime+"–"+endTime,
            color: sh.color,
            tags: tags,
            note: freeText
          });
        }
      });
    });
    sendEmail(
      isFinal ? "schedule_published" : "schedule_initial",
      emp.email,
      { empName: emp.name, weekLabel, shifts: myShifts, isFinal }
    );
    sendPush(isFinal ? "schedule_published" : "schedule_initial", emp.id, { weekLabel });
  }

  // Second email: full schedule view — publisher also receives it
  const fullScheduleForPublish = buildFullScheduleData(wd);
  for (const emp of S.employees) {
    if (!emp.email) continue;
    sendEmail(
      "schedule_full_view",
      emp.email,
      { 
        empName: emp.name, 
        weekLabel, 
        fullSchedule: fullScheduleForPublish, 
        isFinal, 
        businessName: S.business?.name || "" 
      }
    );
  }
}

async function createInvitation() {
  const { name, email, role } = S.newInvitation;
  
  // Validation
  if (!email.trim()) { toast("חובה להזין מייל","err"); return; }
  if (!isValidEmail(email.trim())) { toast("מייל לא תקין","err"); return; }
  
  const normalizedEmail = email.trim().toLowerCase();
  
  // Check if user with this email already exists in this business
  const existingEmp = S.employees.find(e => (e.email||"").toLowerCase() === normalizedEmail);
  if (existingEmp) { toast("עובד עם המייל הזה כבר קיים","err"); return; }
  
  // Check if there's an active invitation
  const existingInv = S.invitations.find(i => 
    i.email.toLowerCase() === normalizedEmail && i.status === "pending"
  );
  if (existingInv) {
    if (!confirm("יש כבר הזמנה פתוחה למייל הזה. ליצור חדשה (הישנה תבוטל)?")) return;
    await sb.from("invitations").update({ status: "revoked" }).eq("id", existingInv.id);
  }
  
  // Generate secure token
  const token = generateSecureToken();
  const expiresAt = new Date();
  expiresAt.setHours(expiresAt.getHours() + 48);  // 48 hour expiry
  
  // Create invitation
  const { data: inv, error } = await sb.from("invitations").insert({
    business_id: S.profile.business_id,
    email: normalizedEmail,
    name: name.trim() || null,
    role: role || "employee",
    token: token,
    invited_by: S.user.id,
    invited_by_name: S.profile.name,
    expires_at: expiresAt.toISOString()
  }).select().single();
  
  if (error) { toast("שגיאה: " + error.message, "err"); return; }
  
  // Send invitation email
  const inviteUrl = window.location.origin + "/?invite=" + token;
  await sendEmail("invitation", normalizedEmail, {
    inviteeName: name.trim() || "עובד חדש",
    inviterName: S.profile.name,
    businessName: S.business?.name || "החברה",
    role: role === "admin" || role === "manager" ? "מנהל" : "עובד",
    inviteUrl: inviteUrl,
    expiresAt: expiresAt.toLocaleDateString("he-IL") + " " + expiresAt.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})
  });
  
  if (typeof logAction === "function") {
    logAction("invitation_sent", { invitee_email: normalizedEmail, role: role });
  }
  
  S.showInviteModal = false;
  S.newInvitation = { name: "", email: "", role: "employee" };
  await loadInvitations();
  toast("✓ הזמנה נשלחה ל-" + normalizedEmail);
  render();
}

async function updateVacStatus(id, status, rejectReason) {
  const vacBefore = S.vacations.find(v=>v.id===id);
  const updateData = {status, approved_by: S.user.id};
  if (rejectReason) updateData.reject_reason = rejectReason;
  const { data: vacUpd, error: vacErr } = await sb.from("vacations").update(updateData).eq("id",id).select("id,status").maybeSingle();
  if (vacErr || !vacUpd || vacUpd.status !== status) {
    toast("❌ הפעולה נכשלה: " + (vacErr?.message || "לא ניתן לאמת את העדכון"), "err");
    return;
  }
  if (typeof logAction === "function") {
    logAction(status === "approved" ? "vacation_approved" : "vacation_rejected", {
      vacation_id: id,
      employee_id: vacBefore?.employee_id,
      type: vacBefore?.type,
      dates: (vacBefore?.start_date||"") + " — " + (vacBefore?.end_date||""),
      reject_reason: rejectReason || null
    });
  }
  await loadVacations();
  toast(status==="approved"?"חופשה אושרה ✓":"חופשה נדחתה"); render();
  silentRefresh();

  const vac = S.vacations.find(v=>v.id===id);
  if (vac) {
    const emp = getEmp(vac.employee_id);
    if (emp?.email) {
      sendEmail(
        status==="approved" ? "vacation_approved" : "vacation_rejected",
        emp.email,
        { empName: emp.name, startDate: vac.start_date, endDate: vac.end_date, reason: vac.reason||"", rejectReason: rejectReason||"" }
      );
    }
    if (emp?.id) {
      sendPush(
        status==="approved" ? "vacation_approved" : "vacation_rejected",
        emp.id,
        { startDate: vac.start_date, endDate: vac.end_date, rejectReason: rejectReason||"" }
      );
    }
  }
}

// ══════════════════════════════════════════════════════
// AVAILABILITY SUBMISSION
// ══════════════════════════════════════════════════════
// Employee requests to join an unfilled shift -> creates a pending request for the manager.
// Check whether joining `shiftId` on `date` would violate rest rules for this employee.
// Returns an error string if blocked, or null if OK.
function checkJoinRestConflict(empId, date, shiftId) {
  const name = getEmp(empId)?.name || "אתה";
  const worksShift = (d, s) => (S.schedule[d]?.[s] || []).includes(empId);

  // Same-day combinations that are NOT allowed (insufficient rest within the day):
  const sameDayAssigned = SHIFTS.filter(sh => sh.id !== shiftId && worksShift(date, sh.id)).map(sh => sh.id);

  for (const existing of sameDayAssigned) {
    // night + morning (either order) — no rest
    if ((existing === "night" && (shiftId === "morning" || shiftId === "morning2")) ||
        ((existing === "morning" || existing === "morning2") && shiftId === "night")) {
      return name + " כבר עובד באותו יום במשמרת מתנגשת (לילה/בוקר) — אין מנוחה מספקת";
    }
    // morning + afternoon/evening
    if (((existing === "morning" || existing === "morning2") && shiftId === "afternoon") ||
        (existing === "afternoon" && (shiftId === "morning" || shiftId === "morning2"))) {
      return name + " כבר עובד בוקר באותו יום — לא ניתן להוסיף משמרת ערב";
    }
    // afternoon/evening + night
    if ((existing === "afternoon" && shiftId === "night") ||
        (existing === "night" && shiftId === "afternoon")) {
      return name + " כבר עובד ערב באותו יום — לא ניתן להוסיף לילה";
    }
    // any other same-day double shift
    return name + " כבר משובץ למשמרת אחרת באותו יום";
  }

  // Cross-day rest rules (reuse the existing logic):
  if (typeof checkShiftConflict === "function") {
    const crossErr = checkShiftConflict(date, shiftId, empId);
    if (crossErr) return crossErr;
  }

  return null;
}

async function requestJoinShift(empId, date, shiftId, shiftLabel) {
  const emp = getEmp(empId) || getActiveProfile();
  const dt = new Date(date+"T00:00:00");
  const dateLabel = DAYS[dt.getDay()] + " " + dt.getDate() + "/" + (dt.getMonth()+1);

  // Rest-rule pre-check — block requests that would violate rest before they reach the manager
  const restErr = checkJoinRestConflict(empId, date, shiftId);
  if (restErr) {
    alert("⛔ לא ניתן להצטרף למשמרת זו:\n\n" + restErr);
    return;
  }

  if (!confirm("לשלוח בקשה להצטרף למשמרת " + shiftLabel + " ב" + dateLabel + "?\n\nהבקשה תישלח למנהל לאישור.")) return;

  const note = prompt("הערה למנהל (אופציונלי):", "") || "";

  const { data: inserted, error } = await sb.from("shift_join_requests").upsert({
    business_id: S.profile.business_id,
    employee_id: empId,
    date: date,
    shift: shiftId,
    status: "pending",
    note: note.trim() || null
  }, { onConflict: "business_id,employee_id,date,shift" }).select("id").maybeSingle();

  if (error || !inserted) {
    toast("❌ שליחת הבקשה נכשלה: " + (error?.message || "שגיאה"), "err");
    return;
  }

  if (typeof logAction === "function") {
    logAction("join_request_created", { date, shift: shiftId, employee_id: empId });
  }

  // Notify managers by email
  const managers = S.employees.filter(m => (m.role==="admin"||m.role==="manager") && m.email);
  for (const mgr of managers) {
    sendEmail("swap_request", mgr.email, {
      requesterName: emp?.name || "עובד",
      targetDate: dateLabel,
      shiftLabel: shiftLabel,
      note: note.trim(),
      title: "➕ בקשת הצטרפות למשמרת"
    });
  }

  await loadJoinRequests();
  toast("✓ הבקשה נשלחה למנהל לאישור");
  render();
}

// Manager approves/rejects a join request
async function processJoinRequest(req, isApproved) {
  // Safety net: re-check rest rules at approval time (schedule may have changed since the request)
  if (isApproved && typeof checkJoinRestConflict === "function") {
    const restErr = checkJoinRestConflict(req.employee_id, req.date, req.shift);
    if (restErr) {
      if (!confirm("⚠️ אזהרה: " + restErr + "\n\nלאשר בכל זאת?")) return;
    }
  }

  let rejectReason = "";
  if (!isApproved) {
    rejectReason = prompt("סיבת הדחייה (אופציונלי):", "") || "";
  }

  const upd = {
    status: isApproved ? "approved" : "rejected",
    decided_at: new Date().toISOString(),
    decided_by: S.user.id,
    reject_reason: isApproved ? null : (rejectReason.trim() || null)
  };

  const { data: updated, error } = await sb.from("shift_join_requests")
    .update(upd).eq("id", req.id).select("id,status").maybeSingle();

  if (error || !updated || updated.status !== upd.status) {
    toast("❌ הפעולה נכשלה: " + (error?.message || "לא ניתן לאמת"), "err");
    return;
  }

  // If approved -> actually add the employee to the shift in the schedule
  if (isApproved) {
    const sched = await _ensureScheduleRow(req.date);
    if (sched) {
      await sb.from("assignments").upsert({
        schedule_id: sched.id,
        employee_id: req.employee_id,
        date: req.date,
        shift: req.shift
      }, { onConflict: "schedule_id,employee_id,date,shift" });
    }
  }

  if (typeof logAction === "function") {
    logAction(isApproved ? "join_request_approved" : "join_request_rejected",
      { request_id: req.id, employee_id: req.employee_id, date: req.date, shift: req.shift });
  }

  // Notify the employee
  const emp = getEmp(req.employee_id);
  if (emp?.email) {
    const dt = new Date(req.date+"T00:00:00");
    const dateLabel = DAYS[dt.getDay()] + " " + dt.getDate() + "/" + (dt.getMonth()+1);
    sendEmail("swap_decision", emp.email, {
      empName: emp.name,
      isApproved: isApproved,
      statusText: isApproved ? "אושרה" : "נדחתה",
      targetDate: dateLabel,
      shiftLabel: SHIFT_BY_ID[req.shift]?.label || req.shift
    });
    sendPush("swap_decision", emp.id, {
      isApproved: isApproved,
      statusText: isApproved ? "אושרה" : "נדחתה",
      targetDate: dateLabel,
      shiftLabel: SHIFT_BY_ID[req.shift]?.label || req.shift
    });
  }

  await Promise.all([loadJoinRequests(), loadSchedule()]);
  toast(isApproved ? "✓ הבקשה אושרה והעובד שובץ" : "הבקשה נדחתה");
  render();
}

// Ensure a schedule row exists for the week containing `date`, return it
async function _ensureScheduleRow(date) {
  // Find the Sunday of the week containing date
  const dt = new Date(date+"T00:00:00");
  const sunday = new Date(dt);
  sunday.setDate(dt.getDate() - dt.getDay());
  const weekStart = sunday.getFullYear()+"-"+String(sunday.getMonth()+1).padStart(2,"0")+"-"+String(sunday.getDate()).padStart(2,"0");
  const { data: existing } = await sb.from("schedules")
    .select("id").eq("business_id", S.profile.business_id).eq("week_start", weekStart).maybeSingle();
  if (existing) return existing;
  const { data: created } = await sb.from("schedules")
    .insert({ business_id: S.profile.business_id, week_start: weekStart, published: false })
    .select("id").maybeSingle();
  return created;
}

async function submitAvailability(empId, weekStart, slots, note) {

    week_start: weekStart, slots, note: note||null
  }, {onConflict:"employee_id,week_start"});

  silentRefresh();
}

          ]);
          const infoCol = row.lastChild;
          infoCol.appendChild(e("div",{style:"font-weight:700;font-size:13px;color:#E2E8F0;margin-bottom:4px"},emp.name));
          
          // Show the actual blocked shifts (slots), if any
          const slots = (sub.slots||[]).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
          if (slots.length > 0) {
            const slotsGrid = e("div",{style:"display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px"});
            slots.forEach(sl => {
              const sh = SHIFT_BY_ID[sl.shift];
              const dt = sl.date ? new Date(sl.date+"T00:00:00") : null;
              const dayLabel = dt ? (DAYS[dt.getDay()]+" "+dt.getDate()+"/"+(dt.getMonth()+1)) : ("יום "+(DAYS[sl.day]||sl.day));
              slotsGrid.appendChild(e("div",{style:"background:#0F172A;border:1px solid "+(sh?.color||"#64748B")+"44;border-radius:6px;padding:3px 8px;font-size:10px"},[
                e("span",{style:"font-weight:700;color:"+(sh?.color||"#94A3B8")},dayLabel+" · "+(sh?.label||sl.shift))
              ]));
            });
            infoCol.appendChild(slotsGrid);
          }
          
          if ((sub.note||"").trim()) {
            infoCol.appendChild(e("div",{style:"font-size:12px;color:#FCD34D;font-style:italic"},"💬 "+sub.note));
          }
          
          notesCard.appendChild(row);
        });
        wrap.appendChild(notesCard);
      }
    }
  }

  // Mobile view toggle (week / day)
  const isDayMode = S.schedMobileView === "day";
  const mobileToggle = e("div",{class:"sched-mobile-toggle"},[
    e("button",{
      class: !isDayMode ? "active" : "",
      onclick: () => { S.schedMobileView = "week"; render(); }
    },"📅 שבוע"),
    e("button",{
      class: isDayMode ? "active" : "",
      onclick: () => { 
        S.schedMobileView = "day"; 
        if (S.schedDayIdx == null) {
          // Default: today if in this week, else first day
          const todayIdx = wd.findIndex(d => d === today());
          S.schedDayIdx = todayIdx >= 0 ? todayIdx : 0;
        }
        render(); 
      }
    },"📆 יום")
  ]);
  wrap.appendChild(mobileToggle);
  
  // Mobile day view (only shown when toggle is on day, hidden on desktop via CSS)
  if (isDayMode) {
    wrap.appendChild(viewScheduleDayMobile(wd));
    return wrap;
  }

  // Grid
  const gridCard = div("card",[],{style:"padding:8px;overflow:hidden;max-width:100%"});
  const gridWrap = div("sched-wrap");
  // Scroll hint on mobile
  gridWrap.appendChild(e("div",{style:"font-size:10px;color:#475569;text-align:center;margin-bottom:4px;display:none",class:"scroll-hint"},"← גלול לצדדים לראות את כל הימים →"));
  const tbl = e("table",{class:"sched-table"});
  const thead = e("thead");
  const hrow = e("tr",[e("th",{style:"width:90px"},"משמרת")]);
  wdDisplay.forEach(date => {
    const dt = new Date(date+"T00:00:00");
    const isToday = date === today();
    hrow.appendChild(e("th",{class:"day-header",style:isToday?"color:#60A5FA":""},[
      e("div",{style:"font-size:11px"},DAYS[dt.getDay()]),
      e("div",{style:"font-size:18px;font-weight:900;color:"+(isToday?"#60A5FA":"#E2E8F0")},String(dt.getDate())),
      getHoliday(date) ? e("div",{style:"font-size:8px;color:#FCD34D;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px"},"✡️ "+getHoliday(date)) : null
    ]));
  });
  thead.appendChild(hrow);
  tbl.appendChild(thead);

  const tbody = e("tbody");

  // ── שורת העדרויות ──
  if (isManager()) {
    const absRow = e("tr");
    absRow.appendChild(e("td",{style:"border-right:2px solid #F59E0B44;padding-right:12px"},[
      e("div",{style:"font-weight:700;font-size:12px;color:#F59E0B"},"🌴 העדרויות"),
      e("div",{style:"font-size:9px;color:#475569"},"חופשה / מילואים")
    ]));
    wdDisplay.forEach(date => {
      const td = e("td",{style:"vertical-align:top;padding:4px 2px"});
      const dayAbs = S.vacations.filter(v =>
        v.status === "approved" && v.type !== "exam" &&
        date >= v.start_date && date <= v.end_date
      );
      const dayExams = S.vacations.filter(v =>
        v.type === "exam" && v.status === "approved" &&
        date >= v.start_date && date <= v.end_date
      );
      const dayBlocks = (S.availSubmissions||[]).filter(b => b.date === date);

      if (dayAbs.length === 0 && dayExams.length === 0 && dayBlocks.length === 0) {
        td.appendChild(e("div",{style:"font-size:10px;color:#334155;text-align:center;padding:4px"},"—"));
      } else {
        dayAbs.forEach(v => {
          const emp = getEmp(v.employee_id);
          if (!emp) return;
          const icon = v.type === "reserve" ? "🎖️" : "🌴";
          td.appendChild(e("div",{style:"font-size:10px;font-weight:700;color:#F59E0B;white-space:nowrap;margin-bottom:1px"},icon+" "+emp.name.split(" ")[0]));
        });
        dayExams.forEach(v => {
          const emp = getEmp(v.employee_id);
          if (!emp) return;
          td.appendChild(e("div",{style:"font-size:10px;font-weight:700;color:#10B981;white-space:nowrap;margin-bottom:1px"},"📝 "+emp.name.split(" ")[0]));
        });
        dayBlocks.forEach(b => {
          const emp = getEmp(b.employee_id);
          const sh = SHIFT_BY_ID[b.shift];
          if (!emp) return;
          td.appendChild(e("div",{style:"font-size:9px;color:#EF4444;white-space:nowrap;margin-bottom:1px"},"🚫 "+emp.name.split(" ")[0]+(sh?" "+sh.label:"")));
        });
      }
      absRow.appendChild(td);
    });
    tbody.appendChild(absRow);
  }

  SHIFTS.forEach(shift => {
    const row = e("tr");
    row.appendChild(e("td",{style:"border-right:2px solid "+shift.color+"44;padding-right:12px"},[
      e("div",{style:"font-weight:700;font-size:13px;color:"+shift.color},shift.label),
      e("div",{style:"font-size:10px;color:#475569"},shift.start+"–"+shift.end)
    ]));
    wdDisplay.forEach(date => {
      const dayNum = new Date(date+"T00:00:00").getDay();
      const isWeekendDay = dayNum === 5 || dayNum === 6;
      // On Fri/Sat skip afternoon
      if (isWeekendDay && (shift.id === "afternoon" || shift.id === "morning2")) {
        row.appendChild(e("td",{style:"background:#0F172A44;cursor:default"},[
          e("div",{style:"font-size:9px;color:#334155;text-align:center;padding:10px 0"},"—")
        ]));
        return;
      }
      const empIds = S.schedule[date]?.[shift.id] || [];
      const isSel = S.selectedCell?.date===date && S.selectedCell?.shift===shift.id;
      const canEdit = isManager();
      const _isTouchDev = "ontouchstart" in window || navigator.maxTouchPoints > 0;
      const tdProps = {
        class: isSel ? "selected" : "",
        style: "--shift-color:"+shift.color+(canEdit?";cursor:pointer":";cursor:default"),
        onclick: () => {
          if (!canEdit) return;
          S.selectedCell = isSel ? null : {date, shift:shift.id};
          render();
        }
      };
      // Drag & drop target (desktop only)
      if (canEdit && !_isTouchDev) {
        tdProps.ondragover = (ev) => {
          ev.preventDefault();
          ev.dataTransfer.dropEffect = "move";
          ev.currentTarget.style.background = shift.color + "22";
          ev.currentTarget.style.outline = "2px dashed " + shift.color;
        };
        tdProps.ondragleave = (ev) => {
          // Only clear if leaving the cell entirely (not entering child element)
          if (!ev.currentTarget.contains(ev.relatedTarget)) {
            ev.currentTarget.style.background = "";
            ev.currentTarget.style.outline = "";
          }
        };
        tdProps.ondrop = async (ev) => {
          ev.preventDefault();
          ev.currentTarget.style.background = "";
          ev.currentTarget.style.outline = "";
          try {
            const data = JSON.parse(ev.dataTransfer.getData("text/plain"));
            const { empId, fromDate, fromShift } = data;
            // Same cell - do nothing
            if (fromDate === date && fromShift === shift.id) return;
            // Check if employee is already in target cell
            const targetIds = S.schedule[date]?.[shift.id] || [];
            if (targetIds.includes(empId)) {
              toast("העובד כבר משובץ למשמרת הזאת","err");
              return;
            }
            
            const empName = getEmp(empId)?.name || "העובד";
            const targetShiftLabel = shift.label;
            
            // CHECK 1: Block check - did this employee block this shift?
            const blockShiftId = (shift.id === "morning2") ? "morning" : shift.id;
            const empBlocked = S.availSubmissions.some(s =>
              s.employee_id === empId &&
              (s.slots||[]).some(sl => {
                if (sl.date && sl.date === date) return sl.shift === blockShiftId || sl.shift === shift.id;
                return false;
              })
            );
            if (empBlocked) {
              if (!confirm("⚠️ " + empName + " חסם את " + targetShiftLabel + " ביום זה!\n\nלשבץ בכל זאת?")) return;
            }
            
            // CHECK 2: Vacation/reserve/exam
            const vac = S.vacations.find(v=>v.employee_id===empId&&v.status==="approved"&&date>=v.start_date&&date<=v.end_date);
            if (vac) {
              const vacLabel = vac.type === "reserve" ? "מילואים" : vac.type === "exam" ? "מבחן" : "חופש";
              if (!confirm("⚠️ " + empName + " ב" + vacLabel + " בתאריך זה!\n\nלשבץ בכל זאת?")) return;
            }
            
            // CHECK 3: Cross-week rest (night yesterday → morning today)
            const crossConflict = await checkShiftConflictAsync(date, shift.id, empId, fromDate, fromShift);
            if (crossConflict) {
              if (!confirm("⚠️ " + crossConflict + "\n\nלשבץ בכל זאת?")) return;
            }
            
            // Remove from source
            if (S.schedule[fromDate] && S.schedule[fromDate][fromShift]) {
              S.schedule[fromDate][fromShift] = S.schedule[fromDate][fromShift].filter(id => id !== empId);
            }
            // Add to target
            if (!S.schedule[date]) S.schedule[date] = {};
            if (!S.schedule[date][shift.id]) S.schedule[date][shift.id] = [];
            S.schedule[date][shift.id].push(empId);
            
            // Move custom hours and notes if exist
            const oldChKey = fromDate+"|"+fromShift+"|"+empId;
            const newChKey = date+"|"+shift.id+"|"+empId;
            if (S.customHours[oldChKey]) {
              S.customHours[newChKey] = S.customHours[oldChKey];
              delete S.customHours[oldChKey];
            }
            const oldNoteKey = fromDate+"|"+fromShift+"|"+empId;
            const newNoteKey = date+"|"+shift.id+"|"+empId;
            if (S.assignmentNotes[oldNoteKey]) {
              S.assignmentNotes[newNoteKey] = S.assignmentNotes[oldNoteKey];
              delete S.assignmentNotes[oldNoteKey];
            }
            
            invalidateMemo && invalidateMemo();
            render();
            saveScheduleToDB();
            if (typeof logAction === "function") {
              logAction("drag_drop_move", { empId, from:{date:fromDate,shift:fromShift}, to:{date,shift:shift.id} });
            }
            toast("הועבר ✓");
          } catch (err) {
            console.error("Drag drop error:", err);
          }
        };
      }
      const td = e("td", tdProps);
      if (empIds.length === 0) {
        td.appendChild(div("cell-empty",["ריק"]));
      } else {
        empIds.forEach(empId => {
          const emp = getEmp(empId);
          if (!emp) return;
          const i = empIdx(empId);
          const col = ec(i);
          const ch = S.customHours[date+"|"+shift.id+"|"+empId];
          const isFilteredOut = S.schedFilter && S.schedFilter !== empId;
          const isHighlighted = S.schedFilter && S.schedFilter === empId;
          const chipProps = {class:"emp-chip",
            style:`background:${isHighlighted?col+"44":col+"22"};border:${isHighlighted?"2px":"1px"} solid ${isHighlighted?col:col+"44"};color:${col};opacity:${isFilteredOut?"0.2":"1"};${isHighlighted?"box-shadow:0 0 8px "+col+"44;":""};cursor:${isManager()?"grab":"default"}`
          };
          // Drag & drop only on desktop (not touch devices)
          const isTouchDevice = "ontouchstart" in window || navigator.maxTouchPoints > 0;
          if (isManager() && !isTouchDevice) {
            chipProps.draggable = "true";
            chipProps.ondragstart = (ev) => {
              ev.dataTransfer.setData("text/plain", JSON.stringify({empId:empId, fromDate:date, fromShift:shift.id}));
              ev.dataTransfer.effectAllowed = "move";
              ev.dataTransfer.dropEffect = "move";
              setTimeout(()=>{if(ev.target.style)ev.target.style.opacity="0.3";}, 0);
            };
            chipProps.ondragend = (ev) => { ev.target.style.opacity=""; };
          }
          // Parse note for tags and free text
          const noteKey = date+"|"+shift.id+"|"+empId;
          const rawNote = S.assignmentNotes[noteKey] || "";
          let chipTags = [];
          let chipNoteText = "";
          if (rawNote.startsWith("🏷️ ")) {
            const parts = rawNote.split(" | ");
            chipTags = parts[0].replace("🏷️ ","").split(", ").map(t=>t.trim()).filter(Boolean);
            chipNoteText = parts.slice(1).join(" | ");
          } else if (rawNote) {
            chipNoteText = rawNote;
          }
          
          const chip = e("div",chipProps,[
            // Name row with color dot
            e("div",{class:"emp-chip-row"},[
              e("span",{style:`width:6px;height:6px;border-radius:50%;background:${col};flex-shrink:0`},""),
              e("span",{style:"font-weight:700"},emp.name.split(" ")[0])
            ]),
            // Hours (custom or default)
            ch ? e("div",{class:"emp-chip-hours"},`⏰ ${ch.start}-${ch.end}`) : null,
            // System tags
            chipTags.length > 0 ? e("div",{class:"emp-chip-tags"},
              chipTags.map(t => e("span",{class:"emp-chip-tag"},"🏷️ "+t))
            ) : null,
            // Free-text note
            chipNoteText ? e("div",{class:"emp-chip-note"},"📝 "+chipNoteText) : null
          ]);
          td.appendChild(chip);
        });
      }
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });
  tbl.appendChild(tbody);
  gridWrap.appendChild(tbl);
  gridCard.appendChild(gridWrap);
  wrap.appendChild(gridCard);

  // Cell editor
  if (S.selectedCell) {
    wrap.appendChild(viewCellEditor(S.selectedCell.date, S.selectedCell.shift));
  }

  // Workload
  wrap.appendChild(viewWorkload(wd));
  return wrap;
}

function viewScheduleDayMobile(wd) {
  const wrap = e("div",{class:"sched-day-view",style:"display:block"});
  if (S.schedDayIdx == null || S.schedDayIdx < 0 || S.schedDayIdx > 6) S.schedDayIdx = 0;
  const date = wd[S.schedDayIdx];
  const dt = new Date(date+"T00:00:00");
  const isToday = date === today();
  const holiday = getHoliday(date);
  
  // Navigation row
  const navRow = e("div",{class:"sched-day-nav"},[
    btn("btn-sm btn-sm-gray","→",()=>{
      if (S.schedDayIdx > 0) { S.schedDayIdx--; render(); }
      else { 
        // Go to previous week's Saturday
        S.weekOffset--; S.schedDayIdx = 6; 
        loadSchedule().then(()=>render());
      }
    }),
    e("div",{style:"flex:1;text-align:center"},[
      e("div",{style:"font-weight:800;font-size:15px;color:"+(isToday?"#60A5FA":"#E2E8F0")},
        DAYS[dt.getDay()] + " " + dt.getDate() + "/" + (dt.getMonth()+1) + "/" + dt.getFullYear()),
      isToday ? e("div",{style:"font-size:10px;color:#60A5FA;font-weight:700;margin-top:2px"},"היום") : null,
      holiday ? e("div",{style:"font-size:10px;color:#FCD34D;font-weight:700;margin-top:2px"},"✡️ "+holiday) : null
    ]),
    btn("btn-sm btn-sm-gray","←",()=>{
      if (S.schedDayIdx < 6) { S.schedDayIdx++; render(); }
      else { 
        // Go to next week's Sunday
        S.weekOffset++; S.schedDayIdx = 0; 
        loadSchedule().then(()=>render());
      }
    })
  ]);
  wrap.appendChild(navRow);
  
  // Today shortcut
  if (!isToday) {
    wrap.appendChild(e("div",{style:"text-align:center;margin-bottom:10px"},[
      btn("btn-sm btn-sm-blue","← היום",()=>{
        const todayStr = today();
        const todayDt = new Date(todayStr+"T00:00:00");
        const curWeekStart = new Date(wd[0]+"T00:00:00");
        // Calculate offset from current week
        const diffMs = todayDt - curWeekStart;
        const diffDays = Math.floor(diffMs / (1000*60*60*24));
        if (diffDays >= 0 && diffDays < 7) {
          // In this week
          S.schedDayIdx = diffDays;
          render();
        } else {
          S.weekOffset = 0;
          S.schedDayIdx = todayDt.getDay();
          loadSchedule().then(()=>render());
        }
      })
    ]));
  }
  
  // Day card with shifts
  const dayCard = e("div",{class:"sched-day-card"});
  
  // Get absences for this day (managers only)
  if (isManager()) {
    const dayAbs = S.vacations.filter(v =>
      v.status === "approved" && v.type !== "exam" &&
      date >= v.start_date && date <= v.end_date
    );
    const dayExams = S.vacations.filter(v =>
      v.type === "exam" && v.status === "approved" &&
      date >= v.start_date && date <= v.end_date
    );
    const dayBlocks = (S.availSubmissions||[]).filter(b => 
      (b.slots||[]).some(sl => sl.date === date)
    );
    
    if (dayAbs.length > 0 || dayExams.length > 0 || dayBlocks.length > 0) {
      const absSection = e("div",{style:"padding:10px 14px;background:#F59E0B11;border-bottom:1px solid #334155"});
      absSection.appendChild(e("div",{style:"font-weight:700;font-size:12px;color:#F59E0B;margin-bottom:6px"},"🌴 העדרויות וחסימות"));
      dayAbs.forEach(v => {
        const emp = getEmp(v.employee_id);
        if (!emp) return;
        const icon = v.type === "reserve" ? "🎖️" : "🌴";
        absSection.appendChild(e("div",{style:"font-size:11px;color:#F59E0B;margin-bottom:2px"}, icon+" "+emp.name));
      });
      dayExams.forEach(v => {
        const emp = getEmp(v.employee_id);
        if (!emp) return;
        absSection.appendChild(e("div",{style:"font-size:11px;color:#10B981;margin-bottom:2px"}, "📝 "+emp.name));
      });
      dayBlocks.forEach(b => {
        (b.slots||[]).filter(sl => sl.date === date).forEach(sl => {
          const emp = getEmp(b.employee_id);
          const sh = SHIFT_BY_ID[sl.shift];
          if (!emp || !sh) return;
          absSection.appendChild(e("div",{style:"font-size:11px;color:#EF4444;margin-bottom:2px"}, "🚫 "+emp.name+" — "+sh.label));
        });
      });
      dayCard.appendChild(absSection);
    }
  }
  
  // Shifts for this day
  const dayShifts = getShiftsForDate(date);
  dayShifts.forEach(shift => {
    const empIds = S.schedule[date]?.[shift.id] || [];
    const isSel = S.selectedCell?.date===date && S.selectedCell?.shift===shift.id;
    
    const shiftRow = e("div",{
      class:"sched-day-shift-row",
      style: "padding:12px 14px;cursor:"+(isManager()?"pointer":"default")+";border-bottom:1px solid #0F172A;background:"+(isSel?"rgba(59,130,246,0.08)":"transparent")+";border-right:3px solid "+(isSel?shift.color:"transparent"),
      onclick: () => {
        if (!isManager()) return;
        S.selectedCell = isSel ? null : {date, shift:shift.id};
        render();
      }
    });
    
    // Shift label + hours
    shiftRow.appendChild(e("div",{class:"sched-day-shift-label",style:"color:"+shift.color},[
      e("div",{},shift.label),
      e("div",{class:"sched-day-shift-hours"},shift.start+"–"+shift.end)
    ]));
    
    // Employees in this shift
    const empsDiv = e("div",{class:"sched-day-shift-emps"});
    if (empIds.length === 0) {
      empsDiv.appendChild(e("div",{style:"color:#475569;font-size:12px;font-style:italic"},"— ריק —"));
    } else {
      empIds.forEach(empId => {
        const emp = getEmp(empId);
        if (!emp) return;
        const idx = empIdx(empId);
        const col = ec(idx);
        const ch = S.customHours[date+"|"+shift.id+"|"+empId];
        const noteKey = date+"|"+shift.id+"|"+empId;
        const rawNote = S.assignmentNotes[noteKey] || "";
        let chipTags = [];
        let chipNoteText = "";
        if (rawNote.startsWith("🏷️ ")) {
          const parts = rawNote.split(" | ");
          chipTags = parts[0].replace("🏷️ ","").split(", ").map(t=>t.trim()).filter(Boolean);
          chipNoteText = parts.slice(1).join(" | ");
        } else if (rawNote) {
          chipNoteText = rawNote;
        }
        
        empsDiv.appendChild(e("div",{
          style:"background:"+col+"18;border:1px solid "+col+"44;border-radius:8px;padding:8px 10px"
        },[
          e("div",{style:"display:flex;align-items:center;gap:6px"},[
            e("span",{style:"width:8px;height:8px;border-radius:50%;background:"+col+";flex-shrink:0"},""),
            e("span",{style:"font-weight:700;font-size:13px;color:"+col},emp.name)
          ]),
          ch ? e("div",{style:"font-size:11px;color:#94A3B8;margin-top:3px"},"⏰ "+ch.start+"–"+ch.end) : null,
          chipTags.length > 0 ? e("div",{style:"display:flex;flex-wrap:wrap;gap:3px;margin-top:4px"},
            chipTags.map(t => e("span",{style:"background:rgba(255,255,255,0.08);font-size:10px;padding:2px 7px;border-radius:6px;color:#E2E8F0"},"🏷️ "+t))
          ) : null,
          chipNoteText ? e("div",{style:"font-size:10px;color:#F59E0B;margin-top:3px;font-style:italic"},"📝 "+chipNoteText) : null
        ]));
      });
    }
    shiftRow.appendChild(empsDiv);
    dayCard.appendChild(shiftRow);
  });
  wrap.appendChild(dayCard);
  
  // Cell editor (if a cell is selected)
  if (S.selectedCell && S.selectedCell.date === date) {
    wrap.appendChild(viewCellEditor(S.selectedCell.date, S.selectedCell.shift));
  }
  
  return wrap;
}

function viewCellEditor(date, shiftId) {
  const shift = SHIFT_BY_ID[shiftId];
  const assignedIds = S.schedule[date]?.[shiftId] || [];
  const editor = div("cell-editor");
  editor.appendChild(e("div",{class:"cell-editor-title"},`✏️ ${shift.label} — ${fmtDate(date)}`));

  const btnWrap = e("div");
  schedulableEmployees().forEach((emp, idx) => {
    const col = ec(idx);
    const vac = S.vacations.find(v=>v.employee_id===emp.id&&v.status==="approved"&&date>=v.start_date&&date<=v.end_date);
    const onVac = !!vac;
    const vacIcon = vac?.type === "reserve" ? "🎖️" : vac?.type === "exam" ? "📝" : "🌴";
    const vacLabel = vac?.type === "reserve" ? "מילואים" : vac?.type === "exam" ? "מבחן" : "חופש";
    const isAssigned = assignedIds.includes(emp.id);
    const locked = S.lockedSlots[date+"|"+shiftId]?.has(emp.id);

    const chip = e("button",{
      class:"cell-emp-btn"+(isAssigned?" assigned":""),
      style:`background:${isAssigned?col+"33":"#0F172A"};border:1px solid ${isAssigned?col:col+"44"};color:${col};opacity:${onVac && !isAssigned ? 0.7 : 1}`,
      title: onVac ? emp.name+" ב"+vacLabel+" בתאריך זה" : "",
      onclick: () => {
        // If employee is on vacation/reserve/exam, ask for confirmation before assigning
        if (onVac && !isAssigned) {
          if (!confirm("⚠️ אזהרה: " + emp.name + " ב" + vacLabel + " בתאריך " + fmtDate(date) + ".\n\nלשבץ בכל זאת?")) return;
        }
        toggleCellEmp(date, shiftId, emp.id);
      }
    },[
      e("span",{style:`width:7px;height:7px;border-radius:50%;background:${col}`},""),
      e("span",{},emp.name),
      onVac ? e("span",{style:"font-size:11px",title:vacLabel},vacIcon) : null,
      locked ? e("span",{},"🔒") : null
    ]);
    btnWrap.appendChild(chip);

    if (isAssigned) {
      // Lock button
      const lockBtn = e("button",{
        class:"btn-icon",
        title: locked?"שחרר נעילה":"נעל שיבוץ",
        style:"margin-right:-8px;margin-left:4px",
        onclick: (ev) => { ev.stopPropagation(); toggleLock(date,shiftId,emp.id); }
      }, locked?"🔒":"🔓");
      btnWrap.appendChild(lockBtn);

      // Custom hours button
      const chKey = date+"|"+shiftId+"|"+emp.id;
      const existingCh = S.customHours[chKey];
      // Note button
      const noteKey = date+"|"+shiftId+"|"+emp.id;
      const existingNote = S.assignmentNotes[noteKey];
      const noteBtn = e("button",{
        class:"btn-icon",
        title:"הערה",
        style:"margin-right:-8px;margin-left:4px;font-size:12px;color:"+(existingNote?"#F59E0B":"#475569"),
        onclick: (ev) => {
          ev.stopPropagation();
          const editorId = "note-editor-"+noteKey.replace(/[|]/g,"_");
          const existingEditor = document.getElementById(editorId);
          if (existingEditor) { existingEditor.remove(); return; }
          
          // Parse existing note - separate system tags from free text
          // Format: "🏷️ Sys1, Sys2 | free text" or just plain
          let existingTags = [];
          let existingText = "";
          if (existingNote) {
            const parts = existingNote.split(" | ");
            if (parts[0].startsWith("🏷️ ")) {
              existingTags = parts[0].replace("🏷️ ","").split(", ").filter(x=>x.trim());
              existingText = parts.slice(1).join(" | ");
            } else {
              existingText = existingNote;
            }
          }
          
          const selectedTags = new Set(existingTags);
          const editorDiv = e("div",{
            id:editorId,
            style:"display:flex;flex-direction:column;gap:8px;background:#0F172A;border:1px solid #334155;border-radius:10px;padding:10px;margin:4px;width:100%;max-width:380px"
          });
          
          // System chips picker
          const systems = S.systems || [];
          if (systems.length > 0) {
            editorDiv.appendChild(e("div",{style:"font-size:10px;color:#64748B;font-weight:700"},"🏷️ בחר מערכות:"));
            const chipsRow = e("div",{style:"display:flex;flex-wrap:wrap;gap:4px"});
            systems.forEach(sys => {
              const isSel = selectedTags.has(sys);
              const chipBtn = e("button",{
                "data-sys":sys,
                style:`padding:4px 10px;border-radius:14px;border:1px solid ${isSel?"#3B82F6":"#334155"};background:${isSel?"#3B82F644":"#1E293B"};color:${isSel?"#60A5FA":"#94A3B8"};font-size:11px;font-weight:600;cursor:pointer;font-family:inherit`,
                onclick:(ev2)=>{
                  ev2.stopPropagation();
                  if (selectedTags.has(sys)) selectedTags.delete(sys);
                  else selectedTags.add(sys);
                  // Re-style this chip
                  const newSel = selectedTags.has(sys);
                  ev2.target.style.background = newSel?"#3B82F644":"#1E293B";
                  ev2.target.style.color = newSel?"#60A5FA":"#94A3B8";
                  ev2.target.style.borderColor = newSel?"#3B82F6":"#334155";
                }
              }, sys);
              chipsRow.appendChild(chipBtn);
            });
            editorDiv.appendChild(chipsRow);
          } else {
            editorDiv.appendChild(e("div",{style:"font-size:10px;color:#475569;font-style:italic"},"💡 הוסף מערכות בהגדרות לבחירה מהירה"));
          }
          
          // Free text input
          editorDiv.appendChild(e("div",{style:"font-size:10px;color:#64748B;font-weight:700;margin-top:4px"},"💬 הערה חופשית:"));
          const textInp = e("input",{
            type:"text",
            value:existingText,
            placeholder:"הערה (אופציונלי)",
            style:"background:#1E293B;border:1px solid #334155;border-radius:6px;color:#E2E8F0;font-size:13px;padding:6px 10px;font-family:inherit;width:100%;box-sizing:border-box",
            id:"note-inp-"+noteKey.replace(/[|]/g,"_")
          });
          editorDiv.appendChild(textInp);
          
          // Action buttons
          const btnRow = e("div",{style:"display:flex;gap:6px"});
          btnRow.appendChild(e("button",{
            style:"flex:1;background:#10B98122;border:1px solid #10B98144;color:#10B981;border-radius:6px;padding:6px 12px;font-size:12px;font-family:inherit;font-weight:700;cursor:pointer",
            onclick:(ev2)=>{
              ev2.stopPropagation();
              const txt = document.getElementById("note-inp-"+noteKey.replace(/[|]/g,"_")).value.trim();
              const tags = Array.from(selectedTags);
              let combined = "";
              if (tags.length > 0 && txt) combined = "🏷️ " + tags.join(", ") + " | " + txt;
              else if (tags.length > 0) combined = "🏷️ " + tags.join(", ");
              else combined = txt;
              if (combined) S.assignmentNotes[noteKey] = combined;
              else delete S.assignmentNotes[noteKey];
              saveScheduleToDB();
              toast("הערה נשמרה ✓");
              render();
            }
          },"💾 שמור"));
          btnRow.appendChild(e("button",{
            style:"background:#EF444422;border:1px solid #EF444444;color:#EF4444;border-radius:6px;padding:6px 12px;font-size:12px;font-family:inherit;font-weight:700;cursor:pointer",
            onclick:(ev2)=>{
              ev2.stopPropagation();
              delete S.assignmentNotes[noteKey];
              saveScheduleToDB();
              toast("הערה הוסרה");
              render();
            }
          },"מחק"));
          btnRow.appendChild(e("button",{
            style:"background:#64748B22;border:1px solid #64748B44;color:#94A3B8;border-radius:6px;padding:6px 12px;font-size:12px;font-family:inherit;font-weight:700;cursor:pointer",
            onclick:(ev2)=>{
              ev2.stopPropagation();
              document.getElementById(editorId)?.remove();
            }
          },"ביטול"));
          editorDiv.appendChild(btnRow);
          
          btnWrap.appendChild(editorDiv);
        }
      }, existingNote?"📝":"💬");
      btnWrap.appendChild(noteBtn);

      const hoursBtn = e("button",{
        class:"btn-icon",
        title:"ערוך שעות",
        style:"margin-right:-8px;margin-left:4px;font-size:12px;color:#94A3B8",
        onclick: (ev) => {
          ev.stopPropagation();
          const sh = SHIFT_BY_ID[shiftId];
          const curStart = existingCh?.start || sh.start;
          const curEnd = existingCh?.end || sh.end;
          // Show inline editor
          const existingEditor = document.getElementById("hours-editor-"+chKey.replace(/[|]/g,"_"));
          if (existingEditor) { existingEditor.remove(); return; }
          const editorDiv = e("div",{
            id:"hours-editor-"+chKey.replace(/[|]/g,"_"),
            style:"display:inline-flex;align-items:center;gap:6px;background:#0F172A;border:1px solid #334155;border-radius:8px;padding:6px 10px;margin:4px"
          },[
            e("span",{style:"font-size:11px;color:#94A3B8"},emp.name.split(" ")[0]+":"),
            e("input",{type:"time",value:curStart,style:"background:#1E293B;border:1px solid #334155;border-radius:6px;color:#E2E8F0;font-size:12px;padding:3px 6px;font-family:inherit",
              id:"ch-start-"+chKey.replace(/[|]/g,"_")}),
            e("span",{style:"color:#475569;font-size:11px"},"—"),
            e("input",{type:"time",value:curEnd,style:"background:#1E293B;border:1px solid #334155;border-radius:6px;color:#E2E8F0;font-size:12px;padding:3px 6px;font-family:inherit",
              id:"ch-end-"+chKey.replace(/[|]/g,"_")}),
            e("button",{
              style:"background:#10B98122;border:1px solid #10B98144;color:#10B981;border-radius:6px;padding:3px 8px;font-size:11px;font-family:inherit;font-weight:700",
              onclick:(ev2)=>{
                ev2.stopPropagation();
                const s=document.getElementById("ch-start-"+chKey.replace(/[|]/g,"_")).value;
                const en=document.getElementById("ch-end-"+chKey.replace(/[|]/g,"_")).value;
                if(s&&en){S.customHours[chKey]={start:s,end:en};saveScheduleToDB();toast("שעות עודכנו ✓");render();}
              }
            },"שמור"),
            e("button",{
              style:"background:#EF444422;border:1px solid #EF444444;color:#EF4444;border-radius:6px;padding:3px 8px;font-size:11px;font-family:inherit;font-weight:700",
              onclick:(ev2)=>{
                ev2.stopPropagation();
                delete S.customHours[chKey];saveScheduleToDB();toast("שעות אופסו");render();
              }
            },"אפס")
          ]);
          btnWrap.appendChild(editorDiv);
        }
      }, "⏰");
      btnWrap.appendChild(hoursBtn);
    }
  });
  editor.appendChild(btnWrap);
  return editor;
}

function viewWorkload(wd) {
  const counts = {};
  S.employees.forEach(emp => { counts[emp.id] = 0; });
  wd.forEach(d => SHIFTS.forEach(sh => {
    (S.schedule[d]?.[sh.id]||[]).forEach(id => { counts[id] = (counts[id]||0)+1; });
  }));

  if (!S.schedFilter) S.schedFilter = null;
  const card = div("card",[
    e("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"},[
      e("div",{class:"card-title",style:"margin-bottom:0"},"עומס עובדים — השבוע"),
      S.schedFilter ? btn("btn-sm btn-sm-gray","✕ הסר פילטר",()=>{S.schedFilter=null;render();}) : null
    ])
  ]);
  schedulableEmployees().forEach((emp, idx) => {
    const count = counts[emp.id]||0;
    const max = emp.max_shifts_per_week||5;
    const pct = Math.min(Math.round((count/max)*100),100);
    const over = count > max;
    const col = ec(idx);
    const barColor = over?"#EF4444":pct>80?"#F59E0B":"#10B981";
    const isFiltered = S.schedFilter === emp.id;
    card.appendChild(div("workload-row",[
      div("workload-info",[
        e("div",{style:"display:flex;align-items:center;gap:7px;cursor:pointer",onclick:()=>{S.schedFilter=isFiltered?null:emp.id;render();}},[
          e("span",{style:`width:8px;height:8px;border-radius:50%;background:${col}`},""),
          e("span",{style:"font-size:13px;font-weight:"+(isFiltered?"800":"600")+";color:"+(isFiltered?"#60A5FA":"#E2E8F0")},emp.name),
          isFiltered ? e("span",{style:"font-size:10px;background:#3B82F622;color:#60A5FA;border:1px solid #3B82F644;border-radius:4px;padding:1px 5px"},"מסונן") : null,
          over ? e("span",{style:"font-size:10px;background:#EF444422;color:#EF4444;border:1px solid #EF444444;border-radius:4px;padding:1px 5px"},"חריגה!") : null
        ]),
        e("span",{style:"font-size:12px;color:"+(over?"#EF4444":"#94A3B8")},`${count}/${max}`)
      ]),
      div("workload-bar-bg",[
        e("div",{class:"workload-bar-fill",style:`width:${pct}%;background:${isFiltered?"#3B82F6":barColor}`})
      ])
    ]));
  });
  return card;
}

            btn("btn-sm btn-sm-gray","📧",()=>resendInvitation(inv),{title:"שלח מחדש"}),
            btn("btn-sm btn-sm-red","✕",()=>revokeInvitation(inv.id),{title:"בטל"})
          ])
        ])
      ]));
    });

  }
  
  // Add form

    const form = div("card",[div("card-title",["עובד חדש"])]);
    const r1 = div("form-row",[
      div("form-col",[e("label",{class:"form-label"},"שם מלא *"),e("input",{class:"fi",placeholder:"ישראל ישראלי",value:S.newEmp.name,oninput:ev=>{S.newEmp.name=ev.target.value}})]),
      div("form-col",[e("label",{class:"form-label"},"אימייל"),e("input",{class:"fi",type:"email",placeholder:"name@example.com",value:S.newEmp.email,oninput:ev=>{S.newEmp.email=ev.target.value}})])
    ]);
    const r2 = div("form-row",[
      div("form-col",[e("label",{class:"form-label"},"תעודת זהות"),e("input",{class:"fi",placeholder:"000000000",value:S.newEmp.idNumber,oninput:ev=>{S.newEmp.idNumber=ev.target.value}})]),
      div("form-col",[e("label",{class:"form-label"},"תפקיד"),e("select",{class:"fi",onchange:ev=>{S.newEmp.role=ev.target.value}},[
        e("option",{value:"employee",selected:S.newEmp.role==="employee"?"selected":null},"עובד"),
        e("option",{value:"admin",selected:S.newEmp.role==="admin"?"selected":null},"מנהל")
      ])])
    ]);

      btn("btn-add","שמור עובד",addEmployee,{style:"flex:1"}),

      e("thead",[e("tr",[e("th",{},"שם"),e("th",{},"אימייל"),e("th",{},"ת.ז."),e("th",{},"תפקיד"),e("th",{},"")])])
    ]);
    const tbody = e("tbody");
    S.employees.forEach((emp,idx) => {
      const col = ec(idx);
      const tr = e("tr",[
        e("td",{style:"font-weight:700"},[
          e("span",{style:`display:inline-block;width:8px;height:8px;border-radius:50%;background:${col};margin-left:8px`},""),

            onmouseout:(ev)=>{ev.target.style.borderBottomColor="transparent";ev.target.style.color="";},

        ]),

        e("td",{style:"color:#64748B"},emp.id_number||"—"),
        e("td",{},[
          e("span",{},emp.role==="admin"||emp.role==="manager"?"מנהל":"עובד"),
          emp.schedule_excluded ? e("span",{style:"display:inline-block;background:#A855F722;color:#C084FC;border:1px solid #A855F744;border-radius:5px;padding:1px 6px;font-size:9px;font-weight:700;margin-right:6px"},"👔 ניהול בלבד") : null

          },[
            e("option",{value:"employee",selected:emp.role==="employee"?"selected":null},"עובד"),
            e("option",{value:"admin",selected:emp.role==="admin"||emp.role==="manager"?"selected":null},"מנהל")
          ]) : e("span",{style:"font-size:11px;color:#F59E0B;margin-left:4px"},""),

      e("div",{style:"font-weight:700;font-size:14px;color:#F59E0B;margin-bottom:10px"},`📋 הגשות זמינות (${subs.length})`)

          e("div",{},[
            e("div",{style:"font-weight:700;font-size:13px"},emp?.name||"—"),
            e("div",{style:"font-size:11px;color:#64748B;margin-top:3px"},sub.week_start),

          btn("btn-sm btn-sm-green","✓ קראתי",async()=>{
            await sb.from("availability_submissions").update({read:true}).eq("id",sub.id);
            S.availSubmissions = S.availSubmissions.filter(s=>s.id!==sub.id);
            toast("סומן כנקרא ✓");render();
          })
        ])
      ]));
    });
    wrap.appendChild(subCard);
  }

  return wrap;
}

// ── Edit / cancel approved vacations ──
async function editApprovedVacation(vac) {
  const types = { vacation: "חופשה", reserve: "מילואים", exam: "מבחן" };
  const emp = getEmp(vac.employee_id);
  const empName = emp?.name || "עובד";
  
  // Prompt for new dates
  const newStart = prompt("תאריך התחלה חדש (YYYY-MM-DD)\nעובד: " + empName + "\nסוג: " + (types[vac.type] || "חופשה"), vac.start_date);
  if (!newStart) return;
  
  // Validate date format
  if (!/^\d{4}-\d{2}-\d{2}$/.test(newStart)) {
    toast("פורמט תאריך לא תקין", "err");
    return;
  }
  
  const newEnd = prompt("תאריך סיום חדש (YYYY-MM-DD)", vac.end_date);
  if (!newEnd) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(newEnd)) {
    toast("פורמט תאריך לא תקין", "err");
    return;
  }
  
  if (newEnd < newStart) {
    toast("תאריך סיום חייב להיות אחרי תאריך התחלה", "err");
    return;
  }
  
  const newReason = prompt("סיבה / הערה (אופציונלי)", vac.reason || "");
  if (newReason === null) return; // cancelled
  
  // Update in DB
  const { error } = await sb.from("vacations").update({
    start_date: newStart,
    end_date: newEnd,
    reason: newReason || null
  }).eq("id", vac.id);
  
  if (error) {
    toast("שגיאה בעדכון: " + error.message, "err");
    return;
  }
  
  if (typeof logAction === "function") {
    logAction("vacation_edited", {
      vacation_id: vac.id,
      employee_id: vac.employee_id,
      old_dates: vac.start_date + " — " + vac.end_date,
      new_dates: newStart + " — " + newEnd
    });
  }
  
  await loadVacations();
  toast("✓ ההעדרות עודכנה");
  render();
}

async function cancelApprovedVacation(vac) {
  const types = { vacation: "חופשה", reserve: "מילואים", exam: "מבחן" };
  const emp = getEmp(vac.employee_id);
  const empName = emp?.name || "עובד";
  const typeLabel = types[vac.type] || "חופשה";
  
  if (!confirm(`לבטל את ה${typeLabel} של ${empName}?\n\nתאריכים: ${fmtDate(vac.start_date)}${vac.start_date !== vac.end_date ? " — " + fmtDate(vac.end_date) : ""}\n\nההעדרות תימחק לחלוטין מהמערכת.`)) return;
  
  // Delete from DB
  const { error } = await sb.from("vacations").delete().eq("id", vac.id);
  
  if (error) {
    toast("שגיאה בביטול: " + error.message, "err");
    return;
  }
  
  if (typeof logAction === "function") {
    logAction("vacation_cancelled", {
      vacation_id: vac.id,
      employee_id: vac.employee_id,
      type: vac.type,
      dates: vac.start_date + " — " + vac.end_date
    });
  }
  
  await loadVacations();
  toast("✓ ההעדרות בוטלה");
  render();
}

// ── SWAPS ──
async function processManagerDecision(swap, isApproved, rejectReason) {
  if (isApproved) {
    // אימות אחרון לפני אישור בסידור
    if (swap.target_date && swap.giver_id) { // חילוף הדדי
      // מקבל המשמרת (העובד השני) מקבל את המשמרת שלך, ומתעלמים מהמשמרת שהוא מוסר
      const c1 = checkShiftConflict(swap.date, swap.shift, swap.taker_id, swap.target_date, swap.target_shift);
      // אתה (מוסר המשמרת) מקבל את המשמרת שלו, ומתעלמים מהמשמרת שאתה מוסר
      const c2 = checkShiftConflict(swap.target_date, swap.target_shift, swap.giver_id, swap.date, swap.shift);
      
      if (c1) { toast("לא ניתן לאשר: "+c1,"err"); return; }
      if (c2) { toast("לא ניתן לאשר: "+c2,"err"); return; }
      
      const empsA = S.schedule[swap.date]?.[swap.shift];
      if (empsA) { const i = empsA.indexOf(swap.giver_id); if (i > -1) empsA[i] = swap.taker_id; }
      const empsB = S.schedule[swap.target_date]?.[swap.target_shift];
      if (empsB) { const i = empsB.indexOf(swap.taker_id); if (i > -1) empsB[i] = swap.giver_id; }
    } else if (swap.giver_id) { // מסירת משמרת
      const c = checkShiftConflict(swap.date, swap.shift, swap.taker_id);
      if (c) { toast("לא ניתן לאשר: "+c,"err"); return; }
      const emps = S.schedule[swap.date]?.[swap.shift];
      if (emps) { const i = emps.indexOf(swap.giver_id); if (i > -1) emps[i] = swap.taker_id; }
    } else { // הצטרפות למשמרת
      const c = checkShiftConflict(swap.date, swap.shift, swap.taker_id);
      if (c) { toast("לא ניתן לאשר: "+c,"err"); return; }
      const emps = S.schedule[swap.date]?.[swap.shift];
      if (emps && !emps.includes(swap.taker_id)) emps.push(swap.taker_id);
    }
    saveScheduleToDB();
  }

  const swapUpdate = {status: isApproved?"approved":"rejected"};
  if (rejectReason) swapUpdate.reject_reason = rejectReason;
  const { data: swUpd, error: swErr } = await sb.from("swaps").update(swapUpdate).eq("id", swap.id).select("id,status").maybeSingle();
  if (swErr || !swUpd || swUpd.status !== swapUpdate.status) {
    toast("❌ הפעולה נכשלה: " + (swErr?.message || "לא ניתן לאמת את העדכון"), "err");
    return;
  }
  if (typeof logAction === "function") {
    logAction(isApproved ? "swap_approved" : "swap_rejected", {
      swap_id: swap.id,
      giver_id: swap.giver_id,
      taker_id: swap.taker_id,
      date: swap.date,
      shift: swap.shift,
      target_date: swap.target_date || null,
      target_shift: swap.target_shift || null,
      reject_reason: rejectReason || null
    });
  }

  const taker = getEmp(swap.taker_id);
  if (taker?.email) {
    const sh = SHIFT_BY_ID[swap.shift];
    sendEmail(
      "swap_decision", 
      taker.email,
      {
        empName: taker.name,
        targetDate: swap.target_date ? fmtDate(swap.date) + " ⇆ " + fmtDate(swap.target_date) : fmtDate(swap.date),
        shiftLabel: sh?.label || swap.shift,
        statusText: isApproved ? "אושרה" : "נדחתה",
        isApproved: isApproved,
        rejectReason: rejectReason||""
      }
    );
  }

  toast(isApproved ? "✓ אושר ועודכן בסידור" : "נדחה");
  await loadSwapRequests();
  render();
  silentRefresh();
}

// ── אישור/דחייה של העובד השני (Peer) ──
async function processPeerDecision(swap, isApproved) {
  const newStatus = isApproved ? "pending_manager" : "rejected";
  const { error } = await sb.from("swaps").update({status: newStatus}).eq("id", swap.id);
  if (error) { toast("שגיאה: " + error.message, "err"); return; }
  if (typeof logAction === "function") {
    logAction(isApproved ? "swap_peer_approved" : "swap_peer_rejected", {
      swap_id: swap.id,
      giver_id: swap.giver_id,
      taker_id: swap.taker_id,
      date: swap.date,
      shift: swap.shift
    });
  }

  // אם העובד אישר, עכשיו שולחים את המייל למנהל!
  if (isApproved) {
    const allMgrs = S.employees.filter(e => (e.role === "admin" || e.role === "manager") && e.email);
    const giverEmp = getEmp(swap.giver_id);
    const takerEmp = getEmp(swap.taker_id);
    const sh = SHIFT_BY_ID[swap.shift];
    const tSh = SHIFT_BY_ID[swap.target_shift];
    
    allMgrs.forEach(adminEmp => {
      let shiftLabel = "";
      let tDateStr = fmtDate(swap.date);
      
      if (swap.target_date) {
        shiftLabel = "החלפה הדדית בין " + giverEmp?.name + " ל-" + takerEmp?.name;
        tDateStr = fmtDate(swap.date) + " (" + sh?.label + ") ⇆ " + fmtDate(swap.target_date) + " (" + tSh?.label + ")";
      } else {
        shiftLabel = sh?.label + " — מסירה מ-" + giverEmp?.name + " ל-" + takerEmp?.name;
      }

     let emailTitle = swap.target_date ? "🔄 בקשת החלפה הדדית" : "📤 בקשת מסירת משמרת";
      sendEmail("swap_request", adminEmp.email, {
        title: emailTitle, // <--- הוספנו כותרת
        requesterName: "הודעת מערכת",
        targetDate: tDateStr,
        shiftLabel: shiftLabel,
        note: swap.note || ""
      });
    });
    toast("אישרת את הבקשה! הועבר לאישור מנהל ✓");
  } else {
    toast("דחית את הבקשה");
  }
  
  await loadSwapRequests();
  render();
  silentRefresh();
}

// Cache for schedule data loaded for swap weeks (other than current)
const _swapWeekCache = {};  // { weekStartStr: { date: { shift: [empIds] } } }

async function loadScheduleForSwapWeek(weekOffset) {
  const wd = getWeekDates(weekOffset);
  const weekStart = wd[0];
  
  // If it's the current week being viewed in schedule, just use S.schedule
  if (weekOffset === S.weekOffset) {
    return S.schedule;
  }
  
  // Check cache
  if (_swapWeekCache[weekStart]) {
    return _swapWeekCache[weekStart];
  }
  
  // Load from DB
  try {
    const { data: sched } = await sb.from("schedules")
      .select("id").eq("business_id", S.profile.business_id)
      .eq("week_start", weekStart).maybeSingle();
    
    if (!sched) {
      _swapWeekCache[weekStart] = {};
      return {};
    }
    
    const { data: assigns } = await sb.from("assignments")
      .select("*").eq("schedule_id", sched.id);
    
    const result = {};
    (assigns || []).forEach(a => {
      if (!result[a.date]) result[a.date] = {};
      if (!result[a.date][a.shift]) result[a.date][a.shift] = [];
      result[a.date][a.shift].push(a.employee_id);
    });
    
    _swapWeekCache[weekStart] = result;
    return result;
  } catch (err) {
    console.warn("Could not load swap week:", err);
    return {};
  }
}

// Invalidate swap cache when schedule changes
function invalidateSwapCache() {
  for (const key in _swapWeekCache) delete _swapWeekCache[key];
}

  // ══ עובד: בקשות הממתינות לאישור שלי (Peer) ══

  // ══ עובד: הגשת בקשות ══

  if (S.swapWeekOffset == null) S.swapWeekOffset = 0;

  // Week navigator

      style:"flex:1;padding:10px;border-radius:10px;border:1px solid " + (isActive?"#3B82F6":"#334155") + ";background:" + (isActive?"#3B82F622":"#1E293B") + ";color:" + (isActive?"#60A5FA":"#64748B") + ";font-family:inherit;font-weight:700;font-size:13px",

    },t.label));

  // Date range for filtering shifts to this week only (and future)

  const inSwapWeek = (d) => d >= minDate && d <= swapWeekEnd;

    card.appendChild(e("div",{style:"font-size:13px;color:#64748B;margin-bottom:14px"},"בחר את המשמרת שתרצה לתת, ואת המשמרת שתרצה לקבל."));

    const myFutureShifts = [];
    Object.keys(swapSched).filter(d=>inSwapWeek(d)).sort().forEach(date=>{
      const mfDt = new Date(date+"T00:00:00");

      SHIFTS.filter(sh => !(mfIsWeekend && (sh.id === "afternoon" || sh.id === "morning2"))).forEach(sh=>{

          const [myDate,myShiftId] = S.swapMyShift.split("|");
          const [tDate,tShiftId,tEmpId] = S.swapTargetShift.split("|");

          const {error} = await sb.from("swaps").insert([{
            business_id: S.profile.business_id,
            giver_id: myEmpId,
            taker_id: tEmpId,

          S.swapMyShift=null;S.swapTargetShift=null;
          invalidateSwapCache();
          await loadSwapRequests();
          
          const takerEmp = getEmp(tEmpId);
          if(takerEmp?.email){
            const viewingEmp = getActiveProfile();
            sendEmail("swap_request", takerEmp.email, {
              title: "🔄 בקשת החלפה הדדית",
              requesterName: viewingEmp?.name || "עובד",
              targetDate: "החלפה: " + fmtDate(myDate) + " ⇆ " + fmtDate(tDate),
              shiftLabel: "יש לך בקשה הממתינה לאישור באפליקציה",
              note: noteInp.value||""
            });
          }
          toast("הבקשה נשלחה לעובד ✓");render();
        },{style:"width:100%"}));
      }
      wrap.appendChild(card);
    }

  // ── מסירת משמרת ──

    const myHandoverShifts = [];
    Object.keys(swapSched).filter(d=>inSwapWeek(d)).sort().forEach(date=>{
      const hoDt = new Date(date+"T00:00:00");
      const hoIsWeekend = hoDt.getDay() === 5 || hoDt.getDay() === 6;
      SHIFTS.filter(sh => !(hoIsWeekend && (sh.id === "afternoon" || sh.id === "morning2"))).forEach(sh=>{
        if((swapSched[date]?.[sh.id]||[]).includes(myEmpId)){

            business_id: S.profile.business_id,
            giver_id: myEmpId,
            taker_id: S.handoverTarget,

    const availableShifts = [];
    Object.keys(S.schedule).filter(d=>inSwapWeek(d)).sort().forEach(date=>{
      const joinDt = new Date(date+"T00:00:00");
      const joinIsWeekend = joinDt.getDay() === 5 || joinDt.getDay() === 6;
      SHIFTS.filter(sh => !(joinIsWeekend && (sh.id === "afternoon" || sh.id === "morning2"))).forEach(sh=>{

            if (checkShiftConflict(date, sh.id, myEmpId)) return;
          availableShifts.push({date,shift:sh,empIds});

    if(availableShifts.length===0){

              empIds.length > 0 ? "משובצים: " + empIds.map(id=>getEmp(id)?.name.split(" ")[0]||"?").join(", ") : "אין משובצים")
          ]),

            const conflict = checkShiftConflict(date, shift.id, myEmpId);
            if (conflict) { toast(conflict,"err"); return; }

            const {error}=await sb.from("swaps").insert([{
              business_id:S.profile.business_id,
              taker_id:myEmpId,
              giver_id:null,
              date,shift:shift.id,
              status:"pending_manager"
            }]);
            if(error){toast("שגיאה: " + error.message,"err");return;}
            await loadSwapRequests();
            S.employees.filter(e=>(e.role==="admin"||e.role==="manager") && e.email).forEach(adminEmp2 => {
              const viewingEmp = getActiveProfile();
              sendEmail("swap_request",adminEmp2.email,{
                title: "➕ בקשת הצטרפות למשמרת", 
                requesterName: viewingEmp?.name || "עובד",
                targetDate: fmtDate(date),
                shiftLabel: (shift.label + " (" + shift.start + "–" + shift.end + ")"),
                note: ""
              });
            });
