<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משמרת — ניהול משמרות חכם</title>
<link rel="icon" type="image/png" href="logo-favicon.png">
<link rel="shortcut icon" type="image/png" href="logo-favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F172A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="משמרת">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Heebo,sans-serif}
html,body{height:100%;overflow-x:hidden}
body{background:#0F172A;color:#E2E8F0;min-height:100vh;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
.hidden{display:none !important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#1E293B}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
input:focus,select:focus,textarea:focus{outline:2px solid #3B82F6;outline-offset:1px}

/* ═══ LOGIN ═══ */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;background:#060B14}
.login-wrap::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(59,130,246,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,0.04) 1px,transparent 1px);background-size:48px 48px;z-index:0}
.login-wrap::after{content:"";position:absolute;top:-20%;right:-10%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.12) 0%,transparent 70%);pointer-events:none;z-index:0}
.login-card{width:100%;max-width:460px;background:rgba(15,23,42,0.85);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.07);border-radius:24px;padding:40px;box-shadow:0 32px 80px rgba(0,0,0,0.5);position:relative;z-index:1}
.logo-box{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.logo-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 8px 24px rgba(59,130,246,0.3);flex-shrink:0}
.logo-name{font-weight:900;font-size:18px;color:#F1F5F9}
.logo-sub{font-size:11px;color:#475569;margin-top:2px}
.login-h1{font-weight:800;font-size:24px;color:#F1F5F9;letter-spacing:-0.5px;margin-bottom:6px}
.subtitle{font-size:13px;color:#475569;margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:700;color:#64748B;margin-bottom:7px;text-transform:uppercase;letter-spacing:0.5px}
.field input{width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:13px 16px;color:#F1F5F9;font-size:14px;transition:all 0.2s}
.field input:focus{background:rgba(59,130,246,0.06);border-color:rgba(59,130,246,0.5)}
.btn-primary{width:100%;padding:14px 0;background:linear-gradient(135deg,#3B82F6,#6366F1);border:none;border-radius:14px;color:white;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(59,130,246,0.3);margin-top:8px;transition:transform 0.1s}
.btn-primary:active{transform:scale(0.98)}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed}
.switch-link{text-align:center;margin-top:20px;font-size:13px;color:#475569}
.switch-link a{color:#60A5FA;font-weight:700;text-decoration:none;cursor:pointer}
.err-box{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:12px;padding:12px 16px;color:#FCA5A5;font-size:13px;margin-bottom:12px}

/* ═══ APP LAYOUT ═══ */
.app{min-height:100vh;background:#0F172A;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#1E293B,#0F172A);border-bottom:1px solid #1E3A5F;padding:0 20px;position:sticky;top:0;z-index:40}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:7px 12px;border-radius:10px;border:none;background:transparent;color:#94A3B8;font-weight:600;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:5px;position:relative;flex-shrink:0;transition:all 0.15s}
.nav-btn:hover{background:#1E293B;color:#E2E8F0}
.nav-btn.active{background:#3B82F6;color:white;box-shadow:0 4px 12px rgba(59,130,246,0.3)}
.badge{background:#EF4444;color:white;border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-right:2px}
.badge-purple{background:#A855F7}
.user-area{display:flex;align-items:center;gap:8px;flex-shrink:0}
.user-name{font-size:13px;font-weight:700;color:#E2E8F0}
.user-role-label{font-size:11px;color:#64748B}
.btn-logout{background:#1E293B;border:1px solid #334155;color:#64748B;border-radius:10px;padding:6px 14px;font-weight:600;font-size:12px;transition:all 0.15s}
.btn-logout:hover{border-color:#64748B;color:#E2E8F0}
.main{max-width:1200px;margin:0 auto;padding:24px 20px;width:100%}

/* ═══ CARDS ═══ */
.card{background:#1E293B;border:1px solid #334155;border-radius:16px;padding:20px;margin-bottom:14px;transition:border-color 0.2s}
.card-title{font-weight:700;font-size:14px;color:#E2E8F0;margin-bottom:14px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.page-title{font-weight:900;font-size:22px;color:#E2E8F0}

/* ═══ KPI ═══ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#1E293B;border-radius:16px;padding:16px;border:1px solid #334155;transition:transform 0.15s}
.kpi:hover{transform:translateY(-2px)}
.kpi-icon{font-size:20px;margin-bottom:5px}
.kpi-val{font-size:24px;font-weight:900;line-height:1}
.kpi-lbl{font-size:11px;font-weight:700;color:#94A3B8;margin-top:3px}

/* ═══ QUICK ACTIONS ═══ */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.quick-btn{background:#1E293B;border:1px solid #334155;border-radius:16px;padding:18px 16px;text-align:right;transition:all 0.2s}
.quick-btn:hover{border-color:#3B82F6;transform:translateY(-2px)}
.q-icon{font-size:26px;margin-bottom:8px}
.q-label{font-weight:700;font-size:14px;color:#E2E8F0}
.q-sub{font-size:11px;color:#64748B;margin-top:3px}

/* ═══ TABLE ═══ */
table{width:100%;border-collapse:collapse}
th{text-align:right;padding:10px;font-size:12px;color:#64748B;font-weight:600;border-bottom:1px solid #334155}
td{padding:9px 10px;border-bottom:1px solid #0F172A;font-size:13px;vertical-align:middle}

/* ═══ BUTTONS ═══ */
.btn-add{background:linear-gradient(135deg,#3B82F6,#6366F1);border:none;color:white;border-radius:12px;padding:10px 18px;font-weight:700;font-size:13px;transition:transform 0.1s;box-shadow:0 4px 12px rgba(59,130,246,0.2)}
.btn-add:active{transform:scale(0.97)}
.btn-orange{background:#F59E0B22;color:#FCD34D;border:1px solid #F59E0B66;padding:8px 14px;border-radius:8px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.15s}
.btn-orange:hover{background:#F59E0B33}
.btn-green{background:linear-gradient(135deg,#10B981,#059669);border:none;color:white;border-radius:12px;padding:10px 18px;font-weight:700;font-size:13px;box-shadow:0 4px 12px rgba(16,185,129,0.2)}
.btn-purple{background:linear-gradient(135deg,#A855F7,#7C3AED);border:none;color:white;border-radius:12px;padding:10px 18px;font-weight:700;font-size:13px;box-shadow:0 4px 12px rgba(168,85,247,0.2)}
.btn-sm{padding:5px 12px;border-radius:8px;border:none;font-weight:700;font-size:12px;font-family:inherit;transition:all 0.15s}
.btn-sm:active{transform:scale(0.95)}
.btn-sm-green{background:#10B98122;border:1px solid #10B98144;color:#10B981}
.btn-sm-red{background:#EF444422;border:1px solid #EF444444;color:#EF4444}
.btn-sm-blue{background:#3B82F622;border:1px solid #3B82F644;color:#3B82F6}
.btn-sm-purple{background:#A855F722;color:#C084FC;border:1px solid #A855F744}
.btn-sm-gray{background:#334155;border:1px solid #475569;color:#94A3B8}
.btn-icon{background:none;border:none;font-size:16px;padding:4px;line-height:1}

/* ═══ FORMS ═══ */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-col{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:11px;color:#94A3B8;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.fi{width:100%;background:#0F172A;border:1px solid #334155;border-radius:10px;padding:10px 12px;color:#E2E8F0;font-size:13px;transition:border-color 0.2s}
.fi:focus{border-color:#3B82F6}
.form-actions{display:flex;gap:8px;margin-top:12px}

/* ═══ SCHEDULE GRID ═══ */
.sched-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;max-width:100%}
.sched-table{width:100%;border-collapse:collapse;min-width:900px;table-layout:fixed}
.sched-table th,.sched-table td{text-align:center;padding:8px 6px;vertical-align:top;border:1px solid #33415522}
.sched-table th{background:rgba(30,41,59,0.5);font-size:12px;height:60px}
.sched-table td{min-height:130px;height:auto}
.sched-table th:first-child,.sched-table td:first-child{width:110px;text-align:right;padding:10px 16px;font-weight:800;border:none;cursor:default;border-left:2px solid #334155}
.sched-table td.selected{border:2px solid var(--shift-color,#3B82F6);background:rgba(59,130,246,0.08)}
.sched-table td:not(:first-child):hover{background:#0F172A}
.sched-table td.drag-over{background:rgba(59,130,246,0.2)!important;outline:2px dashed #3B82F6}
.emp-chip{display:flex;flex-direction:column;align-items:stretch;border-radius:8px;padding:6px 8px;margin:3px 2px;font-size:11px;font-weight:600;transition:all 0.15s;line-height:1.3;min-width:0;max-width:100%;overflow:hidden;box-sizing:border-box}
.emp-chip-row{display:flex;align-items:center;gap:4px;min-width:0}
.emp-chip-row > span:nth-child(2){word-break:break-word;min-width:0}
.emp-chip-hours{font-size:9px;opacity:0.85;margin-top:2px}
.emp-chip-tags{font-size:9px;opacity:0.95;margin-top:2px;display:flex;flex-wrap:wrap;gap:2px;min-width:0}
.emp-chip-tag{background:rgba(255,255,255,0.12);border-radius:4px;padding:1px 5px;white-space:normal;word-break:break-word;max-width:100%}
.emp-chip-note{font-size:9px;color:#F59E0B;margin-top:2px;font-style:italic;word-break:break-word;max-width:100%;white-space:normal}
.cell-empty{font-size:10px;color:#334155;padding:8px 0}
.scroll-hint{display:none;font-size:10px;color:#475569;text-align:center;margin-bottom:4px}

/* ═══ WORKLOAD ═══ */
.workload-row{margin-bottom:10px}
.workload-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.workload-bar-bg{height:7px;background:#0F172A;border-radius:4px;overflow:hidden}
.workload-bar-fill{height:100%;border-radius:4px;transition:width 0.5s}

/* ═══ CONSTRAINTS ═══ */
.constraint-table{width:100%;border-collapse:collapse}
.constraint-table th{padding:5px 8px;font-size:11px;color:#94A3B8;font-weight:600;text-align:center}
.constraint-table td{padding:4px 6px;text-align:center}
.constraint-table td:first-child{text-align:right;font-size:12px;color:#94A3B8;font-weight:600;padding:4px 8px}
.constraint-cell{width:38px;height:30px;border-radius:8px;border:1px solid #334155;background:#0F172A;cursor:pointer;font-size:13px;font-weight:700;transition:all 0.15s}
.constraint-cell.allowed{background:var(--sc)33;border-color:var(--sc)88;color:var(--sc)}
.constraint-cell.blocked{background:#EF444418;border-color:#EF444433;color:#EF4444}

/* ═══ MODAL ═══ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#1E293B;border:1px solid #334155;border-radius:20px;padding:28px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,0.6)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-weight:800;font-size:17px;color:#E2E8F0}
.modal-close{background:none;border:none;color:#64748B;font-size:22px;line-height:1;padding:0;transition:color 0.15s}
.modal-close:hover{color:#E2E8F0}

/* ═══ CELL EDITOR ═══ */
.cell-editor{background:#1E293B;border:1px solid #334155;border-radius:16px;padding:18px;margin-bottom:14px}
.cell-editor-title{font-size:13px;font-weight:700;color:#94A3B8;margin-bottom:12px}
.cell-emp-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;margin:3px;font-family:inherit;font-size:13px;transition:all 0.15s}
.cell-emp-btn.assigned{font-weight:700}
.cell-emp-btn:active{transform:scale(0.95)}

/* ═══ ALERTS ═══ */
.alert{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;margin-bottom:8px;font-size:13px;font-weight:600;transition:all 0.15s}
.alert:hover{transform:translateX(-4px)}
.alert-warn{background:#F59E0B18;border:1px solid #F59E0B33;color:#FCD34D}
.alert-info{background:#3B82F618;border:1px solid #3B82F633;color:#60A5FA}

/* ═══ STATUS ═══ */
.status-badge{display:inline-block;border-radius:8px;padding:3px 10px;font-size:11px;font-weight:700}
.status-pending{background:#F59E0B18;color:#F59E0B;border:1px solid #F59E0B33}
.status-approved{background:#10B98118;color:#10B981;border:1px solid #10B98133}
.status-rejected{background:#EF444418;color:#EF4444;border:1px solid #EF444433}

/* ═══ TOAST ═══ */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#10B981;color:white;padding:14px 28px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 8px 32px rgba(0,0,0,0.4);z-index:9999;white-space:nowrap;animation:slideDown 0.3s ease}
.toast.err{background:#EF4444}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ═══ EMPLOYEE VIEW TABS ═══ */
.emp-view-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.ev-tab{padding:8px 14px;border-radius:10px;border:1px solid #334155;background:#1E293B;color:#64748B;font-family:inherit;font-weight:700;font-size:12px;white-space:nowrap;transition:all 0.15s}
.ev-tab:hover{border-color:#475569;color:#94A3B8}
.ev-tab.active{background:#3B82F622;border-color:#3B82F6;color:#60A5FA}

/* ═══ MOBILE BOTTOM NAV ═══ */
.mobile-bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(30,41,59,0.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid #334155;z-index:100;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -4px 20px rgba(0,0,0,0.3)}

/* ═══════════════════════════════════ */
/* ═══ MOBILE RESPONSIVE ═══ */
/* ═══════════════════════════════════ */
/* Mobile schedule view toggle */
.sched-mobile-toggle{display:none;gap:6px;margin-bottom:12px;background:#0F172A;border:1px solid #334155;border-radius:12px;padding:4px}
.sched-mobile-toggle button{flex:1;padding:8px 12px;border-radius:8px;border:none;background:transparent;color:#94A3B8;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.15s}
.sched-mobile-toggle button.active{background:#3B82F6;color:white}
.sched-day-view{display:none}
.sched-day-card{background:#1E293B;border:1px solid #334155;border-radius:12px;margin-bottom:10px;overflow:hidden}
.sched-day-card-header{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #334155}
.sched-day-card-body{padding:10px 14px}
.sched-day-shift-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #0F172A}
.sched-day-shift-row:last-child{border-bottom:none}
.sched-day-shift-label{font-weight:800;font-size:14px;min-width:75px;flex-shrink:0}
.sched-day-shift-hours{font-size:11px;color:#64748B;margin-top:2px}
.sched-day-shift-emps{flex:1;display:flex;flex-direction:column;gap:5px}
.sched-day-nav{display:flex;align-items:center;justify-content:center;gap:8px;background:#0F172A;border:1px solid #334155;border-radius:12px;padding:10px;margin-bottom:12px}

@media(max-width:768px){
  /* Show mobile toggle */
  .sched-mobile-toggle{display:flex !important}
  
  /* Header — hide desktop nav */
  .header .nav{display:none !important}
  .user-name,.user-role-label{display:none}
  .btn-logout{padding:6px 10px;font-size:11px;border-radius:8px}
  .header-inner{height:52px}

  /* Show mobile bottom nav */
  .mobile-bottom-nav{display:flex !important}

  /* Main — bottom padding for nav */
  .main{padding:14px 12px 85px 12px !important}

  /* Cards */
  .card{padding:16px;border-radius:14px}

  /* Forms stack vertically */
  .form-row{grid-template-columns:1fr !important}
  .fi{font-size:16px !important;padding:12px !important}
  .form-label{font-size:12px;margin-bottom:4px}

  /* Section header stacks */
  .section-header{flex-direction:column;align-items:flex-start;gap:10px}
  .section-header > div:last-child{width:100%;display:flex;flex-wrap:wrap;gap:6px}
  .section-header > div:last-child > button{flex:1;min-width:60px;font-size:12px;padding:8px 6px}

  /* KPI + Quick grids: 2 columns */
  .kpi-grid{grid-template-columns:1fr 1fr}
  .quick-grid{grid-template-columns:1fr 1fr}
  .kpi{padding:12px}
  .kpi-val{font-size:20px}

  /* Schedule — horizontal scroll inside card */
  .scroll-hint{display:block !important}
  .sched-wrap{margin:0 -16px;padding:0 16px;width:calc(100% + 32px)}
  .sched-table{min-width:920px}
  .sched-table th.day-header{min-width:115px;padding:6px 3px}
  .sched-table td{padding:4px 3px;height:auto;min-height:80px}
  .sched-table td:first-child{padding:8px 6px;width:70px;font-size:12px;min-height:auto}
  .emp-chip{padding:4px 6px;font-size:10px;margin:2px 1px;border-radius:6px}
  .emp-chip-hours{font-size:8px}
  .emp-chip-tags{font-size:8px}
  .emp-chip-tag{padding:0 4px}
  .emp-chip-note{font-size:8px;max-width:100%}

  /* Modals — bottom sheet style */
  .modal-bg{padding:0;align-items:flex-end}
  .modal{border-radius:20px 20px 0 0;max-height:88vh;width:100%;max-width:100%;padding:24px 16px 32px;animation:slideUp 0.3s ease}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

  /* Hide internal emp-view tabs on mobile — bottom nav handles it */
  .emp-view-tabs{display:none !important}

  /* Employee table → stack on mobile */
  .emp-table thead{display:none}
  .emp-table tbody tr{display:flex;flex-direction:column;background:#0F172A;border:1px solid #334155;border-radius:12px;padding:12px;margin-bottom:10px}
  .emp-table tbody td{border:none;padding:4px 0;font-size:13px}
  .emp-table tbody td:last-child{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid #1E293B}

  /* Buttons */
  .btn-add,.btn-green,.btn-purple{padding:12px 16px;font-size:14px;border-radius:12px;width:100%}
  .btn-sm{padding:6px 10px;font-size:12px}
  .page-title{font-size:20px}

  /* Constraints */
  .constraint-cell{width:40px;height:34px;font-size:14px}
}

@media(max-width:380px){
  .main{padding:10px 8px 85px 8px !important}
  .card{padding:12px}
  .page-title{font-size:18px}
  .kpi-val{font-size:18px}
  .sched-table{min-width:500px}
}

/* Toggle switch */

  vacation: {

  exclusion: {

    enabled: true,
    check: (ctx) => {
      const e = ctx.emp;
      if (e.exclude_from && e.exclude_to && ctx.dateStr >= e.exclude_from && ctx.dateStr <= e.exclude_to) {

    name: "משמרות מותרות",

  maxShifts: {

  // === SCORING RULES ===
  equalDistribution: {
    name: "חלוקה שווה",
    enabled: true,
    check: (ctx) => {
      const count = ctx.totalCount[ctx.emp.id] || 0;
      let score = 0;
      if (count >= ctx.idealShifts + 1) score -= 200;
      if (count < ctx.idealShifts) score += (ctx.idealShifts - count) * 40;
      else score -= (count - ctx.idealShifts) * 50;
      score -= count * 15;
      return { score };
    }
  },
  shiftTypeVariety: {
    name: "גיוון סוגי משמרות",
    enabled: true,
    check: (ctx) => {
      const myShiftCounts = ctx.shiftTypeCount[ctx.emp.id] || {};
      const isMorningOnly = ctx.emp.allowed_shifts && ctx.emp.allowed_shifts.length > 0 && 
        !ctx.emp.allowed_shifts.includes("afternoon") && !ctx.emp.allowed_shifts.includes("night");
      if (isMorningOnly) return { score: 0 };
      
      const morningTotal = (myShiftCounts["morning"]||0) + (myShiftCounts["morning2"]||0);
      const afternoonTotal = myShiftCounts["afternoon"] || 0;
      const nightTotal = myShiftCounts["night"] || 0;
      const isMorningShift = ctx.shiftId === "morning" || ctx.shiftId === "morning2";
      const thisTypeTotal = isMorningShift ? morningTotal : (ctx.shiftId === "afternoon" ? afternoonTotal : nightTotal);
      const minType = Math.min(morningTotal, afternoonTotal, nightTotal);
      const maxType = Math.max(morningTotal, afternoonTotal, nightTotal);
      
      let score = 0;
      if (thisTypeTotal >= 2 && minType === 0) score -= 300;
      score -= thisTypeTotal * 35;
      if (thisTypeTotal === minType) score += 40;
      if (thisTypeTotal < maxType) score += 20;
      return { score };
    }
  },
  weekendFairness: {
    name: "חלוקת סופ״ש שווה",
    enabled: true,
    check: (ctx) => {
      if (!ctx.isWeekend) return { score: 0 };
      const wkCount = ctx.weekendCount[ctx.emp.id] || 0;
      const totalWk = Object.values(ctx.weekendCount).reduce((a,b)=>a+b,0);

  restBetweenShifts: {
    name: "מנוחה בין משמרות",

      return { score };

  },
  consecutiveDays: {
    name: "מניעת רצף ימים",
    enabled: true,
    check: (ctx) => {
      if (ctx.dayIdx < 2) return { score: 0 };

  blockOverIdeal: {
    name: "חסימת חריגה",
    enabled: true,
    check: (ctx) => {
      const count = ctx.totalCount[ctx.emp.id] || 0;
      if (count < ctx.idealShifts + 1) return { score: 0 };
      const someoneBelow = ctx.S.employees.some(o => 
        o.id !== ctx.emp.id && (ctx.totalCount[o.id]||0) < ctx.idealShifts - 1
      );
      if (someoneBelow) return { blocked: true, reason: "אחרים מתחת לממוצע" };
      return { score: 0 };
    }
  }
};

// Run all rules and return final result
function runRules(ctx) {
  let totalScore = 0;
  let blockedReason = null;
  for (const ruleId in RULES) {
    const rule = RULES[ruleId];
    if (!rule.enabled) continue;
    const result = rule.check(ctx);
    if (!result) continue;
    if (result.blocked) {
      blockedReason = ruleId + ": " + (result.reason || "");
      return { blocked: true, reason: blockedReason, score: 0 };
    }
    if (result.score) totalScore += result.score;
  }
  return { blocked: false, score: totalScore };
}

const $ = id => document.getElementById(id);
function e(tag, props={}, children=[]) {
  const el = document.createElement(tag);
  // If props is an array, it's actually children
  if (Array.isArray(props)) { children = props; props = {}; }
  if (typeof props === "string") { children = [props]; props = {}; }
  for(const [k,v] of Object.entries(props)){
    if(v===null||v===undefined||v===false) continue;
    if(k==="class") el.className=v;
    else if(k==="style"&&typeof v==="object") Object.assign(el.style,v);
    // NOTE: a raw "html" prop was removed here — it allowed unsanitized innerHTML (XSS risk).
    // Use text children (auto-escaped via createTextNode) instead. Nothing in the app used it.
    else if(k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v);
  }
  for(const c of (Array.isArray(children)?children:[children])){
    if(c==null||c===false||c===undefined) continue;
    if(typeof c==="string"||typeof c==="number") el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  }
  return el;
}

function shiftDurationHours(startStr, endStr) {
  if (!startStr || !endStr) return 0;
  const [sh,sm] = startStr.split(":").map(Number);

  const shiftTypeCount = {};

  const weekendCount = {};
  schedulableEmployees().forEach(emp => {
    totalCount[emp.id] = 0;
    shiftTypeCount[emp.id] = {};
    weekendCount[emp.id] = 0;
  });

  // Calculate ideal shifts per employee
  const totalSlotsNeeded = (() => {
    let total = 0;
    const wt = S.business?.weekend_targets || {morning:2,night:1};
    const st = S.business?.shift_targets || {morning:2,morning2:1,afternoon:1,night:1};
    weekDates.forEach(d => {
      const dow = d.getDay();
      const isWE = dow === 5 || dow === 6;
      if (isWE) {
        total += (wt.morning||1) + (wt.night||1);
      } else {
        total += (st.morning||2) + (st.morning2||1) + (st.afternoon||1) + (st.night||1);
      }
    });
    return total;
  })();
  const availableEmps = schedulableEmployees().filter(emp => {
    if (emp.exclude_from && emp.exclude_to) {
      const start = emp.exclude_from, end = emp.exclude_to;
      const weekStart = getWeekDates(S.weekOffset)[0];
      const weekEnd = getWeekDates(S.weekOffset)[6];
      if (start <= weekEnd && end >= weekStart) return false;
    }
    return true;
  }).length || 1;
  const idealShifts = Math.round(totalSlotsNeeded / availableEmps);
  console.log("📊 Auto-schedule: " + totalSlotsNeeded + " slots / " + availableEmps + " employees = ideal " + idealShifts + " shifts each");

  // Reorder: weekend FIRST (Fri=5, Sat=6), then weekdays (Sun-Thu)
  const schedOrder = [];
  weekDates.forEach((d,i) => { if (d.getDay()===5||d.getDay()===6) schedOrder.push(i); });
  weekDates.forEach((d,i) => { if (d.getDay()!==5&&d.getDay()!==6) schedOrder.push(i); });

  schedOrder.forEach(dayIdx => {
    const dateObj = weekDates[dayIdx];
    const dateStr = dateObj.getFullYear()+"-"+String(dateObj.getMonth()+1).padStart(2,"0")+"-"+String(dateObj.getDate()).padStart(2,"0");
    const dayName = DAYS[dateObj.getDay()];
    newSched[dateStr] = {};

    const dayOfWeek = dateObj.getDay();
    const isWeekend = dayOfWeek === 5 || dayOfWeek === 6;
    const dayShiftIds = isWeekend ? shiftIds.filter(s => s !== "afternoon" && s !== "morning2") : shiftIds;

    // On weekdays, rotate shift order based on day to prevent patterns
    const shiftOrders = [
      ["night","afternoon","morning2","morning"],   // Sun
      ["morning","night","afternoon","morning2"],   // Mon
      ["afternoon","morning","morning2","night"],   // Tue
      ["night","morning2","morning","afternoon"],   // Wed
      ["morning","afternoon","night","morning2"],   // Thu
    ];
    const orderedShiftIds = isWeekend ? dayShiftIds : 
      (shiftOrders[dayOfWeek] || dayShiftIds).filter(s => dayShiftIds.includes(s));

    orderedShiftIds.forEach((shiftId, shIdx) => {
      const lockedKey = dateStr+"|"+shiftId;
      const lockedEmpIds = S.lockedSlots[lockedKey] ? [...S.lockedSlots[lockedKey]] : [];
      newSched[dateStr][shiftId] = [...lockedEmpIds];
      lockedEmpIds.forEach(id => {
        totalCount[id] = (totalCount[id]||0)+1;
        shiftTypeCount[id][shiftId] = (shiftTypeCount[id][shiftId]||0)+1;
      });

      // Fixed schedule — assign employees with fixed_shifts FIRST
      schedulableEmployees().forEach(emp => {
        if (!emp.fixed_shifts) return;
        const fixedKey = dayOfWeek + "_" + shiftId;
        if (!emp.fixed_shifts[fixedKey]) return;
        if (lockedEmpIds.includes(emp.id)) return;
        if (newSched[dateStr][shiftId].includes(emp.id)) return;
        // Respect max shifts even for fixed schedule
        const empMax = emp.max_shifts_per_week || 5;
        if ((totalCount[emp.id]||0) >= empMax) return;
        // No double shift same day
        const hasOtherShiftToday = SHIFTS.some(s => s.id !== shiftId && (newSched[dateStr]?.[s.id]||[]).includes(emp.id));
        if (hasOtherShiftToday) return;
        // Check exclusions
        const dateStrLocal2 = dateObj.getFullYear()+"-"+String(dateObj.getMonth()+1).padStart(2,"0")+"-"+String(dateObj.getDate()).padStart(2,"0");
        if (emp.exclude_from && emp.exclude_to && dateStrLocal2 >= emp.exclude_from && dateStrLocal2 <= emp.exclude_to) return;
        const onVac2 = (typeof getBlockingVacation === "function") ? !!getBlockingVacation(emp.id, dateStr, shiftId) : S.vacations.some(v => v.employee_id === emp.id && v.status === "approved" && dateStr >= v.start_date && dateStr <= v.end_date);
        if (onVac2) return;
        // Check blocks
        const isBlocked2 = S.availSubmissions.some(s => s.employee_id === emp.id && (s.slots||[]).some(sl => { if (sl.date && sl.date === dateStrLocal2) return sl.shift === shiftId; return false; }));
        if (isBlocked2) return;
        newSched[dateStr][shiftId].push(emp.id);
        totalCount[emp.id] = (totalCount[emp.id]||0)+1;
        shiftTypeCount[emp.id][shiftId] = (shiftTypeCount[emp.id][shiftId]||0)+1;
        if (isWeekend) weekendCount[emp.id] = (weekendCount[emp.id]||0)+1;
      });

      // כמה עובדים דרושים לכל משמרת (ניתן להגדיר בהגדרות)
      const shiftTargets = S.business?.shift_targets || { morning: 2, morning2: 1, afternoon: 1, night: 1 };
      const weekendTargets = S.business?.weekend_targets || { morning: 2, night: 1 };
      const target = isWeekend ? (weekendTargets[shiftId] || 1) : (shiftTargets[shiftId] || 2);
      if (lockedEmpIds.length >= target) return;
      const need = target - lockedEmpIds.length;

      // Score available employees
      // Shuffle employees randomly before scoring
      const shuffledEmps = [...S.employees].sort(() => Math.random() - 0.5);
      const scored = shuffledEmps
        .filter(emp => !lockedEmpIds.includes(emp.id))
        .map(emp => {
          let score = 100;
          const avail = emp.availability || DAYS;
          const preferred = emp.preferred_shifts || [];
          const maxShifts = emp.max_shifts_per_week || 5;
          const dayConstraints = emp.day_constraints || {};

          // Active days check (0=Sun..6=Sat)
          const activeDays = emp.active_days || [0,1,2,3,4,5,6];
          if (!activeDays.includes(dateObj.getDay())) {
            return null;
          }

          // Allowed shifts check
          const empAllowedShifts = emp.allowed_shifts || SHIFTS.map(s=>s.id);
          if (!empAllowedShifts.includes(shiftId)) {
            return null;
          }

          // Temporary exclusion check
          const dateStrLocal = dateObj.getFullYear()+"-"+String(dateObj.getMonth()+1).padStart(2,"0")+"-"+String(dateObj.getDate()).padStart(2,"0");
          if (emp.exclude_from && emp.exclude_to && dateStrLocal >= emp.exclude_from && dateStrLocal <= emp.exclude_to) {
            return null;
          }

          // Hard blocks
          const onVac = S.vacations.some(v =>
            v.employee_id === emp.id && v.status === "approved" &&
            dateStr >= v.start_date && dateStr <= v.end_date
          );
          if (onVac) return null;
          if (!avail.includes(dayName)) return null;
          // Excluded days (permanent)
          if ((emp.excluded_days||[]).includes(dateObj.getDay())) return null;
          // Allowed shifts
          if (emp.allowed_shifts && !emp.allowed_shifts.includes(shiftId)) return null;
          if (dayConstraints[dayName]?.[shiftId] === 0) return null;
          if (totalCount[emp.id] >= maxShifts) return null;
          const perLimit = emp.max_per_shift?.[shiftId];
          if (perLimit != null && (shiftTypeCount[emp.id][shiftId]||0) >= perLimit) return null;

          // Check if employee is allowed on this shift type
          const allowedShifts = emp.preferred_shifts;
          if (allowedShifts && allowedShifts.length > 0 && !allowedShifts.includes(shiftId)) return null;

          // Scoring

          if (preferred.includes(shiftId)) score += 30;
          if (dayConstraints[dayName]?.[shiftId] === 1) score += 20;

          // Block submissions — if employee blocked this shift, skip them
          const dateStr2 = dateObj.toISOString ? (dateObj.getFullYear()+"-"+String(dateObj.getMonth()+1).padStart(2,"0")+"-"+String(dateObj.getDate()).padStart(2,"0")) : dateStr;
          const blockedShiftId = (shiftId === "morning2") ? "morning" : shiftId;
          const isBlocked = S.availSubmissions.some(s =>
            s.employee_id === emp.id &&
            (s.slots||[]).some(sl => {
              const slShift = sl.shift;
              // Match by exact date first
              if (sl.date && sl.date === dateStr2) return slShift === blockedShiftId || slShift === shiftId;
              // Fallback: match by day of week + same week
              if (s.week_start === getWeekDates(S.weekOffset)[0] || s.week_start === getWeekDates(S.weekOffset)[0]) {
                return (slShift === blockedShiftId || slShift === shiftId) && sl.day === dateObj.getDay();
              }
              return false;
            })
          );
          if (isBlocked) return null;

          // Weekend fairness — prefer employees with fewer weekend shifts
          if (isWeekend) {
            score -= (weekendCount[emp.id]||0) * 25;
            // Variety: if employee already has THIS shift type this weekend, penalize
            const sameShiftThisWeekend = weekDates
              .filter(wd => { const d = wd.getDay(); return d === 5 || d === 6; })
              .filter(wd => wd !== dateObj)
              .some(wd => {
                const wdStr = wd.getFullYear()+"-"+String(wd.getMonth()+1).padStart(2,"0")+"-"+String(wd.getDate()).padStart(2,"0");
                return (newSched[wdStr]?.[shiftId]||[]).includes(emp.id);
              });
            if (sameShiftThisWeekend) score -= 40; // penalize same shift type on weekend
          }

          // Avoid exhausting sequences — check yesterday (within this week OR previous week)
          {
            let prevShifts = {};
            if (dayIdx > 0) {
              // Yesterday is in the current week being scheduled
              const pd = weekDates[dayIdx-1];
              const prevDate = pd.getFullYear()+"-"+String(pd.getMonth()+1).padStart(2,"0")+"-"+String(pd.getDate()).padStart(2,"0");
              prevShifts = newSched[prevDate] || {};
            } else {
              // Sunday — yesterday is Saturday of previous week (from saved schedule)
              const yesterday = new Date(dateObj.getTime() - 86400000);
              const yStr = yesterday.getFullYear()+"-"+String(yesterday.getMonth()+1).padStart(2,"0")+"-"+String(yesterday.getDate()).padStart(2,"0");
              prevShifts = (S.schedule && S.schedule[yStr]) || {};
            }

            // night yesterday → morning today = HARD BLOCK
            if (shiftId === "morning" || shiftId === "morning2") {
              if ((prevShifts["night"]||[]).includes(emp.id)) score -= 200;
            }
            // night yesterday → afternoon today = very bad (short rest)
            if (shiftId === "afternoon") {
              if ((prevShifts["night"]||[]).includes(emp.id)) score -= 60;
            }
            // afternoon yesterday → morning today = bad
            if (shiftId === "morning" || shiftId === "morning2") {
              if ((prevShifts["afternoon"]||[]).includes(emp.id)) score -= 40;
            }
          }
          // Restore old block for consecutive days check
          if (dayIdx > 0) {
            const pd = weekDates[dayIdx-1];
            const prevDate = pd.getFullYear()+"-"+String(pd.getMonth()+1).padStart(2,"0")+"-"+String(pd.getDate()).padStart(2,"0");
            const prevShifts = newSched[prevDate] || {};

            // Avoid 3+ consecutive days (8-8-8 pattern)
            if (dayIdx >= 2) {
              const pd2 = weekDates[dayIdx-2];
              const prevDate2 = pd2.getFullYear()+"-"+String(pd2.getMonth()+1).padStart(2,"0")+"-"+String(pd2.getDate()).padStart(2,"0");
              const workedYesterday = SHIFTS.some(s => (prevShifts[s.id]||[]).includes(emp.id));
              const workedDayBefore = SHIFTS.some(s => ((newSched[prevDate2]||{})[s.id]||[]).includes(emp.id));
              if (workedYesterday && workedDayBefore) score -= 25; // 3 days in a row penalty
            }
          }

          // Avoid double shift same day
          const alreadyToday = dayShiftIds.slice(0,shIdx).some(s => (newSched[dateStr][s]||[]).includes(emp.id));
          if (alreadyToday) return null;
          // Also check all shifts (including ones already assigned by fixed schedule)
          const anyShiftToday = SHIFTS.some(s => s.id !== shiftId && (newSched[dateStr]?.[s.id]||[]).includes(emp.id));
          if (anyShiftToday) return null;

          return { emp, score };
        })
        .filter(Boolean)
        .sort((a,b) => {
          const diff = b.score - a.score;
          if (Math.abs(diff) < 5) return Math.random() - 0.5; // random tiebreaker
          return diff;
        });

      const toAdd = scored.slice(0, need).map(s => s.emp.id);
      newSched[dateStr][shiftId].push(...toAdd);
      toAdd.forEach(id => {
        totalCount[id] = (totalCount[id]||0)+1;
        shiftTypeCount[id][shiftId] = (shiftTypeCount[id][shiftId]||0)+1;
        if (isWeekend) weekendCount[id] = (weekendCount[id]||0)+1;
      });
    });
  });

  // Balance pass — if employees are still under-assigned, add to afternoon shifts
  const underAssigned = schedulableEmployees().filter(emp => {
    const count = totalCount[emp.id] || 0;
    return count < idealShifts - 1 && count < (emp.max_shifts_per_week || 5);
  });
  
  if (underAssigned.length > 0) {
    console.log("📊 Balance pass: " + underAssigned.length + " employees under-assigned, trying afternoon overflow");
    // Go through weekdays and try to add them to afternoon
    const weekdayDates = weekDates.filter(d => d.getDay() !== 5 && d.getDay() !== 6);
    for (const emp of underAssigned) {
      for (const dateObj of weekdayDates) {
        if ((totalCount[emp.id]||0) >= idealShifts) break;
        const ds = dateObj.getFullYear()+"-"+String(dateObj.getMonth()+1).padStart(2,"0")+"-"+String(dateObj.getDate()).padStart(2,"0");
        // Check if already working this day
        const worksToday = SHIFTS.some(s => (newSched[ds]?.[s.id]||[]).includes(emp.id));
        if (worksToday) continue;
        // Check active days
        const activeDays = emp.active_days || [0,1,2,3,4,5,6];
        if (!activeDays.includes(dateObj.getDay())) continue;
        // Check allowed shifts
        const empAllowed = emp.allowed_shifts || SHIFTS.map(s=>s.id);
        if (!empAllowed.includes("afternoon")) continue;
        // Check exclusion
        if (emp.exclude_from && emp.exclude_to && ds >= emp.exclude_from && ds <= emp.exclude_to) continue;
        // Check vacation
        const onVac = (typeof getBlockingVacation === "function") ? !!getBlockingVacation(emp.id, ds, "afternoon") : S.vacations.some(v => v.employee_id === emp.id && v.status === "approved" && ds >= v.start_date && ds <= v.end_date);
        if (onVac) continue;
        // Check blocks
        const isBlocked = S.availSubmissions.some(s => s.employee_id === emp.id && (s.slots||[]).some(sl => { if (sl.date && sl.date === ds) return sl.shift === "afternoon"; return false; }));
        if (isBlocked) continue;
        // Check night before / morning after conflicts
        const prevDay = weekDates[weekDates.indexOf(dateObj)-1];
        if (prevDay) {
          const pds = prevDay.getFullYear()+"-"+String(prevDay.getMonth()+1).padStart(2,"0")+"-"+String(prevDay.getDate()).padStart(2,"0");
          if ((newSched[pds]?.["night"]||[]).includes(emp.id)) continue;
        }
        // Add to afternoon
        if (!newSched[ds]["afternoon"]) newSched[ds]["afternoon"] = [];
        if (!newSched[ds]["afternoon"].includes(emp.id)) {
          newSched[ds]["afternoon"].push(emp.id);
          totalCount[emp.id] = (totalCount[emp.id]||0) + 1;
          console.log("📊 Added " + emp.name + " to afternoon on " + ds);
        }
      }
    }
  }

  S.schedule = newSched;
  // Save immediately (no debounce)
  clearTimeout(_saveTimer);
  (async()=>{
    if (!S.profile?.business_id) return;
    const weekStart = getWeekDates(S.weekOffset)[0];
    let { data: sched } = await sb.from("schedules")
      .select("id").eq("business_id", S.profile.business_id).eq("week_start", weekStart).maybeSingle();
    if (!sched) {
      const { data: ns } = await sb.from("schedules")
        .insert({business_id:S.profile.business_id, week_start:weekStart, created_by:S.user.id}).select().single();
      sched = ns;
    }
    if (!sched) return;
    S.schedule.id = sched.id;
    await sb.from("assignments").delete().eq("schedule_id", sched.id);
    const rows = [];
    Object.entries(S.schedule).forEach(([date, shifts]) => {
      if (date === "id" || !shifts || typeof shifts !== "object") return;
      Object.entries(shifts).forEach(([shift, empIds]) => {
        if (!Array.isArray(empIds)) return;
        const unique = [...new Set(empIds)];
        unique.forEach(empId => {
          rows.push({ schedule_id:sched.id, employee_id:empId, date, shift });
        });
      });
    });
    if (rows.length) await sb.from("assignments").upsert(rows, {onConflict: "schedule_id,employee_id,date,shift"});
    logAction("auto_schedule", {week_start:(weekDates[0].getFullYear()+"-"+String(weekDates[0].getMonth()+1).padStart(2,"0")+"-"+String(weekDates[0].getDate()).padStart(2,"0")), count:Object.keys(newSched).length});
  toast("שיבוץ אוטומטי נשמר ✓");
  })();
  render();
}

// ══════════════════════════════════════════════════════
// SCHEDULE HISTORY (Undo/Redo) — stack based, no off-by-one bugs
// ══════════════════════════════════════════════════════
const MAX_HISTORY = 20;

function _snapshotCurrentSchedule(label) {
  return {
    weekOffset: S.weekOffset,
    schedule: JSON.parse(JSON.stringify(S.schedule || {})),
    customHours: JSON.parse(JSON.stringify(S.customHours || {})),
    assignmentNotes: JSON.parse(JSON.stringify(S.assignmentNotes || {})),
    label: label || "שינוי",
    timestamp: Date.now()
  };
}

// Call this BEFORE making a change, with a label describing the change about to happen.
// Pushes the PRE-change state onto the undo stack and clears the redo stack.
function pushScheduleHistory(actionLabel) {
  if (!S.scheduleUndoStack) S.scheduleUndoStack = [];
  S.scheduleUndoStack.push(_snapshotCurrentSchedule(actionLabel));
  if (S.scheduleUndoStack.length > MAX_HISTORY) S.scheduleUndoStack.shift();
  S.scheduleRedoStack = [];
}

function canUndo() {
  return !!(S.scheduleUndoStack && S.scheduleUndoStack.length > 0);
}

function canRedo() {
  return !!(S.scheduleRedoStack && S.scheduleRedoStack.length > 0);
}

// Undo - pop the last pre-change snapshot and restore it; push current live state to redo stack
async function undoSchedule() {
  if (!canUndo()) {
    toast("אין מה לבטל", "err");
    return;
  }
  if (!S.scheduleRedoStack) S.scheduleRedoStack = [];
  S.scheduleRedoStack.push(_snapshotCurrentSchedule("מצב נוכחי"));
  const prev = S.scheduleUndoStack.pop();
  await restoreSnapshot(prev);
  toast("↶ בוטל: " + (prev?.label || "שינוי"));
  render();
}

// Redo - pop the last undone state and restore it; push current live state back to undo stack
async function redoSchedule() {
  if (!canRedo()) {
    toast("אין מה לחזור", "err");
    return;
  }
  if (!S.scheduleUndoStack) S.scheduleUndoStack = [];
  S.scheduleUndoStack.push(_snapshotCurrentSchedule("לפני חזרה"));
  const next = S.scheduleRedoStack.pop();
  await restoreSnapshot(next);
  toast("↷ חזר: " + (next?.label || "שינוי"));
  render();
}

// Restore a snapshot — both in memory and to DB
async function restoreSnapshot(snapshot) {
  if (!snapshot) return;
  
  // Restore state
  S.schedule = JSON.parse(JSON.stringify(snapshot.schedule));
  S.customHours = JSON.parse(JSON.stringify(snapshot.customHours));
  S.assignmentNotes = JSON.parse(JSON.stringify(snapshot.assignmentNotes));
  
  // Persist to DB (use the snapshot's weekOffset to find the right schedule)
  if (!S.profile?.business_id) return;
  const weekStart = getWeekDates(snapshot.weekOffset)[0];
  
  let { data: sched } = await sb.from("schedules")
    .select("id").eq("business_id", S.profile.business_id).eq("week_start", weekStart).maybeSingle();
  if (!sched) {
    const { data: ns } = await sb.from("schedules")
      .insert({business_id:S.profile.business_id, week_start:weekStart, created_by:S.user.id}).select().single();
    sched = ns;
  }
  if (!sched) return;
  
  S.schedule.id = sched.id;
  
  // Delete current and re-insert from snapshot
  await sb.from("assignments").delete().eq("schedule_id", sched.id);
  
  const rows = [];
  Object.entries(S.schedule).forEach(([date, shifts]) => {
    if (date === "id" || !shifts || typeof shifts !== "object") return;
    Object.entries(shifts).forEach(([shift, empIds]) => {
      if (!Array.isArray(empIds)) return;
      const unique = [...new Set(empIds)];
      unique.forEach(empId => {
        const noteKey = date+"|"+shift+"|"+empId;
        const chKey = noteKey;
        const ch = S.customHours[chKey];
        const note = S.assignmentNotes[noteKey];
        rows.push({ 
          schedule_id:sched.id, 
          employee_id:empId, 
          date, 
          shift,
          custom_start: ch?.start || null,
          custom_end: ch?.end || null,
          note: note || null
        });
      });
    });
  });
  if (rows.length) {
    await sb.from("assignments").upsert(rows, {onConflict: "schedule_id,employee_id,date,shift"});
  }
  
  // Invalidate caches
  if (typeof invalidateSwapCache === "function") invalidateSwapCache();
  if (typeof invalidateMonthCache === "function") invalidateMonthCache();
  S.qualHistory = null;
}

// Undo the last auto-schedule run
async function undoAutoSchedule() {
  if (!S.scheduleBackup) {
    toast("אין שיבוץ לבטל", "err");
    return;
  }
  
  if (!confirm("לבטל את השיבוץ האוטומטי האחרון ולחזור למצב הקודם?")) return;
  
  // Restore from backup
  S.schedule = JSON.parse(JSON.stringify(S.scheduleBackup.schedule));
  const backupWeekOffset = S.scheduleBackup.weekOffset;
  
  // Persist to DB
  if (!S.profile?.business_id) return;
  const weekStart = getWeekDates(backupWeekOffset)[0];
  
  let { data: sched } = await sb.from("schedules")
    .select("id").eq("business_id", S.profile.business_id).eq("week_start", weekStart).maybeSingle();
  if (!sched) {
    const { data: ns } = await sb.from("schedules")
      .insert({business_id:S.profile.business_id, week_start:weekStart, created_by:S.user.id}).select().single();
    sched = ns;
  }
  if (!sched) {
    toast("שגיאה בשחזור", "err");
    return;
  }
  
  S.schedule.id = sched.id;
  
  // Delete all current assignments for this week
  await sb.from("assignments").delete().eq("schedule_id", sched.id);
  
  // Insert the backup assignments
  const rows = [];
  Object.entries(S.schedule).forEach(([date, shifts]) => {
    if (date === "id" || !shifts || typeof shifts !== "object") return;
    Object.entries(shifts).forEach(([shift, empIds]) => {
      if (!Array.isArray(empIds)) return;
      const unique = [...new Set(empIds)];
      unique.forEach(empId => {
        rows.push({ schedule_id:sched.id, employee_id:empId, date, shift });
      });
    });
  });
  if (rows.length) {
    await sb.from("assignments").upsert(rows, {onConflict: "schedule_id,employee_id,date,shift"});
  }
  
  // Clear backup
  S.scheduleBackup = null;
  
  // Invalidate caches
  if (typeof invalidateSwapCache === "function") invalidateSwapCache();
  if (typeof invalidateMonthCache === "function") invalidateMonthCache();
  S.qualHistory = null;
  
  if (typeof logAction === "function") logAction("auto_schedule_undone", {week_start: weekStart});
  
  toast("↶ הסידור הוחזר למצב הקודם");
  render();
}

// SUPABASE
// ══════════════════════════════════════════════════════
// Reads ?goto=<target> from the URL and navigates to the matching screen.
// Works for both managers and employees (routing differs by role).
function applyDeepLink() {
  let goto = null;
  try {
    const params = new URLSearchParams(window.location.search);
    goto = params.get("goto");
  } catch (e) { return; }
  if (!goto) return;

  const isMgr = (typeof isManager === "function") ? isManager() : (S.profile?.role !== "employee");

  // Map the goto target to the right view/tab for this role
  switch (goto) {
    case "schedule":
      if (isMgr) { S.view = "schedule"; }
      else { S.view = "empview"; S.empViewTab = "schedule"; }
      break;
    case "vacations":
      if (isMgr) { S.view = "vacations"; }
      else { S.view = "empview"; S.empViewTab = "vacation"; }
      break;
    case "swaps":
      if (isMgr) { S.view = "swaps"; }
      else { S.view = "empview"; S.empViewTab = "swaps_emp"; }
      break;
    case "blocks":
      if (isMgr) { S.view = "blocks"; }
      else { S.view = "empview"; S.empViewTab = "avail"; }
      break;
    case "join":
    case "home":
      S.view = isMgr ? "home" : "empview";
      break;
    case "shifts":
      S.view = "empview"; S.empViewTab = "shifts";
      break;
    default:
      break;
  }

  // Clean the URL so a refresh doesn't re-trigger the deep link
  try {
    const clean = window.location.origin + window.location.pathname;
    window.history.replaceState({}, "", clean);
  } catch (e) {}
}

async function checkAuth() {
  // Check for invitation token in URL
  const params = new URLSearchParams(window.location.search);
  const inviteToken = params.get("invite");
  
  if (inviteToken) {
    // Validate the token
    const { data, error } = await sb.rpc("validate_invitation_token", { p_token: inviteToken });
    if (error || !data || data.length === 0) {
      alert("הלינק לא תקין");
      window.history.replaceState({}, "", window.location.pathname);
    } else {
      const inv = data[0];
      if (!inv.is_valid) {
        const reasons = {
          invalid_token: "הלינק לא תקין",
          already_used: "ההזמנה כבר נוצלה",
          revoked: "ההזמנה בוטלה",
          expired: "ההזמנה פגה"
        };
        alert(reasons[inv.error_reason] || "ההזמנה לא תקפה");
        window.history.replaceState({}, "", window.location.pathname);
      } else {
        // Valid - show special invitation signup
        S.pendingInvitation = {
          token: inviteToken,
          email: inv.email,
          name: inv.name,
          role: inv.role,
          businessName: inv.business_name
        };
        S.loginMode = "accept_invitation";
        S.view = "login";
        render();
        return;
      }
    }
  }
  
  const { data: { session } } = await sb.auth.getSession();
  if (!session?.user) { S.view="login"; render(); return; }
  await loadAll(session.user);
}

// Returns the active acting employee ID:
// - In test-as-employee mode: the viewed employee's ID
// - Otherwise: the logged-in user's ID
function getActiveEmpId() {
  return (S.testAsEmployee && S.empViewId) ? S.empViewId : S.user?.id;
}

// Returns the active acting profile object
function getActiveProfile() {
  if (S.testAsEmployee && S.empViewId) {
    return S.employees.find(e => e.id === S.empViewId) || S.profile;
  }
  return S.profile;
}

function isManager() {
  if (S.testAsEmployee) return false;
  return S.profile?.role === "admin" || S.profile?.role === "manager";
}
function isAdmin() {
  return S.profile?.role === "admin";
}

async function loadAll(user) {
  S.user = user;
  const { data: profile } = await sb.from("profiles")
    .select("*, business:businesses(*)").eq("id", user.id).maybeSingle();
  if (!profile) { S.view="login"; render(); return; }
  
  // 🛡️ הגנה: אם למשתמש המחובר חסר שם במסד הנתונים, ניתן לו שם זמני
  profile.name = profile.name || "משתמש ללא שם";
  
  S.profile = profile;
  S.business = profile.business;
  S.systems = profile.business?.systems || [];  // shared system tags
  S.qualifications = profile.business?.qualifications || {systems:{},shifts:{}};  // qualification expiry days
  
  // Apply saved shift hours from business config
  const savedHours = profile.business?.shift_hours || {};
  if (savedHours.morning?.start) { SHIFTS[0].start = savedHours.morning.start; SHIFTS[0].end = savedHours.morning.end; }
  if (savedHours.morning2?.start) { SHIFTS[1].start = savedHours.morning2.start; SHIFTS[1].end = savedHours.morning2.end; }
  if (savedHours.afternoon?.start) { SHIFTS[2].start = savedHours.afternoon.start; SHIFTS[2].end = savedHours.afternoon.end; }
  if (savedHours.night?.start) { SHIFTS[3].start = savedHours.night.start; SHIFTS[3].end = savedHours.night.end; }
  if (savedHours.weMorning?.start) { WEEKEND_SHIFTS[0].start = savedHours.weMorning.start; WEEKEND_SHIFTS[0].end = savedHours.weMorning.end; }
  if (savedHours.weNight?.start) { WEEKEND_SHIFTS[1].start = savedHours.weNight.start; WEEKEND_SHIFTS[1].end = savedHours.weNight.end; }
  // Old invite code system removed — replaced with secure invitations

  await loadEmployees();
  await Promise.all([loadVacations(), loadSwapRequests(), loadAvailSubmissions(), loadSchedule(), loadInvitations(), loadJoinRequests()]);
  
  // Role-based default view
  if (S.profile.role === "employee") {
    S.view = "empview";
    S.empViewId = S.user.id; // default to self
  } else {
    S.view = "home";
  }

  // Deep link: emails append ?goto=<target> so a link opens the relevant screen.
  applyDeepLink();

  render();
  startAutoRefresh();
  checkAutoReminder();
  setupRealtime();
}

// REALTIME — Supabase live subscriptions
// ══════════════════════════════════════════════════════
let _realtimeChannels = [];
function setupRealtime() {
  // Clean old channels
  _realtimeChannels.forEach(ch => sb.removeChannel(ch));
  _realtimeChannels = [];
  
  if (!S.profile?.business_id) return;
  const bizId = S.profile.business_id;
  
  // Subscribe to schedule changes
  const schedChannel = sb.channel("schedule_changes_" + bizId)
    .on("postgres_changes", {event:"*",schema:"public",table:"schedules",filter:"business_id=eq."+bizId}, 
      () => { if (!isUserBusy()) { loadSchedule().then(()=>render()); } })
    .on("postgres_changes", {event:"*",schema:"public",table:"assignments"}, 
      () => { if (!isUserBusy()) { loadSchedule().then(()=>render()); } })
    .on("postgres_changes", {event:"*",schema:"public",table:"availability_submissions"}, 
      () => { if (!isUserBusy()) { loadAvailSubmissions().then(()=>render()); } })
    .on("postgres_changes", {event:"*",schema:"public",table:"swaps"}, 
      () => { if (!isUserBusy()) { loadSwapRequests().then(()=>render()); } })
    .on("postgres_changes", {event:"*",schema:"public",table:"shift_join_requests"},
      () => { if (!isUserBusy()) { loadJoinRequests().then(()=>render()); } })
    .on("postgres_changes", {event:"*",schema:"public",table:"vacations"}, 
      () => { if (!isUserBusy()) { loadVacations().then(()=>render()); } })
    .on("postgres_changes", {event:"*",schema:"public",table:"profiles",filter:"business_id=eq."+bizId}, 
      () => { if (!isUserBusy()) { loadEmployees().then(()=>render()); } })
    .on("postgres_changes", {event:"*",schema:"public",table:"shift_chat_messages",filter:"business_id=eq."+bizId},
      (payload) => {
        const t = S.chatThread;
        const row = payload.new || payload.old;
        if (t && row && row.date === t.date && row.shift === t.shift) { loadShiftChat(); }
      })
    .subscribe();
  
  _realtimeChannels.push(schedChannel);
  console.log("📡 Realtime subscribed for business: " + bizId);
}

// Personal monthly summary for an employee: shift count/hours breakdown + vacation days used.
// Only counts PUBLISHED schedules, matching what an employee is allowed to see elsewhere.
async function loadMyMonthData(empId, monthInfo) {
  const empty = { shifts: [], totalHours: 0, byShift: {}, vacationDays: 0 };
  const bizId = S.profile?.business_id;
  if (!bizId || !empId) return empty;

  // A week's Sunday (week_start) can fall up to 6 days before the 1st of the month
  // and still contain days that belong to this month, so widen the schedules search.
  const rangeStart = new Date(monthInfo.first);
  rangeStart.setDate(rangeStart.getDate() - 6);

  const { data: scheds } = await sb.from("schedules").select("id")
    .eq("business_id", bizId).eq("published", true)
    .gte("week_start", fmtYMD(rangeStart)).lte("week_start", monthInfo.lastStr);

  const schedIds = (scheds||[]).map(s=>s.id);
  if (schedIds.length === 0) return empty;

  const { data: assigns } = await sb.from("assignments")
    .select("date,shift,custom_start,custom_end")
    .eq("employee_id", empId).in("schedule_id", schedIds)
    .gte("date", monthInfo.firstStr).lte("date", monthInfo.lastStr)
    .order("date");

  const shifts = [];
  const byShift = {};
  let totalHours = 0;
  (assigns||[]).forEach(a => {
    const def = getShiftsForDate(a.date).find(s=>s.id===a.shift) || SHIFT_BY_ID[a.shift];
    const start = a.custom_start ? a.custom_start.slice(0,5) : def?.start;
    const end = a.custom_end ? a.custom_end.slice(0,5) : def?.end;
    const hours = shiftDurationHours(start, end);
    totalHours += hours;
    byShift[a.shift] = (byShift[a.shift]||0) + 1;
    shifts.push({ date: a.date, shift: a.shift, label: def?.label || a.shift, color: def?.color || "#64748B", start, end, hours });
  });

  // Vacation days used this month, from the already-loaded S.vacations
  let vacationDays = 0;
  (S.vacations||[]).forEach(v => {
    if (v.employee_id !== empId || v.status !== "approved") return;
    const s = v.start_date > monthInfo.firstStr ? v.start_date : monthInfo.firstStr;
    const en = v.end_date < monthInfo.lastStr ? v.end_date : monthInfo.lastStr;
    if (s <= en) {
      vacationDays += Math.round((new Date(en+"T00:00:00") - new Date(s+"T00:00:00"))/86400000) + 1;
    }
  });

  return { shifts, totalHours, byShift, vacationDays };
}

// PUSH NOTIFICATIONS — Web Push via service worker + Supabase Edge Function
// ══════════════════════════════════════════════════════
// Public VAPID key — safe to embed client-side (pairs with the private key kept
// only as an Edge Function secret on Supabase).
const VAPID_PUBLIC_KEY = "BDXz-WWumCD7MRs7GFlenjr3jhk7Qmwmk_TAwdSHHu9Rel2pt7cJj7FJsy9CBMYX4FhttjTus2f3HNQDVLB5mhI";

function _urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function enablePushNotifications() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    toast("הדפדפן הזה לא תומך בהתראות Push", "err");
    return;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission !== "granted") {
      toast("לא אושרה הרשאה להתראות", "err");
      render();
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: _urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const raw = sub.toJSON();
    const { error } = await sb.from("push_subscriptions").upsert({
      business_id: S.profile.business_id,
      employee_id: S.user.id,
      endpoint: raw.endpoint,
      p256dh: raw.keys.p256dh,
      auth: raw.keys.auth
    }, { onConflict: "endpoint" });
    if (error) { console.error(error); toast("שגיאה בשמירת ההרשמה להתראות", "err"); return; }
    toast("🔔 התראות Push הופעלו!");
  } catch (err) {
    console.error("Push subscribe failed:", err);
    toast("שגיאה בהפעלת התראות Push", "err");
  }
  render();
}

async function disablePushNotifications() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await sb.from("push_subscriptions").delete().eq("endpoint", sub.endpoint);
      await sub.unsubscribe();
    }
    toast("התראות Push כובו במכשיר הזה");
  } catch (err) {
    console.error("Push unsubscribe failed:", err);
  }
  render();
}

// Send a push notification to one employee, respecting the same per-business
// notification toggles used for email (S.business.notification_settings).
async function sendPush(type, employeeId, data) {
  if (!employeeId) return;
  const settingMap = {
    "schedule_published": "notif_publish",
    "schedule_initial": "notif_publish",
    "vacation_approved": "notif_vac_approved",
    "vacation_rejected": "notif_vac_approved",
    "swap_decision": "notif_swap",
  };
  const settingKey = settingMap[type];
  const notifSettings = S.business?.notification_settings || {};
  if (settingKey && notifSettings[settingKey] === false) return;

  const content = _pushContent(type, data || {});
  try {
    await fetch("https://zszlqoisokjgvplrcbic.supabase.co/functions/v1/rapid-action", {
      method: "POST",
      mode: "cors",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_KEY },
      body: JSON.stringify({
        type: "push",
        to: [employeeId],
        data: { title: content.title, body: content.body, url: _deepLinkUrl(type) }
      })
    });
  } catch (err) {
    console.warn("🔔 Push send failed:", err);
  }
}

function _pushContent(type, data) {
  switch (type) {
    case "schedule_published":
      return { title: "📅 סידור סופי פורסם", body: "שבוע " + (data.weekLabel || "") };
    case "schedule_initial":
      return { title: "📋 סידור ראשוני פורסם", body: "שבוע " + (data.weekLabel || "") };
    case "vacation_approved":
      return { title: "✅ בקשת היעדרות אושרה", body: data.startDate + (data.endDate && data.endDate !== data.startDate ? " עד " + data.endDate : "") };
    case "vacation_rejected":
      return { title: "❌ בקשת היעדרות נדחתה", body: data.rejectReason || "לפרטים פנה למנהל" };
    case "swap_decision":
      return { title: (data.isApproved ? "✅" : "❌") + " בקשת חילוף " + (data.statusText || ""), body: (data.targetDate || "") + " — " + (data.shiftLabel || "") };
    default:
      return { title: "🔔 עדכון חדש", body: "יש עדכון חדש במערכת" };
  }
}

// SHIFT CHAT — small coordination thread per date+shift (e.g. "who's bringing equipment")
// ══════════════════════════════════════════════════════
async function openShiftChat(date, shiftId, shiftLabel) {
  S.chatThread = { date, shift: shiftId, label: shiftLabel };
  S.chatMessages = [];
  S.chatDraft = "";
  S.chatLoading = true;
  render();
  await loadShiftChat();
}

async function loadShiftChat() {
  const t = S.chatThread;
  if (!t || !S.profile?.business_id) return;
  const { data } = await sb.from("shift_chat_messages").select("*")
    .eq("business_id", S.profile.business_id)
    .eq("date", t.date).eq("shift", t.shift)
    .order("created_at");
  S.chatMessages = data || [];
  S.chatLoading = false;
  render();
}

async function sendChatMessage() {
  const t = S.chatThread;
  const msg = (S.chatDraft||"").trim();
  if (!t || !msg || !S.profile?.business_id || !S.user) return;
  S.chatDraft = "";
  render();
  const { error } = await sb.from("shift_chat_messages").insert({
    business_id: S.profile.business_id, date: t.date, shift: t.shift,
    employee_id: S.user.id, message: msg
  });
  if (error) { toast("שגיאה בשליחת ההודעה", "err"); }
  await loadShiftChat();
}

function closeShiftChat() {
  S.chatThread = null;
  S.chatMessages = [];
  S.chatDraft = "";
  render();
}

function viewShiftChatModal() {
  const t = S.chatThread;
  const dt = new Date(t.date+"T00:00:00");
  const header = DAYS[dt.getDay()] + " " + dt.getDate() + "/" + (dt.getMonth()+1) + " · " + t.label;

  let body;
  if (S.chatLoading) {
    body = [e("div",{style:"text-align:center;padding:24px;color:#64748B"},"⏳ טוען...")];
  } else if (S.chatMessages.length === 0) {
    body = [e("div",{style:"text-align:center;padding:24px;color:#64748B"},"אין הודעות עדיין — תתאמו כאן 👋")];
  } else {
    body = S.chatMessages.map(m => {
      const sender = getEmp(m.employee_id);
      const isMine = m.employee_id === S.user?.id;
      const c = sender ? ec(empIdx(sender.id)) : "#64748B";
      return e("div",{style:`align-self:${isMine?"flex-end":"flex-start"};max-width:82%;background:${isMine?"#3B82F622":"#1E293B"};border:1px solid ${isMine?"#3B82F644":"#33415566"};border-radius:12px;padding:8px 12px`},[
        !isMine ? e("div",{style:"font-size:10px;font-weight:700;color:"+c+";margin-bottom:2px"},escHtml(sender?.name?.split(" ")[0]||"?")) : null,
        e("div",{style:"font-size:13px;color:#E2E8F0;white-space:pre-wrap;word-break:break-word"},escHtml(m.message)),
        e("div",{style:`font-size:9px;color:#64748B;margin-top:3px;text-align:${isMine?"left":"right"}`},new Date(m.created_at).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}))
      ]);
    });
  }

  return div("modal-bg",[
    div("modal",[
      div("modal-header",[
        div("modal-title",["💬 "+header]),
        btn("modal-close","✕",closeShiftChat)
      ]),
      e("div",{style:"max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;padding:4px"},body),
      e("div",{style:"display:flex;gap:8px"},[
        e("input",{class:"fi",style:"flex:1",placeholder:"כתוב הודעה...",value:S.chatDraft,
          oninput:ev=>{S.chatDraft=ev.target.value;},
          onkeydown:ev=>{if(ev.key==="Enter"){ev.preventDefault();sendChatMessage();}}
        }),
        btn("btn-add","שלח",sendChatMessage)
      ])
    ])
  ],{onclick:ev=>{if(ev.target.classList.contains("modal-bg")) closeShiftChat();}});
}

async function loadSchedule() {
  // Clear undo/redo history when loading fresh data
  S.scheduleUndoStack = [];
  S.scheduleRedoStack = [];

  if (!S.profile?.business_id) return;
  const weekDates = getWeekDates(S.weekOffset);
  const weekStart = weekDates[0];
  const { data: sched } = await sb.from("schedules")
    .select("*").eq("business_id", S.profile.business_id)
    .eq("week_start", weekStart).maybeSingle();

  if (!sched) { S.schedule={}; S.currentPublishType=null; return; }
  // Employee can only see published schedules (strict check)
  const userIsEmployee = S.profile?.role === "employee";
  if (userIsEmployee && !sched.published) { S.schedule={}; S.currentPublishType=null; return; }
  if (!isManager() && !sched.published) { S.schedule={}; S.currentPublishType=null; return; }
  if (sched.published) {
    if (sched.publish_type === "final") {
      S.publishedWeeks.add(weekStart);
    }
    S.publishedInitial = S.publishedInitial || new Set();
    if (sched.publish_type === "initial" || sched.published) S.publishedInitial.add(weekStart);
    S.schedPublishType = S.schedPublishType || {};
    S.schedPublishType[weekStart] = sched.publish_type || (sched.published ? "final" : null);
  }

  const { data: assignments } = await sb.from("assignments")
    .select("*").eq("schedule_id", sched.id);

  const sched_obj = {};
  weekDates.forEach(d => {
    sched_obj[d] = {};
    SHIFTS.forEach(sh => { sched_obj[d][sh.id] = []; });
  });
  (assignments||[]).forEach(a => {
    if (!sched_obj[a.date]) sched_obj[a.date] = {};
    if (!sched_obj[a.date][a.shift]) sched_obj[a.date][a.shift] = [];
    if (!sched_obj[a.date][a.shift].includes(a.employee_id)) sched_obj[a.date][a.shift].push(a.employee_id);
    if (a.custom_start && a.custom_end) {
      S.customHours[a.date+"|"+a.shift+"|"+a.employee_id] = {start:a.custom_start,end:a.custom_end};
    }
    if (a.note) {
      S.assignmentNotes[a.date+"|"+a.shift+"|"+a.employee_id] = a.note;
    }
  });
  S.schedule = sched_obj;
}

// EMAIL NOTIFICATIONS via Supabase Edge Function + Resend
// ══════════════════════════════════════════════════════
const APP_URL = "https://shiftpmosoc.com/";

// Email queue with rate limiting (Resend: 2/sec limit)
// Map each email type to the screen its link should open (?goto=<target>).
function _deepLinkUrl(type) {
  const base = APP_URL.replace(/\/$/, "");
  const map = {
    schedule_published:    "schedule",
    schedule_initial:      "schedule",
    schedule_full_view:    "schedule",
    schedule_preview_full: "schedule",
    vacation_approved:     "vacations",
    vacation_rejected:     "vacations",
    absence_request:       "vacations",
    swap_request:          "swaps",
    swap_decision:         "swaps",
    block_message:         "blocks",
    reminder:              "blocks",
  };
  const goto = map[type];
  return goto ? (base + "/?goto=" + goto) : (base + "/");
}

const _emailQueue = [];
let _emailProcessing = false;

async function _processEmailQueue() {
  if (_emailProcessing) return;
  _emailProcessing = true;
  while (_emailQueue.length > 0) {
    const { type, toEmail, data, retries } = _emailQueue.shift();
    try {
      const resp = await fetch("https://zszlqoisokjgvplrcbic.supabase.co/functions/v1/rapid-action", {
        method: "POST",
        mode: "cors",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + SUPABASE_KEY,
        },
        body: JSON.stringify({ type, to: toEmail, data: { ...data, appUrl: _deepLinkUrl(type) } })
      });
      
      // Handle rate limit with retry
      if (resp.status === 429 && retries < 3) {
        console.warn("📧 Rate limited, retry in 2s:", toEmail);
        _emailQueue.unshift({ type, toEmail, data, retries: retries + 1 });
        await new Promise(r => setTimeout(r, 2000));
        continue;
      }
      
      const result = await resp.json().catch(()=>({}));
      if (resp.status >= 200 && resp.status < 300) {
        console.log("📧 ✓ Sent:", type, "to:", toEmail);
      } else {
        console.warn("📧 ✗ Failed:", resp.status, result);
      }
    } catch (err) {
      console.warn("📧 Network error:", err);
    }
    // Throttle: wait 600ms between requests (~1.6/sec, safe under 2/sec limit)
    await new Promise(r => setTimeout(r, 600));
  }
  _emailProcessing = false;
}

let _saveTimer = null;
function saveScheduleToDB() {
  clearTimeout(_saveTimer);
  
  _saveTimer = setTimeout(async () => {
    if (!S.profile?.business_id) return;
    const weekDates = getWeekDates(S.weekOffset);
    const weekStart = weekDates[0];

    try {
      // משיכת או יצירת רשומת סידור לשבוע הנוכחי
      let { data: sched, error: schedError } = await sb.from("schedules")
        .select("id").eq("business_id", S.profile.business_id).eq("week_start", weekStart).maybeSingle();
        
      if (schedError && schedError.code !== "PGRST116") throw schedError; // מתעלם משגיאת "לא נמצא" רגילה

      if (!sched) {
        const { data: ns, error: insertError } = await sb.from("schedules")
          .insert({business_id: S.profile.business_id, week_start: weekStart, created_by: S.user.id}).select().single();
        if (insertError) throw insertError;
        sched = ns;
      }
      
      if (!sched) return;

      // מחיקת כל השיבוצים הקודמים לאותו שבוע בשרת
      const { error: deleteError } = await sb.from("assignments").delete().eq("schedule_id", sched.id);
      if (deleteError) throw deleteError;

      // הרכבת מערך השיבוצים החדש
      const rows = [];
      Object.entries(S.schedule).forEach(([date, shifts]) => {
        // דילוג חכם: מתעלם ממאפיינים שאינם תאריכים (כמו id שנוסף בשיבוץ האוטומטי)
        if (date === "id" || typeof shifts !== "object") return;
        
        Object.entries(shifts).forEach(([shift, empIds]) => {
          if (!Array.isArray(empIds)) return;
          const uniqueEmpIds = [...new Set(empIds)];
          uniqueEmpIds.forEach(empId => {
            const ch = S.customHours[date+"|"+shift+"|"+empId];
            const noteVal = S.assignmentNotes[date+"|"+shift+"|"+empId];
            rows.push({ schedule_id: sched.id, employee_id: empId, date, shift,
              custom_start: ch?.start||null, custom_end: ch?.end||null,
              note: noteVal||null });
          });
        });
      });

      // שמירת השיבוצים במסד הנתונים
      if (rows.length > 0) {
        const { error: assignError } = await sb.from("assignments").upsert(rows, 
          {onConflict: "schedule_id,employee_id,date,shift"});
        if (assignError) throw assignError;
      }
      
      // Schedule changed — invalidate swap cache so other weeks are reloaded next view
      invalidateSwapCache();

    } catch (err) {
      console.error("🚨 שגיאת שמירה:", err);
      toast("שגיאה בשמירה למסד הנתונים: " + (err.message || err.details || ""), "err");
    }
    silentRefresh();
  }, 800);
}

async function handleAcceptInvitation(name, password, token, email) {
  if (!name?.trim()) throw new Error("נא להזין שם");
  if (!password || password.length < 6) throw new Error("סיסמה חייבת להיות לפחות 6 תווים");
  
  // Sign up the user with the email from the invitation
  const { data: auth, error: signupError } = await sb.auth.signUp({
    email: email,
    password: password,
    options: { data: { name: name.trim() } }
  });
  if (signupError) throw signupError;
  if (!auth.user) throw new Error("שגיאה ביצירת המשתמש");
  
  // Consume the invitation
  const { data: consumeResult, error: consumeError } = await sb.rpc("consume_invitation", {
    p_token: token,
    p_user_id: auth.user.id
  });
  
  if (consumeError) throw consumeError;
  const result = consumeResult?.[0];
  if (!result?.success) {
    const reasons = {
      invalid_token: "הלינק לא תקין",
      already_used: "ההזמנה כבר נוצלה",
      revoked: "ההזמנה בוטלה",
      expired: "ההזמנה פגה",
      used: "ההזמנה כבר נוצלה"
    };
    throw new Error(reasons[result?.error_reason] || "שגיאה בקבלת ההזמנה");
  }
  
  // Clean up URL
  window.history.replaceState({}, "", window.location.pathname);
  S.pendingInvitation = null;
  S.loginMode = "login";
  
  // Load app
  await loadAll(auth.user);
}
